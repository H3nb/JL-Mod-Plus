version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: alpha
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Makassar
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /
    target-branch: alpha
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Makassar
    open-pull-requests-limit: 3
