name: Diagnostic Report
description: Report a problem using a diagnostic bundle generated by JL-Mod Plus.
title: ""
body:
  - type: textarea
    id: user-context
    attributes:
      label: What were you doing when the problem occurred?
      description: Describe what you were doing, what you expected, and what you observed.
      placeholder: I was...
    validations:
      required: true

  - type: textarea
    id: diagnostic-summary
    attributes:
      label: Diagnostic summary
      description: Automatically generated by JL-Mod Plus. You normally do not need to edit this.
    validations:
      required: true

  - type: upload
    id: diagnostic-bundle
    attributes:
      label: Diagnostic bundle
      description: Upload the ZIP generated by JL-Mod Plus. It normally lives in Downloads → JL-Mod Plus Diagnostics.
    validations:
      required: true
      accept: ".zip"
