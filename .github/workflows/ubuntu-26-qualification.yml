name: Ubuntu 26.04 qualification

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: ubuntu-26-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-native:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 55

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Validate debug, tests, lint, and screenshots
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --profile --continue \
            --configuration-cache --configuration-cache-problems=fail \
            :app:assembleEmulatorDebug \
            :app:testEmulatorDebugUnitTest \
            :dexlib:testDebugUnitTest \
            :app:assembleEmulatorDebugAndroidTest

          ./gradlew --daemon --stacktrace --profile --continue \
            --configuration-cache --configuration-cache-problems=fail \
            -PjlmodNativeBuild=false \
            :app:lintEmulatorDebug \
            :app:validateEmulatorDebugScreenshotTest

      - name: Assemble all-ABI release
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile \
            --configuration-cache --configuration-cache-problems=fail \
            :app:assembleEmulatorRelease

      - name: Verify native release contracts
        shell: bash
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/emulator/release'
          mapfile -t apks < <(find "$out" -maxdepth 1 -type f -name '*.apk' | sort)
          [[ ${#apks[@]} -eq 5 ]] || {
            printf 'Expected five release APKs, found %d\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          }

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          zipalign="$ANDROID_HOME/build-tools/$build_tools/zipalign"
          [[ -x "$zipalign" ]]
          for apk in "${apks[@]}"; do
            "$zipalign" -c -P 16 -v 4 "$apk"
          done

          armv7="$(find "$out" -maxdepth 1 -type f -name '*armeabi-v7a*.apk' -print -quit)"
          arm64="$(find "$out" -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)"
          universal="$(python3 - <<'PY'
import json
from pathlib import Path
p=Path('app/build/outputs/apk/emulator/release/output-metadata.json')
m=json.loads(p.read_text())
for e in m['elements']:
    if not e.get('filters'):
        print(p.parent/e['outputFile'])
        break
PY
          )"
          [[ -f "$armv7" && -f "$arm64" && -f "$universal" ]]

          for lib in avformat avcodec avutil swresample; do
            unzip -Z1 "$armv7" | grep -Fxq "lib/armeabi-v7a/lib${lib}_neon.so"
            ! unzip -Z1 "$armv7" | grep -Fxq "lib/armeabi-v7a/lib${lib}.so"
            unzip -Z1 "$arm64" | grep -Fxq "lib/arm64-v8a/lib${lib}.so"
            ! unzip -Z1 "$arm64" | grep -Fxq "lib/arm64-v8a/lib${lib}_neon.so"
          done

          rm -rf elf-check
          mkdir elf-check
          unzip -q "$universal" 'lib/*/*.so' -d elf-check
          readelf="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [[ -x "$readelf" ]]
          READELF="$readelf" python3 - <<'PY'
import os, pathlib, re, subprocess, sys
readelf=os.environ['READELF']
bad=[]
checked=0
for so in sorted(pathlib.Path('elf-check/lib').glob('*/*.so')):
    out=subprocess.check_output([readelf,'-lW',str(so)], text=True)
    aligns=[]
    for line in out.splitlines():
        if line.lstrip().startswith('LOAD '):
            token=line.split()[-1]
            aligns.append(int(token,16))
    if not aligns:
        bad.append((str(so),'no LOAD segments'))
        continue
    checked += 1
    if min(aligns) < 0x4000:
        bad.append((str(so),f'min LOAD alignment 0x{min(aligns):x}'))
if checked == 0 or bad:
    print('16 KiB ELF alignment failure:', bad, file=sys.stderr)
    sys.exit(1)
print(f'PASS 16 KiB ELF LOAD alignment: {checked} shared libraries')
PY

          "$ANDROID_HOME/ndk/30.0.16248370/ndk-build" --version >/dev/null

      - name: Upload Ubuntu 26 build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-26-build-diagnostics
          path: |
            build/reports/problems/**
            build/reports/profile/**
            app/build/reports/lint-results-*.xml
            app/build/reports/screenshotTest/**
            app/build/outputs/apk/emulator/release/output-metadata.json
          if-no-files-found: warn
          retention-days: 7

  runtime:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native audio and M3G runtime subset
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.media.MediaBoundaryRuntimeTest#generatedSynthesisSampledAndVideoShareOutputAndSeekDrainsVideo,javax.microedition.media.LegacySmafConversionTest#waveformPreservesMonoStereoAndUtf8PathsWithoutOpeningOutput,javax.microedition.m3g.M3GRuntimeTest#cameraAndLightTransformsCrossJniWithJsr184Semantics,javax.microedition.m3g.M3GRuntimeTest#immediateRenderingExecutesOn64BitNativeBackend,javax.microedition.m3g.M3GRuntimeTest#objectReferenceArraysAndDuplicateRoundTripThroughJni
            :app:connectedEmulatorDebugAndroidTest
