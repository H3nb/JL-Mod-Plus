name: Finalize Memory Editor feedback

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/finalize-memory-editor-feedback.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545
      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          "$sdkmanager_path" 'platforms;android-37.0'
      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
      - name: Apply device feedback and remove legacy UI paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Reuse the already-reviewed device-feedback patch, but commit only after the final
          # cleanup/build pass below succeeds.
          staged = Path('.github/workflows/patch-memory-editor-device-feedback.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          start = staged.index(begin) + len(begin)
          end = staged.index("\n          PY", start)
          embedded = staged[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, '<device-feedback-patch>', 'exec'), {})

          runtime_path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorRuntimeCompose.kt')
          runtime = runtime_path.read_text()

          # Repair the production Results call structurally (the staged patch intentionally did
          # not depend on this call site's exact whitespace).
          call_start = runtime.index('RuntimeMemoryTab.SEARCH_RESULTS -> RuntimeSearchResultsTab(')
          call_tail = runtime.index('modifier = Modifier.weight(1f),', call_start)
          if 'onInspectSelected' not in runtime[call_start:call_tail]:
              line_start = runtime.rfind('\n', call_start, call_tail) + 1
              indent = runtime[line_start:call_tail]
              runtime = (
                  runtime[:line_start]
                  + indent + 'onInspectSelected = { tab = RuntimeMemoryTab.INSPECTOR },\n'
                  + runtime[line_start:]
              )

          # The old overlay resource file is no longer an architecture boundary. Move only the
          # expression hints still used by production into the canonical Memory Editor strings.
          resource_renames = {
              'memory_editor_overlay_single_hint': 'memory_editor_expression_single_hint',
              'memory_editor_overlay_group_needs_type': 'memory_editor_expression_group_needs_type',
              'memory_editor_overlay_group_hint': 'memory_editor_expression_group_hint',
              'memory_editor_overlay_query_help': 'memory_editor_expression_query_help',
              'memory_editor_overlay_ordered_group_unsupported': 'memory_editor_expression_ordered_group_unsupported',
          }
          for old, new in resource_renames.items():
              runtime = runtime.replace(f'R.string.{old}', f'R.string.{new}')

          # The production runtime owns Inspector presentation now. Give its pure cell helpers
          # stable non-legacy names so tests do not need the removed Stage-3 UI implementation.
          for old, new in {
              'RuntimeInspectorCell': 'MemoryInspectorCell',
              'runtimeInspectorCells': 'buildInspectorCells',
              'runtimeTypeWidth': 'inspectorTypeWidth',
              'runtimeReadBits': 'inspectorReadBits',
              'runtimeFormatBits': 'inspectorFormatBits',
          }.items():
              runtime = runtime.replace(old, new)
          runtime = runtime.replace('private data class MemoryInspectorCell(', 'internal data class MemoryInspectorCell(', 1)
          runtime = runtime.replace('private fun buildInspectorCells(', 'internal fun buildInspectorCells(', 1)
          runtime = runtime.replace('private fun inspectorTypeWidth(', 'internal fun inspectorTypeWidth(', 1)
          runtime = runtime.replace('private fun inspectorReadBits(', 'internal fun inspectorReadBits(', 1)
          runtime = runtime.replace('private fun inspectorFormatBits(', 'internal fun inspectorFormatBits(', 1)

          # Accessibility: the toolbar master checkbox must explain whether it will select or
          # clear the currently materialized result page.
          if 'import androidx.compose.ui.semantics.contentDescription\n' not in runtime:
              runtime = runtime.replace(
                  'import androidx.compose.ui.res.stringResource\n',
                  'import androidx.compose.ui.res.stringResource\n'
                  'import androidx.compose.ui.semantics.contentDescription\n'
                  'import androidx.compose.ui.semantics.semantics\n',
                  1,
              )
          checkbox = '''            Checkbox(\n                checked = allVisibleSelected,\n                enabled = state.results.isNotEmpty() && !state.busy,\n                onCheckedChange = { checked ->\n                    if (checked) actions.selectVisible() else actions.clearSelection()\n                },\n            )'''
          checkbox_replacement = '''            val visibleSelectionDescription = stringResource(\n                if (allVisibleSelected) R.string.memory_editor_clear_selection\n                else R.string.memory_editor_select_visible,\n            )\n            Checkbox(\n                checked = allVisibleSelected,\n                enabled = state.results.isNotEmpty() && !state.busy,\n                onCheckedChange = { checked ->\n                    if (checked) actions.selectVisible() else actions.clearSelection()\n                },\n                modifier = Modifier.semantics {\n                    contentDescription = visibleSelectionDescription\n                },\n            )'''
          if checkbox not in runtime:
              raise SystemExit('master result checkbox block not found after device patch')
          runtime = runtime.replace(checkbox, checkbox_replacement, 1)
          runtime_path.write_text(runtime)

          # Keep system bars hidden if focus/resume ordering differs across Android/OEM versions.
          activity_path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorActivity.kt')
          activity = activity_path.read_text()
          resume_anchor = '''    override fun onWindowFocusChanged(hasFocus: Boolean) {\n        super.onWindowFocusChanged(hasFocus)\n        if (hasFocus) hideSystemBars()\n    }\n'''
          if 'override fun onResume()' not in activity:
              activity = activity.replace(
                  resume_anchor,
                  '''    override fun onResume() {\n        super.onResume()\n        hideSystemBars()\n    }\n\n''' + resume_anchor,
                  1,
              )
          activity_path.write_text(activity)

          # Sync the debug benchmark with the searchOperation callback bit added for the bubble.
          benchmark_path = Path('app/src/debug/java/ru/playsoftware/j2meloader/memory/MemoryEngineBenchmarkRunner.java')
          benchmark = benchmark_path.read_text()
          benchmark = benchmark.replace(
              'public void onOperationProgress(long operationId, long scannedBytes, long totalBytes) {',
              'public void onOperationProgress(long operationId, long scannedBytes, long totalBytes,\n'
              '\t\t\t                                boolean searchOperation) {',
              1,
          )
          benchmark = benchmark.replace(
              'String nativeMessage, boolean passiveRefresh) {',
              'String nativeMessage, boolean passiveRefresh, boolean searchOperation) {',
              1,
          )
          benchmark_path.write_text(benchmark)

          # The production runtime uses only input validation; the old Compose input session,
          # disabled TextField shim, cursor painter, and keypad tree are dead code now.
          Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputModel.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\ninternal enum class MemoryInputKind {\n    SIGNED_INTEGER,\n    UNSIGNED_INTEGER,\n    FLOATING,\n    POSITIVE_INTEGER,\n}\n\n/** Validation contract shared by the production search/edit/Inspector value fields. */\ninternal data class MemoryInputSpec(\n    val kind: MemoryInputKind,\n    val minLong: Long? = null,\n    val maxLong: Long? = null,\n    val floatingBits: Int = 64,\n    val maxChars: Int = 48,\n) {\n    val signed: Boolean get() = kind == MemoryInputKind.SIGNED_INTEGER || kind == MemoryInputKind.FLOATING\n    val decimal: Boolean get() = kind == MemoryInputKind.FLOATING\n    val exponent: Boolean get() = kind == MemoryInputKind.FLOATING\n\n    companion object {\n        fun forType(type: Int): MemoryInputSpec = when (type) {\n            MemoryEngineContract.TYPE_BYTE -> MemoryInputSpec(\n                MemoryInputKind.SIGNED_INTEGER, Byte.MIN_VALUE.toLong(), Byte.MAX_VALUE.toLong(), maxChars = 4,\n            )\n            MemoryEngineContract.TYPE_SHORT -> MemoryInputSpec(\n                MemoryInputKind.SIGNED_INTEGER, Short.MIN_VALUE.toLong(), Short.MAX_VALUE.toLong(), maxChars = 6,\n            )\n            MemoryEngineContract.TYPE_CHAR -> MemoryInputSpec(\n                MemoryInputKind.UNSIGNED_INTEGER, 0L, 0xffffL, maxChars = 5,\n            )\n            MemoryEngineContract.TYPE_INT -> MemoryInputSpec(\n                MemoryInputKind.SIGNED_INTEGER, Int.MIN_VALUE.toLong(), Int.MAX_VALUE.toLong(), maxChars = 11,\n            )\n            MemoryEngineContract.TYPE_LONG -> MemoryInputSpec(\n                MemoryInputKind.SIGNED_INTEGER, Long.MIN_VALUE, Long.MAX_VALUE, maxChars = 20,\n            )\n            MemoryEngineContract.TYPE_FLOAT -> MemoryInputSpec(MemoryInputKind.FLOATING, floatingBits = 32)\n            MemoryEngineContract.TYPE_DOUBLE, MemoryEngineContract.TYPE_AUTO ->\n                MemoryInputSpec(MemoryInputKind.FLOATING, floatingBits = 64)\n            else -> MemoryInputSpec(MemoryInputKind.FLOATING)\n        }\n\n        fun positiveInteger(min: Long = 1, max: Long? = null): MemoryInputSpec = MemoryInputSpec(\n            MemoryInputKind.POSITIVE_INTEGER, minLong = min, maxLong = max, maxChars = 12,\n        )\n    }\n}\n\ninternal fun MemoryInputSpec.acceptsPartial(text: String): Boolean {\n    if (text.length > maxChars) return false\n    if (text.isEmpty()) return true\n    return when (kind) {\n        MemoryInputKind.SIGNED_INTEGER -> text.indices.all { index ->\n            val char = text[index]\n            char.isDigit() || (char == '-' && index == 0)\n        }\n        MemoryInputKind.UNSIGNED_INTEGER, MemoryInputKind.POSITIVE_INTEGER -> text.all(Char::isDigit)\n        MemoryInputKind.FLOATING -> acceptsPartialFloating(text)\n    }\n}\n\nprivate fun acceptsPartialFloating(text: String): Boolean {\n    var seenDot = false\n    var seenExponent = false\n    var mantissaDigits = 0\n    for (index in text.indices) {\n        when (val char = text[index]) {\n            in '0'..'9' -> if (!seenExponent) mantissaDigits++\n            '-' -> if (index != 0 && text[index - 1] != 'e' && text[index - 1] != 'E') return false\n            '+' -> if (index == 0 || (text[index - 1] != 'e' && text[index - 1] != 'E')) return false\n            '.' -> {\n                if (seenDot || seenExponent) return false\n                seenDot = true\n            }\n            'e', 'E' -> {\n                if (seenExponent || mantissaDigits == 0) return false\n                seenExponent = true\n            }\n            else -> return false\n        }\n    }\n    return true\n}\n\ninternal fun MemoryInputSpec.isComplete(text: String): Boolean {\n    if (text.isBlank() || !acceptsPartial(text)) return false\n    return when (kind) {\n        MemoryInputKind.SIGNED_INTEGER, MemoryInputKind.UNSIGNED_INTEGER, MemoryInputKind.POSITIVE_INTEGER -> {\n            val value = text.toLongOrNull() ?: return false\n            (minLong == null || value >= minLong) && (maxLong == null || value <= maxLong)\n        }\n        MemoryInputKind.FLOATING -> if (floatingBits == 32) {\n            text.toFloatOrNull()?.isFinite() == true\n        } else {\n            text.toDoubleOrNull()?.isFinite() == true\n        }\n    }\n}\n''')

          # Remove state/API remnants that existed only to support the superseded in-MIDlet UI.
          models_path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorModels.kt')
          models = models_path.read_text()
          models = models.replace('    val bubbleEnabled: Boolean = false,\n', '', 1)
          legacy_parser = models.find('/**\n * Legacy typed group parser retained for unit tests')
          if legacy_parser >= 0:
              models = models[:legacy_parser].rstrip() + '\n'
          models_path.write_text(models)

          # Screenshot previews render production RuntimeRoot directly; bubbleEnabled belonged to
          # the deleted pre-compose path and should not survive as fake state.
          for path in Path('app/src').rglob('*.kt'):
              text = path.read_text()
              updated = re.sub(r'^\s*bubbleEnabled = (?:true|false),\n', '', text, flags=re.M)
              if updated != text:
                  path.write_text(updated)

          # Canonical resources: migrate the five active expression hints and the active keypad
          # clear label, then delete overlay/input-only resource files.
          english_strings = {
              'memory_editor_expression_single_hint': 'Enter one value, or use ; to search nearby values together.',
              'memory_editor_expression_group_needs_type': 'Choose a specific data type for Group Search.',
              'memory_editor_expression_group_hint': 'Group Search · %1$d values · within %2$d bytes',
              'memory_editor_expression_query_help': 'Examples: 500 · 500;1000 · 500;1000:128',
              'memory_editor_expression_ordered_group_unsupported': 'Ordered group syntax (::) is not supported by the current engine yet. Use : for a normal group.',
              'memory_editor_keypad_clear': 'Clear',
          }
          indonesian_strings = {
              'memory_editor_expression_single_hint': 'Masukkan satu nilai, atau gunakan ; untuk mencari beberapa nilai berdekatan.',
              'memory_editor_expression_group_needs_type': 'Pilih jenis data tertentu untuk Pencarian Grup.',
              'memory_editor_expression_group_hint': 'Pencarian Grup · %1$d nilai · dalam %2$d byte',
              'memory_editor_expression_query_help': 'Contoh: 500 · 500;1000 · 500;1000:128',
              'memory_editor_expression_ordered_group_unsupported': 'Sintaks grup berurutan (::) belum didukung engine saat ini. Gunakan : untuk grup biasa.',
              'memory_editor_keypad_clear': 'Bersihkan',
          }
          def add_strings(path_str, additions):
              path = Path(path_str)
              text = path.read_text()
              missing = []
              for name, value in additions.items():
                  if f'name="{name}"' not in text:
                      missing.append(f'    <string name="{name}">{value}</string>')
              if missing:
                  text = text.replace('</resources>', '\n' + '\n'.join(missing) + '\n</resources>')
              path.write_text(text)
          add_strings('app/src/main/res/values/memory_editor_strings.xml', english_strings)
          add_strings('app/src/main/res/values-in/memory_editor_strings.xml', indonesian_strings)

          # Keep useful tests, but name them after the production model/runtime they now exercise.
          Path('app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInputModelTest.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass MemoryInputModelTest {\n    @Test fun integerSpecsRejectWrongCharactersAndOutOfRangeValues() {\n        val signed = MemoryInputSpec.forType(MemoryEngineContract.TYPE_BYTE)\n        assertTrue(signed.acceptsPartial("-"))\n        assertTrue(signed.acceptsPartial("-12"))\n        assertFalse(signed.acceptsPartial("1.2"))\n        assertTrue(signed.isComplete("127"))\n        assertTrue(signed.isComplete("-128"))\n        assertFalse(signed.isComplete("128"))\n\n        val unsigned = MemoryInputSpec.forType(MemoryEngineContract.TYPE_CHAR)\n        assertTrue(unsigned.acceptsPartial("65535"))\n        assertFalse(unsigned.acceptsPartial("-1"))\n        assertTrue(unsigned.isComplete("65535"))\n        assertFalse(unsigned.isComplete("65536"))\n    }\n\n    @Test fun floatingSpecAllowsUsefulPartialScientificNotationOnly() {\n        val spec = MemoryInputSpec.forType(MemoryEngineContract.TYPE_DOUBLE)\n        for (partial in listOf("-", ".", "-.", "1.", "1.5", "1.5E", "1.5E-", "1.5E-3")) {\n            assertTrue(partial, spec.acceptsPartial(partial))\n        }\n        for (invalid in listOf("1..2", "E2", "1E2E3", "1A", "--1")) {\n            assertFalse(invalid, spec.acceptsPartial(invalid))\n        }\n        assertFalse(spec.isComplete("1.5E-"))\n        assertTrue(spec.isComplete("1.5E-3"))\n    }\n\n    @Test fun float32RejectsOverflowThatDoubleWouldAccept() {\n        assertFalse(MemoryInputSpec.forType(MemoryEngineContract.TYPE_FLOAT).isComplete("1e39"))\n        assertTrue(MemoryInputSpec.forType(MemoryEngineContract.TYPE_DOUBLE).isComplete("1e39"))\n    }\n}\n''')

          Path('app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInspectorRuntimeTest.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass MemoryInspectorRuntimeTest {\n    @Test fun inspectorCellsStayRelativeToTheCandidateAnchor() {\n        val bytes = ByteArray(16)\n        bytes[4] = 42\n        bytes[8] = 0xf9.toByte()\n        bytes[9] = 0xff.toByte()\n        bytes[10] = 0xff.toByte()\n        bytes[11] = 0xff.toByte()\n        val snapshot = MemoryInspectorSnapshot(\n            candidateId = 9, type = MemoryEngineContract.TYPE_INT, label = "HP",\n            startAddress = 0x1000, anchorAddress = 0x1004, bytes = bytes,\n        )\n        val cells = buildInspectorCells(snapshot)\n        assertEquals(listOf(-4, 0, 4, 8), cells.map { it.offset })\n        assertEquals(0x1004, cells.first { it.offset == 0 }.address)\n        assertEquals("42", cells.first { it.offset == 0 }.value)\n        assertEquals("-7", cells.first { it.offset == 4 }.value)\n        assertEquals(42L, cells.first { it.offset == 0 }.bits)\n        assertEquals(0xfffffff9L, cells.first { it.offset == 4 }.bits)\n    }\n\n    @Test fun inspectorUsesExactPrimitiveWidthsAndRejectsInvalidAnchor() {\n        assertEquals(1, inspectorTypeWidth(MemoryEngineContract.TYPE_BYTE))\n        assertEquals(2, inspectorTypeWidth(MemoryEngineContract.TYPE_SHORT))\n        assertEquals(2, inspectorTypeWidth(MemoryEngineContract.TYPE_CHAR))\n        assertEquals(4, inspectorTypeWidth(MemoryEngineContract.TYPE_INT))\n        assertEquals(4, inspectorTypeWidth(MemoryEngineContract.TYPE_FLOAT))\n        assertEquals(8, inspectorTypeWidth(MemoryEngineContract.TYPE_LONG))\n        assertEquals(8, inspectorTypeWidth(MemoryEngineContract.TYPE_DOUBLE))\n        assertEquals(0, inspectorTypeWidth(MemoryEngineContract.TYPE_AUTO))\n        val invalid = MemoryInspectorSnapshot(\n            candidateId = 1, type = MemoryEngineContract.TYPE_INT, label = "",\n            startAddress = 0x2000, anchorAddress = 0x1fff, bytes = ByteArray(8),\n        )\n        assertTrue(buildInspectorCells(invalid).isEmpty())\n    }\n\n    @Test fun inspectorFloatViewUsesLittleEndianSnapshotBytes() {\n        val bits = 1.5f.toBits()\n        val bytes = byteArrayOf(bits.toByte(), (bits ushr 8).toByte(), (bits ushr 16).toByte(), (bits ushr 24).toByte())\n        val snapshot = MemoryInspectorSnapshot(\n            candidateId = 2, type = MemoryEngineContract.TYPE_FLOAT, label = "Speed",\n            startAddress = 0x3000, anchorAddress = 0x3000, bytes = bytes,\n        )\n        val cell = buildInspectorCells(snapshot).single()\n        assertEquals(0, cell.offset)\n        assertEquals("1.5", cell.value)\n        assertEquals(bits.toLong() and 0xffff_ffffL, cell.bits)\n    }\n}\n''')

          Path('app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEditorModelsTest.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass MemoryEditorModelsTest {\n    @Test fun watchPageParserRequiresOnlyFormattedPresentationFields() {\n        assertTrue(MemoryWatchPageParser.parse(null).isEmpty())\n        val parsed = MemoryWatchPageParser.parse(\n            ids = longArrayOf(42L), values = arrayOf("30"), initialValues = arrayOf("10"),\n            previousValues = arrayOf("20"), addresses = arrayOf("0x1234"),\n            types = intArrayOf(MemoryEngineContract.TYPE_INT),\n            states = intArrayOf(MemoryEngineContract.CANDIDATE_STABLE), relocations = intArrayOf(3),\n            labels = arrayOf("HP"), freezeModes = intArrayOf(-1), freezePaused = booleanArrayOf(false),\n        )\n        assertEquals(42L, parsed.single().id)\n        assertEquals("30", parsed.single().valueText)\n        assertEquals("0x1234", parsed.single().addressText)\n        assertEquals("HP", parsed.single().label)\n    }\n\n    @Test fun resultRowsKeepAliasTypesWithoutRawAddresses() {\n        fun row(id: Long, types: IntArray) = MemoryResultRow(\n            id = id, valueText = "7", addressText = "0x1000",\n            aliasMask = types.fold(0) { mask, type -> mask or (1 shl type) },\n            primaryType = types.first(), state = MemoryEngineContract.CANDIDATE_STABLE, relocations = 0,\n        )\n        val rows = listOf(\n            row(1, intArrayOf(MemoryEngineContract.TYPE_INT, MemoryEngineContract.TYPE_FLOAT)),\n            row(3, intArrayOf(MemoryEngineContract.TYPE_INT, MemoryEngineContract.TYPE_LONG)),\n        )\n        assertEquals(listOf(MemoryEngineContract.TYPE_INT), commonTypesForSelection(rows, setOf(1, 3)))\n    }\n\n    @Test fun engineSessionMetadataMapsWithoutCountHeuristics() {\n        assertEquals(MemorySessionStage.CANDIDATES, memorySessionStageFromEngine(MemoryEngineContract.SEARCH_SESSION_CANDIDATES))\n        assertEquals(MemorySessionStage.UNKNOWN_BASELINE, memorySessionStageFromEngine(MemoryEngineContract.SEARCH_SESSION_UNKNOWN_BASELINE))\n        assertEquals(MemorySearchMode.GROUP, memorySearchModeFromEngine(MemoryEngineContract.SEARCH_MODE_GROUP))\n        assertEquals(MemorySessionStage.EMPTY, memorySessionStageFromEngine(-1))\n        assertEquals(MemorySearchMode.KNOWN, memorySearchModeFromEngine(-1))\n    }\n\n    @Test fun newSearchNeverForwardsARelativeRefinePredicate() {\n        assertEquals(MemoryEngineContract.PREDICATE_BETWEEN, newSearchPredicate(MemoryEngineContract.PREDICATE_BETWEEN))\n        assertEquals(MemoryEngineContract.PREDICATE_EQUAL, newSearchPredicate(MemoryEngineContract.PREDICATE_CHANGED))\n        assertEquals(MemoryEngineContract.PREDICATE_EQUAL, newSearchPredicate(MemoryEngineContract.PREDICATE_DECREASED_BY_RANGE))\n    }\n}\n''')

          # Delete source/tests that describe UI paths which are no longer reachable in production.
          for dead in [
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt',
              'app/src/androidTest/java/ru/playsoftware/j2meloader/memory/MemoryEditorBubbleTest.kt',
              'app/src/androidTest/java/ru/playsoftware/j2meloader/memory/MemoryInputImeTest.kt',
              'app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEditorComposeTest.kt',
              'app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInspectorComposeTest.kt',
              'app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInputComposeTest.kt',
              'app/src/main/res/values/memory_editor_overlay_strings.xml',
              'app/src/main/res/values-in/memory_editor_overlay_strings.xml',
              'app/src/main/res/values/memory_input_strings.xml',
              'app/src/main/res/values-in/memory_input_strings.xml',
          ]:
              path = Path(dead)
              if path.exists(): path.unlink()

          print('Production feedback patch and dead-UI cleanup applied.')
          PY

          echo '--- stale UI symbol audit ---'
          stale='MemoryEditorScreen\(|MemoryEditorSurface\(|MemoryEditorBubble\(|MemoryEditorStage3Root\(|MemoryInputArea\(|MemoryValueInput\(|MemoryInputSession|MemoryInputEditing|MemoryCursorVisualTransformation|memoryHardwareInputToken|parseGroup\('
          if rg -n "$stale" app/src/main app/src/test app/src/androidTest app/src/screenshotTest; then
            echo 'Found stale UI symbol(s) after cleanup.' >&2
            exit 1
          fi
          if rg -n 'memory_editor_overlay_|memory_editor_keypad_hide' app/src/main; then
            echo 'Found stale overlay/input-only resource reference.' >&2
            exit 1
          fi
          echo '--- callback signature audit ---'
          if rg -n 'onOperationProgress\(long operationId, long scannedBytes, long totalBytes\)' app/src; then
            echo 'Found callback implementation using the old AIDL signature.' >&2
            exit 1
          fi
      - name: Validate production UI and regenerate Memory Editor references
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testEmulatorDebugUnitTest \
            :app:updateEmulatorDebugScreenshotTest \
            :app:validateEmulatorDebugScreenshotTest \
            :app:assembleEmulatorDebug

          unexpected="$(git diff --name-only -- 'app/src/screenshotTestEmulatorDebug/reference/**' | grep -v '^app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected non-Memory-Editor screenshot baseline changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit final source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/patch-memory-editor-device-feedback.yml \
            .github/workflows/retry-memory-editor-device-feedback.yml \
