name: Update Memory Editor Goldens

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594

permissions:
  contents: write

concurrency:
  group: memory-editor-golden-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Update screenshot references
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest

      - name: Verify and commit only Memory Editor goldens
        shell: bash
        run: |
          set -euo pipefail
          results='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/MemoryEditorLandscapeResultsScreenshot_Memory Editor landscape results_a643207b_0.png'
          watch='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/MemoryEditorLandscapeWatchScreenshot_Memory Editor landscape watch_5a0fa3e9_0.png'
          portrait='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/MemoryEditorPortraitScreenshot_Memory Editor portrait_f8429708_0.png'

          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/^"(.*)"$/\1/')
          if (( ${#changed[@]} == 0 )); then
            echo 'No screenshot references changed.'
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              "$results"|"$watch"|"$portrait") ;;
              *)
                echo "Unexpected generated change: $path" >&2
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$results" "$watch" "$portrait"
          git commit -m 'Update Memory Editor screenshot references'
          git push origin "HEAD:${GITHUB_REF_NAME}"
