name: CI efficiency research

# Temporary PR-scoped probe, never intended for alpha.
# The existing Android CI lint job supplies the native-enabled control.
# This matrix compares two non-native worker configurations independently.
on:
  pull_request:
    branches:
      - alpha
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ci-efficiency-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-no-native:
    # Restrict additional compute to this same-repository research branch.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/ci-efficiency-experiments'
    name: Research lint (${{ matrix.scenario }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - lint-no-native
          - lint-workers2
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Profile lint without native build
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash scripts/ci-perf-experiment.sh ${{ matrix.scenario }}

      - name: Validate lint report presence and summarize
        if: always()
        run: >-
          python3 scripts/ci-results.py
          --lint 'app-and-dependencies=app/build/reports/lint-results-emulatorDebug.xml'
          --output ci-artifacts/lint-results.json

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-research-${{ matrix.scenario }}
          path: |
            build/reports/ci-experiments/**
            app/build/reports/lint-results-*.xml
            ci-artifacts/lint-results.*
          if-no-files-found: warn
          retention-days: 7
