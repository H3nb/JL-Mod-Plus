name: Refine Virtual Controls

on:
  pull_request:
    branches:
      - alpha
    paths:
      - '.ci/refine-virtual-controls'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Apply visual refinement and push clean commit
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
          git checkout -B "${PR_HEAD_REF}" "refs/remotes/origin/${PR_HEAD_REF}"

          python3 .ci/refine-virtual-controls.py

          cat > /tmp/expected-source.txt <<'EOF'
          app/src/main/java/javax/microedition/lcdui/keyboard/VirtualControlsKeyboard.java
          EOF
          sed -i 's/^          //' /tmp/expected-source.txt
          git diff --name-only -- app/src/main/java | sort > /tmp/actual-source.txt
          sort /tmp/expected-source.txt -o /tmp/expected-source.txt
          diff -u /tmp/expected-source.txt /tmp/actual-source.txt

          git rm -f .github/workflows/refine-virtual-controls.yml \
                    .ci/refine-virtual-controls \
                    .ci/refine-virtual-controls.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/javax/microedition/lcdui/keyboard/VirtualControlsKeyboard.java
          git commit -m 'Refine virtual controls styling'

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_HEAD_REF}"
