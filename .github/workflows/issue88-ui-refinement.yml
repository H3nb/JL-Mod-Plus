name: Issue 88 UI refinement

on:
  push:
    branches:
      - ui/harmonize-app-wide
    paths:
      - .github/workflows/issue88-ui-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Merge latest alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin alpha
          git merge --no-ff --no-commit origin/alpha

      - name: Apply user QA refinements
        run: python3 .github/scripts/issue88_ui_refine.py

      - name: Refresh intended screenshot references
        run: ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Validate refined UI
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Final diff checks
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue88-ui-refinement.yml
          rm .github/scripts/issue88_ui_refine.py
          git diff --check
          if git grep -n "Toast.makeText" -- app/src/main/java/javax/microedition/shell/MicroActivity.java app/src/main/java/ru/playsoftware/j2meloader/applist/AppsListFragment.java; then
            echo 'Legacy Toast remained in a migrated notification path.' >&2
            exit 1
          fi
          git status --short

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Refine app-wide Material 3 harmonization"
          git push origin HEAD:ui/harmonize-app-wide
