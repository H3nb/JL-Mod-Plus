name: Issue 88 UI refinement

on:
  push:
    branches:
      - ui/harmonize-app-wide
    paths:
      - .github/workflows/issue88-ui-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Merge latest alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin alpha
          git merge --no-ff --no-commit origin/alpha

      - name: Apply user QA refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # 1) Remove the alphabet/# fast scroller completely.
          for path in (
              "app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryFastScroller.kt",
              "app/src/test/java/ru/playsoftware/j2meloader/applist/LibraryFastScrollerTest.kt",
          ):
              p = Path(path)
              if p.exists():
                  p.unlink()

          library = "app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt"
          replace(
              library,
              "import androidx.compose.foundation.ExperimentalFoundationApi\n",
              "import androidx.compose.foundation.ExperimentalFoundationApi\n"
              "import androidx.compose.foundation.pager.HorizontalPager\n"
              "import androidx.compose.foundation.pager.rememberPagerState\n",
