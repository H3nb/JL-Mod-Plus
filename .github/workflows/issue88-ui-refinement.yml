              "                onSelected = { section ->\n"
              "                    coroutineScope.launch { pagerState.animateScrollToPage(section.ordinal) }\n"
              "                },\n",
              count=1,
          )
          replace(
              library,
              "                            onSelected = { selectedDestinationIndex = it.ordinal },\n",
              "                            onSelected = { section ->\n"
              "                                coroutineScope.launch { pagerState.animateScrollToPage(section.ordinal) }\n"
              "                            },\n",
              count=1,
