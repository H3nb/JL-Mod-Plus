        }
"""
          replace(library, fast_scroll_block, "\n")
          replace(library, "    onProfiles: () -> Unit,\n", "")
          replace(
              library,
              "                    LibraryActionRow(R.string.action_settings, onSettings)\n"
              "                    HorizontalDivider()\n"
              "                    LibraryActionRow(R.string.profiles, onProfiles)\n"
