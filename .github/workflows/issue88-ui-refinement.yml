              "    fun updateSort(sortVariant: Int) {\n        state = state.copy(sortVariant = sortVariant)\n    }\n\n"
              "    fun showNotice(message: String) {\n        noticeState.show(message)\n    }\n",
          )
          replace(
              library,
              "@OptIn(ExperimentalLayoutApi::class, ExperimentalMaterial3Api::class)\n",
              "@OptIn(ExperimentalFoundationApi::class, ExperimentalLayoutApi::class, ExperimentalMaterial3Api::class)\n",
          )
          replace(
              library,
              "    var selectedDestinationIndex by rememberSaveable { mutableStateOf(0) }\n"
              "    val destination = when (selectedDestinationIndex) {\n"
