name: Memory Editor Inspector finalization

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memory-editor-adaptive-inspector.yml'

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Harden compact Inspector navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          inspector = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt')
          text = inspector.read_text()

          old = (
              '    val supportingHidden =\n'
              '        navigator.scaffoldValue[SupportingPaneScaffoldRole.Supporting] == PaneAdaptedValue.Hidden\n'
              '\n'
              '    Dialog(\n'
              '        onDismissRequest = onDismiss,\n'
          )
          new = (
              '    val supportingHidden =\n'
              '        navigator.scaffoldValue[SupportingPaneScaffoldRole.Supporting] == PaneAdaptedValue.Hidden\n'
              '    val mainHidden =\n'
              '        navigator.scaffoldValue[SupportingPaneScaffoldRole.Main] == PaneAdaptedValue.Hidden\n'
              '    val returnToMain: () -> Unit = {\n'
              '        scope.launch {\n'
              '            navigator.navigateTo(SupportingPaneScaffoldRole.Main)\n'
              '        }\n'
              '    }\n'
              '\n'
              '    Dialog(\n'
              '        onDismissRequest = {\n'
              '            if (mainHidden) returnToMain() else onDismiss()\n'
              '        },\n'
          )
          text = replace_once(text, old, new, 'Inspector dismiss navigation')

          old = (
              '                            onRefresh = { onRefresh(radius) },\n'
              '                            onNearby = onNearby,\n'
              '                            onDismiss = onDismiss,\n'
          )
          new = (
              '                            onRefresh = { onRefresh(radius) },\n'
              '                            onNearby = onNearby,\n'
              '                            showBackToMemory = mainHidden,\n'
              '                            onBackToMemory = returnToMain,\n'
              '                            onDismiss = onDismiss,\n'
          )
          text = replace_once(text, old, new, 'Inspector controls call')

          old = (
              '    onRefresh: () -> Unit,\n'
              '    onNearby: () -> Unit,\n'
              '    onDismiss: () -> Unit,\n'
          )
          new = (
              '    onRefresh: () -> Unit,\n'
              '    onNearby: () -> Unit,\n'
              '    showBackToMemory: Boolean,\n'
              '    onBackToMemory: () -> Unit,\n'
              '    onDismiss: () -> Unit,\n'
          )
          text = replace_once(text, old, new, 'Inspector controls parameters')

          old = (
              '            TextButton(onClick = onNearby) {\n'
              '                Text(stringResource(R.string.memory_editor_search_nearby))\n'
              '            }\n'
              '            TextButton(onClick = onDismiss) {\n'
          )
          new = (
              '            TextButton(onClick = onNearby) {\n'
              '                Text(stringResource(R.string.memory_editor_search_nearby))\n'
              '            }\n'
              '            if (showBackToMemory) {\n'
              '                TextButton(onClick = onBackToMemory) {\n'
              '                    Text(stringResource(R.string.memory_editor_back_to_memory))\n'
              '                }\n'
              '            }\n'
              '            TextButton(onClick = onDismiss) {\n'
          )
          text = replace_once(text, old, new, 'Inspector compact back action')
          inspector.write_text(text)

          resources = [
              (
                  'app/src/main/res/values/memory_editor_strings.xml',
                  '    <string name="memory_editor_inspector_controls">Inspector controls</string>\n',
                  '    <string name="memory_editor_back_to_memory">Back to memory</string>\n',
              ),
              (
                  'app/src/main/res/values-in/memory_editor_strings.xml',
                  '    <string name="memory_editor_inspector_controls">Kontrol inspektor</string>\n',
                  '    <string name="memory_editor_back_to_memory">Kembali ke memori</string>\n',
              ),
          ]
          for path, marker, addition in resources:
              p = Path(path)
              value = p.read_text()
              p.write_text(replace_once(value, marker, marker + addition, path))
          PY

          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          expected = {
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected finalization scope: {sorted(changed)}')
          PY

      - name: Validate production gate
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Commit source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/memory-editor-adaptive-inspector.yml \
            .github/scripts/memory-editor-adaptive-inspector.py
          git add \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt \
            app/src/main/res/values/memory_editor_strings.xml \
            app/src/main/res/values-in/memory_editor_strings.xml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          expected = {
              '.github/workflows/memory-editor-adaptive-inspector.yml',
              '.github/scripts/memory-editor-adaptive-inspector.py',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected staged finalization scope: {sorted(changed)}')
          PY
          git commit -m 'Harden compact Memory Inspector navigation'
          git push origin HEAD:ci/memory-editor-stack-f914594
