name: Memory Editor adaptive Inspector

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memory-editor-adaptive-inspector.yml'
      - '.github/scripts/memory-editor-adaptive-inspector.py'

permissions:
  contents: write

jobs:
  adapt-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Apply guarded adaptive pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/memory-editor-adaptive-inspector.py')
          text = path.read_text()

          old = "\\}\n\n\n@Composable\nprivate fun InspectorCellRow'''"
          new = "\\}\n\n@Composable\nprivate fun InspectorCellRow'''"
          if text.count(old) != 1:
              raise SystemExit(f'Inspector boundary marker expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          version_upgrade = '''text = replace_once(
              text,
              'material3-adaptive = "1.3.0-alpha01"',
              'material3-adaptive = "1.3.0"',
              "stable adaptive version",
          )
          '''
          if text.count(version_upgrade) != 1:
              raise SystemExit(f'adaptive version block expected once, found {text.count(version_upgrade)}')
          text = text.replace(version_upgrade, '', 1)
          path.write_text(text)
          PY
          python3 .github/scripts/memory-editor-adaptive-inspector.py
          git checkout -- .github/scripts/memory-editor-adaptive-inspector.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTest.kt')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          expected = {
              'app/build.gradle.kts',
              'gradle/libs.versions.toml',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
              'app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTest.kt',
          }
          if changed != expected:
              raise SystemExit(f'unexpected adaptive source scope: {sorted(changed)}')
          PY

      - name: Generate screenshot references
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Validate production gate
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug

      - name: Guard generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          exact = {
              'app/build.gradle.kts',
              'gradle/libs.versions.toml',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
              'app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTest.kt',
          }
          unexpected = [
              path for path in changed
              if path not in exact and not path.startswith('app/src/screenshotTestEmulatorDebug/reference/')
          ]
          if unexpected:
              raise SystemExit(f'unexpected generated diff scope: {unexpected}')
          PY

      - name: Commit validated adaptive workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            gradle/libs.versions.toml \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt \
            app/src/main/res/values/memory_editor_strings.xml \
            app/src/main/res/values-in/memory_editor_strings.xml \
            app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTest.kt \
            app/src/screenshotTestEmulatorDebug
          git commit -m 'Add adaptive Memory Inspector workspace'
          git push origin HEAD:ci/memory-editor-stack-f914594
