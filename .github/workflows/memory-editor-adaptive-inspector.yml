name: Memory Editor Inspector finalization

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memory-editor-adaptive-inspector.yml'

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Harden compact Inspector navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          inspector = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt')
          text = inspector.read_text()
          text = replace_once(
              text,
              '''    val supportingHidden =
                  navigator.scaffoldValue[SupportingPaneScaffoldRole.Supporting] == PaneAdaptedValue.Hidden

              Dialog(
                  onDismissRequest = onDismiss,
''',
              '''    val supportingHidden =
                  navigator.scaffoldValue[SupportingPaneScaffoldRole.Supporting] == PaneAdaptedValue.Hidden
              val mainHidden =
                  navigator.scaffoldValue[SupportingPaneScaffoldRole.Main] == PaneAdaptedValue.Hidden
              val returnToMain: () -> Unit = {
                  scope.launch {
                      navigator.navigateTo(SupportingPaneScaffoldRole.Main)
                  }
              }

              Dialog(
                  onDismissRequest = {
                      if (mainHidden) returnToMain() else onDismiss()
                  },
''',
              'Inspector dismiss navigation',
          )
          text = replace_once(
              text,
              '''                            onRefresh = { onRefresh(radius) },
                              onNearby = onNearby,
                              onDismiss = onDismiss,
''',
              '''                            onRefresh = { onRefresh(radius) },
                              onNearby = onNearby,
                              showBackToMemory = mainHidden,
                              onBackToMemory = returnToMain,
                              onDismiss = onDismiss,
''',
              'Inspector controls call',
          )
          text = replace_once(
              text,
              '''    onRefresh: () -> Unit,
              onNearby: () -> Unit,
              onDismiss: () -> Unit,
''',
              '''    onRefresh: () -> Unit,
              onNearby: () -> Unit,
              showBackToMemory: Boolean,
              onBackToMemory: () -> Unit,
              onDismiss: () -> Unit,
''',
              'Inspector controls parameters',
          )
          text = replace_once(
              text,
              '''            TextButton(onClick = onNearby) {
                  Text(stringResource(R.string.memory_editor_search_nearby))
              }
              TextButton(onClick = onDismiss) {
''',
              '''            TextButton(onClick = onNearby) {
                  Text(stringResource(R.string.memory_editor_search_nearby))
              }
              if (showBackToMemory) {
                  TextButton(onClick = onBackToMemory) {
                      Text(stringResource(R.string.memory_editor_back_to_memory))
                  }
              }
              TextButton(onClick = onDismiss) {
''',
              'Inspector compact back action',
          )
          inspector.write_text(text)

          for path, marker, line in [
              (
                  'app/src/main/res/values/memory_editor_strings.xml',
                  '    <string name="memory_editor_inspector_controls">Inspector controls</string>\n',
                  '    <string name="memory_editor_back_to_memory">Back to memory</string>\n',
              ),
              (
                  'app/src/main/res/values-in/memory_editor_strings.xml',
                  '    <string name="memory_editor_inspector_controls">Kontrol inspektor</string>\n',
                  '    <string name="memory_editor_back_to_memory">Kembali ke memori</string>\n',
              ),
          ]:
              p = Path(path)
              value = p.read_text()
              value = replace_once(value, marker, marker + line, f'localized compact back label {path}')
              p.write_text(value)
          PY

          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          expected = {
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected finalization scope: {sorted(changed)}')
          PY

      - name: Validate production gate
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Commit source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/memory-editor-adaptive-inspector.yml \
            .github/scripts/memory-editor-adaptive-inspector.py
          git add \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt \
            app/src/main/res/values/memory_editor_strings.xml \
            app/src/main/res/values-in/memory_editor_strings.xml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          expected = {
              '.github/workflows/memory-editor-adaptive-inspector.yml',
              '.github/scripts/memory-editor-adaptive-inspector.py',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
              'app/src/main/res/values/memory_editor_strings.xml',
              'app/src/main/res/values-in/memory_editor_strings.xml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected staged finalization scope: {sorted(changed)}')
          PY
          git commit -m 'Harden compact Memory Inspector navigation'
          git push origin HEAD:ci/memory-editor-stack-f914594
