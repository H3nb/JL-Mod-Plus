name: Memory Editor Inspector identity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memory-editor-inspector-identity.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Preserve Inspector view type across relocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt')
          text = path.read_text()
          old = '    var viewType by remember(snapshot.candidateId, snapshot.anchorAddress) {\n'
          new = '    var viewType by remember(snapshot.candidateId) {\n'
          if text.count(old) != 1:
              raise SystemExit(f'viewType relocation key expected exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt"

      - name: Validate production gate
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Commit source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/memory-editor-inspector-identity.yml
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          expected = {
              '.github/workflows/memory-editor-inspector-identity.yml',
              'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt',
          }
          if changed != expected:
              raise SystemExit(f'unexpected staged identity scope: {sorted(changed)}')
          PY
          git commit -m 'Preserve Memory Inspector view type across relocation'
          git push origin HEAD:ci/memory-editor-stack-f914594
