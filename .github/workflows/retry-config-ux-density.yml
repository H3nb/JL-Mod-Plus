name: Retry config UX density

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
          submodules: recursive

      - name: Apply redesign and test-double fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-config-ux-density.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'config-ux-transform', 'exec'))

          screenshot = Path('app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/applist/LibraryProfilesScreenshotTest.kt')
          text = screenshot.read_text()
          old = '''private object NoOpProfilesActions : ProfilesActions {\n    override fun onBack() = Unit\n    override fun onCreate(name: String) = Unit\n    override fun onSetDefault(name: String) = Unit\n'''
          new = '''private object NoOpProfilesActions : ProfilesActions {\n    override fun onBack() = Unit\n    override fun onCreate(name: String) = Unit\n    override fun onSetBuiltInDefault() = Unit\n    override fun onSetDefault(name: String) = Unit\n'''
          if text.count(old) != 1:
              raise SystemExit('NoOpProfilesActions insertion point missing')
          screenshot.write_text(text.replace(old, new, 1))
          PY

          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Update references and validate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug :dexlib:lintDebug :app:testEmulatorDebugUnitTest :app:validateEmulatorDebugScreenshotTest :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest

      - name: Commit redesign and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-config-ux-density.yml .github/workflows/retry-config-ux-density.yml
          git add app/src/main app/src/androidTest app/src/screenshotTest app/src/screenshotTestEmulatorDebug/reference
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine config profile management and density'
          git push origin HEAD:ui/redesign-config
