name: Import localization archive

on:
  push:
    branches: [localization-quality]
    paths:
      - JL-Mod-Plus-l10n-all-39-locales-modular.zip

permissions:
  contents: write

concurrency:
  group: localization-archive-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'H3nb/JL-Mod-Plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify base and import
        shell: bash
        run: |
          git fetch origin alpha
          git merge-base --is-ancestor origin/alpha HEAD
          python -B -m scripts.import_localization_archive JL-Mod-Plus-l10n-all-39-locales-modular.zip
          python -B scripts/localization_audit.py
          python -B -m unittest discover -s scripts/tests -p 'test_localization_*.py' -v
      - name: Commit imported resource files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm JL-Mod-Plus-l10n-all-39-locales-modular.zip
          git add -- app/src/main/res
          git diff --cached --stat
          git commit -m 'Import modular localization catalogs'
          git push origin HEAD:refs/heads/localization-quality
