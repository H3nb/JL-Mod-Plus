# Temporary PR-only verification; remove after inspecting the Android test results.
name: PR234 targeted Android instrumentation
on:
  pull_request:
    branches: [alpha]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  midp-android-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Configure Android 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run targeted Android contract tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.GraphicsCanvasStateTest,javax.microedition.lcdui.DateFieldInteractionTest,io.github.h3nb.jlmodplus.installer.ExternalContentJadImportTest" :app:connectedEmulatorDebugAndroidTest
            find app/build/outputs/androidTest-results -type f -name '*.xml' -print | head -30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.4
        with:
          name: pr234-android-contract-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 3
