name: Platform modernization validation

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: platform-modernization-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  toolchain:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Verify Gradle and configuration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version | tee gradle-version.txt
          grep -q 'Gradle 9.8.0' gradle-version.txt
          ./gradlew --daemon --stacktrace help
          ./gradlew --daemon --stacktrace build --dry-run
      - name: Verify resolved build and runtime dependency baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace buildEnvironment | tee build-environment.txt
          grep -q 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20' build-environment.txt
          grep -q 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.12' build-environment.txt
          ./gradlew --daemon --stacktrace :app:dependencies --configuration emulatorDebugRuntimeClasspath | tee runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.ui:ui(-android)?:1\.12\.1' runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.material3:material3(-android)?:1\.4\.0' runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.material3\.adaptive:adaptive(-android)?:1\.3\.0' runtime-dependencies.txt
          grep -Eq 'androidx\.navigation3:navigation3-runtime(-android)?:1\.1\.7' runtime-dependencies.txt
          if grep -E 'androidx\.compose[^:]*:[^ ]+:[0-9].*(-alpha|beta|rc)' runtime-dependencies.txt; then
            echo 'Unexpected preview Compose runtime artifact resolved.' >&2
            exit 1
          fi
      - name: Verify Room generation and schemas
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --parallel --stacktrace :app:testEmulatorDebugUnitTest --tests io.github.h3nb.jlmodplus.librarydb.LibraryMigrationTest
          git diff --exit-code -- app/schemas

  release-native:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Build non-publishing minified release
        env:
          JLMOD_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --profile :app:assembleEmulatorRelease
      - name: Verify release APK matrix and native cache provenance
        shell: bash
        run: |
          set -euo pipefail
          output='app/build/outputs/apk/emulator/release'
          metadata="$output/output-metadata.json"
          test -f "$metadata"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            count="$(jq -r --arg abi "$abi" '[.elements[] | select(any(.filters[]?; .filterType == "ABI" and .value == $abi))] | length' "$metadata")"
            [[ "$count" == 1 ]] || { echo "Expected one $abi APK, found $count" >&2; exit 1; }
            stamp="app/build/audio-deps/install-$abi/recipe.txt"
            test -f "$stamp"
            grep -Fq ":30.0.16248370:$abi:" "$stamp"
          done
          universal_count="$(jq -r '[.elements[] | select(((.filters // []) | length) == 0)] | length' "$metadata")"
          [[ "$universal_count" == 1 ]] || { echo "Expected one universal APK, found $universal_count" >&2; exit 1; }
          test -f app/build/outputs/mapping/emulatorRelease/mapping.txt
      - name: Verify 16 KiB native and APK alignment
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          zipalign="$ANDROID_HOME/build-tools/$build_tools/zipalign"
          test -x "$zipalign"
          output='app/build/outputs/apk/emulator/release'
          universal="$(jq -r '.elements[] | select(((.filters // []) | length) == 0) | .outputFile' "$output/output-metadata.json")"
          apk="$output/$universal"
          "$zipalign" -c -P 16 -v 4 "$apk"
          rm -rf extracted-apk
          mkdir extracted-apk
          unzip -q "$apk" 'lib/*/*.so' -d extracted-apk
          failures=0
          while IFS= read -r -d '' so; do
            while read -r align; do
              if (( align < 0x4000 )); then
                echo "ELF LOAD alignment below 16 KiB: $so ($align)" >&2
                failures=1
              fi
            done < <("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find extracted-apk/lib -type f -name '*.so' -print0)
          (( failures == 0 ))
      - name: Verify no source schema mutation
        shell: bash
        run: git diff --exit-code -- app/schemas

  native-runtime-smoke:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise rebuilt native rendering and audio paths
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.m3g.M3GRuntimeTest,javax.microedition.media.MediaBoundaryRuntimeTest,javax.microedition.media.SampledAudioRuntimeTest,javax.microedition.media.LegacySmafConversionTest,io.github.h3nb.jlmodplus.mmapi.synth.SonivoxRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.UnifiedAudioRuntimeTest
            :app:connectedEmulatorDebugAndroidTest
