name: Graphics R&D Fast (GLES only)

on:
  push:
    branches: [research/graphics-architecture]
    paths:
      - '.github/workflows/graphics-rd-fast.yml'
      - 'scripts/graphics-rd-fast.sh'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/experiments/**'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/research/**'

permissions:
  contents: read

concurrency:
  group: graphics-rd-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gles-abi-and-fbo:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run GLES-only probes on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/graphics-rd-fast.sh
      - name: Upload results and logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphics-rd-fast-evidence
          path: ci-artifacts/graphics-rd-fast/
          if-no-files-found: warn
          retention-days: 7
