name: Finalize Memory Editor feedback v3

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/finalize3-memory-editor-feedback.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545
      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          "$sdkmanager_path" 'platforms;android-37.0'
      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
      - name: Apply reviewed final source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Reuse the fully reviewed v2 transform, which itself reapplies v1/device-feedback.
          workflow = Path('.github/workflows/finalize2-memory-editor-feedback.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          start = workflow.index(begin) + len(begin)
          end = workflow.index("\n          PY", start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, '<finalizer-v2>', 'exec'), {})

          runtime_path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorRuntimeCompose.kt')
          runtime = runtime_path.read_text()

          # Inspector must fail closed for AUTO/unknown types. Treating an unsupported snapshot
          # as Int32 makes presentation misleading and could expose an invalid edit target.
          old_width = '''internal fun inspectorTypeWidth(type: Int): Int = when (type) {
              MemoryEngineContract.TYPE_BYTE -> 1
              MemoryEngineContract.TYPE_SHORT,
              MemoryEngineContract.TYPE_CHAR -> 2
              MemoryEngineContract.TYPE_INT,
              MemoryEngineContract.TYPE_FLOAT -> 4
              MemoryEngineContract.TYPE_LONG,
              MemoryEngineContract.TYPE_DOUBLE -> 8
              else -> 4
          }'''
          # Kotlin source is not YAML-indented after the v2 transform; normalize the literal.
          old_width = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_width.splitlines())
          new_width = old_width.replace('else -> 4', 'else -> 0')
          if old_width not in runtime:
              raise SystemExit('Inspector width helper shape changed; refusing unsafe blind patch')
          runtime = runtime.replace(old_width, new_width, 1)

          # A Next Scan refines the existing session. If the user changes type/scope controls to
          # prepare a New Search, do not leave Next Scan enabled while silently ignoring them.
          old_next = '''    val nextScanValid = state.sessionStage == MemorySessionStage.CANDIDATES && singleValid && secondValid'''
          new_next = '''    val nextScanValid = state.sessionStage == MemorySessionStage.CANDIDATES &&
              type == state.requestedType && scope == state.searchScope && singleValid && secondValid'''
          new_next = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_next.splitlines())
          if old_next not in runtime:
              raise SystemExit('Known-search Next Scan validity block changed')
          runtime = runtime.replace(old_next, new_next, 1)

          runtime_path.write_text(runtime)

          # Keep the regression explicit: AUTO/unknown Inspector presentation has no primitive
          # width and therefore cannot materialize editable cells.
          test_path = Path('app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInspectorRuntimeTest.kt')
          test = test_path.read_text()
          if 'assertEquals(0, inspectorTypeWidth(MemoryEngineContract.TYPE_AUTO))' not in test:
              raise SystemExit('Inspector fail-closed regression test missing')

          print('Applied reviewed UI cleanup plus fail-closed Inspector and Next Scan guard.')
          PY

          echo '--- final stale-path audit ---'
          stale='MemoryEditorScreen\|MemoryEditorSurface\|MemoryEditorBubble(\|MemoryEditorStage3Root\|MemoryInputArea\|MemoryValueInput\|MemoryInputSession\|MemoryInputEditing\|MemoryCursorVisualTransformation\|memoryHardwareInputToken\|parseGroup('
          if grep -R -n -E "$stale" app/src/main app/src/test app/src/androidTest app/src/screenshotTest 2>/dev/null; then
            echo 'Found stale Memory Editor UI symbol(s).' >&2
            exit 1
          fi
          if grep -R -n -E 'memory_editor_overlay_|memory_editor_keypad_hide' app/src/main 2>/dev/null; then
            echo 'Found stale overlay/input resource reference.' >&2
            exit 1
          fi
          if grep -R -n -F 'refreshCandidates(token, ids)' app/src 2>/dev/null; then
            echo 'Found refreshCandidates call without passive/foreground classification.' >&2
            exit 1
          fi
      - name: Validate production UI and regenerate Memory Editor references
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testEmulatorDebugUnitTest \
            :app:updateEmulatorDebugScreenshotTest \
            :app:validateEmulatorDebugScreenshotTest \
            :app:assembleEmulatorDebug

          unexpected="$(git diff --name-only -- 'app/src/screenshotTestEmulatorDebug/reference/**' | grep -v '^app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected non-Memory-Editor screenshot baseline changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit final source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/patch-memory-editor-device-feedback.yml \
            .github/workflows/retry-memory-editor-device-feedback.yml \
            .github/workflows/retry2-memory-editor-device-feedback.yml \
            .github/workflows/finalize-memory-editor-feedback.yml \
            .github/workflows/finalize2-memory-editor-feedback.yml \
            .github/workflows/finalize3-memory-editor-feedback.yml
          git config user.name 'Hendra Bara'"'"'langi'
          git config user.email '93023716+H3nb@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Polish Memory Editor runtime feedback and remove legacy UI'
          git push origin HEAD:ci/memory-editor-stack-f914594
