name: Memory UI density migration

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/memory-ui-density.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - name: Apply keypad migration and density pass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, n=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < n:
                  raise SystemExit(f"marker missing in {path}: expected >= {n}, got {count}\n{old[:180]}")
              text = text.replace(old, new, n)
              p.write_text(text)

          input_path = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt'
          compose_path = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt'
          inspector_path = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt'

          replace(input_path,
          '''internal fun MemoryInputArea(
              modifier: Modifier = Modifier,
              content: @Composable () -> Unit,
          ) {''',
          '''internal fun MemoryInputArea(
              modifier: Modifier = Modifier,
              sideDockInLandscape: Boolean = true,
              content: @Composable () -> Unit,
          ) {''')
          replace(input_path,
          '''    val landscape = LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE''',
          '''    val landscape = sideDockInLandscape &&
              LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE''')

          replace(compose_path,
          '''        ) {
              MemoryEditorContent(state, actions)
          }
          if (state.busy) BusyOverlay(state, actions)''',
          '''        ) {
              MemoryInputArea(modifier = Modifier.fillMaxSize()) {
                  MemoryEditorContent(state, actions)
              }
          }
          if (state.busy) BusyOverlay(state, actions)''')

          replace(compose_path,
          '''    var searchControlsExpanded by remember(landscape) { mutableStateOf(!landscape) }''',
          '''    var searchControlsExpanded by remember(landscape) { mutableStateOf(true) }''')
          replace(compose_path,
          '''    LaunchedEffect(landscape, state.sessionStage, state.resultCount) {
              if (landscape && state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {
                  searchControlsExpanded = false
              }
              if (state.sessionStage != MemorySessionStage.CANDIDATES) searchControlsExpanded = true
          }''',
          '''    LaunchedEffect(landscape, state.sessionStage, state.resultCount) {
              if (state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {
                  searchControlsExpanded = false
              } else if (state.sessionStage != MemorySessionStage.CANDIDATES) {
                  searchControlsExpanded = true
              }
          }''')

          old_search = '''        if (!state.watchTab) {
              if (landscape && state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {
                  TextButton(
                      onClick = { searchControlsExpanded = !searchControlsExpanded },
                      modifier = Modifier.padding(horizontal = 8.dp),
                  ) {
                      Text(stringResource(
                          if (searchControlsExpanded) R.string.memory_editor_hide_search
                          else R.string.memory_editor_show_search,
                      ))
                  }
              }

              if (searchControlsExpanded) {
                  SearchWorkspace(
                      state = state,
                      searchMode = searchMode,
                      onSearchMode = { searchMode = it },
                      value = value,
                      onValue = { value = it },
                      secondValue = secondValue,
                      onSecondValue = { secondValue = it },
                      type = type,
                      onType = { type = it },
                      predicate = predicate,
                      onPredicate = { predicate = it },
                      compare = compare,
                      onCompare = { compare = it },
                      scope = scope,
                      onScope = { scope = it },
                      advanced = advanced,
                      onAdvanced = { advanced = !advanced },
                      actions = actions,
                  )
              }
          }'''
          new_search = '''        if (!state.watchTab) {
              if (state.sessionStage == MemorySessionStage.CANDIDATES && !searchControlsExpanded) {
                  CompactRefineStrip(
                      resultCount = state.resultCount,
                      value = value,
                      onValue = { value = it },
                      secondValue = secondValue,
                      onSecondValue = { secondValue = it },
                      type = type,
                      predicate = predicate,
                      onPredicate = { predicate = it },
                      compare = compare,
                      busy = state.busy,
                      onExpand = { searchControlsExpanded = true },
                      actions = actions,
                  )
              } else {
                  if (state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {
                      TextButton(
                          onClick = { searchControlsExpanded = false },
                          modifier = Modifier.padding(horizontal = 8.dp),
                      ) {
                          Text(stringResource(R.string.memory_editor_hide_search))
                      }
                  }
                  SearchWorkspace(
                      state = state,
                      searchMode = searchMode,
                      onSearchMode = { searchMode = it },
                      value = value,
                      onValue = { value = it },
                      secondValue = secondValue,
                      onSecondValue = { secondValue = it },
                      type = type,
                      onType = { type = it },
                      predicate = predicate,
                      onPredicate = { predicate = it },
                      compare = compare,
                      onCompare = { compare = it },
                      scope = scope,
                      onScope = { scope = it },
                      advanced = advanced,
                      onAdvanced = { advanced = !advanced },
                      actions = actions,
                  )
              }
          }'''
          replace(compose_path, old_search, new_search)

          replace(compose_path,
