name: Profile Golden Recorder (one-off)

on:
  push:
    branches:
      - fix/profile-manager

permissions:
  contents: write

jobs:
  record:
    if: ${{ !contains(github.event.head_commit.message, '[golden-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-manager
          persist-credentials: true
          submodules: recursive
          fetch-depth: 1

      - name: Restore shared debug keystore
        if: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Record screenshot references
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Commit only intended Quick references
        shell: bash
        run: |
          set -euo pipefail
          dark='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/config/ConfigScreenshotTestKt/ConfigQuickDarkScreenshot_Config quick dark_758f3757_0.png'
          light='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/config/ConfigScreenshotTestKt/ConfigQuickScreenshot_Config quick light_dc46fefc_0.png'
          test -f "$dark"
          test -f "$light"
          git add -- "$dark" "$light"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No golden changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ui): update profile manager goldens [skip ci] [golden-bot]'
          git push origin HEAD:fix/profile-manager
