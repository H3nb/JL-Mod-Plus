name: PR 230 graphics runtime (temporary)

on:
  pull_request:
    branches: [alpha]
    paths:
      - 'app/src/**'
      - 'docs/internal-resolution.md'
      - '.github/workflows/pr230-graphics-runtime-temporary.yml'

permissions:
  contents: read

jobs:
  graphics-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Provision NDK r30 for the Micro3D JNI pass
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual HD drawing and isolated Micro3D EGL contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.InternalResolutionGraphicsTest :app:connectedEmulatorDebugAndroidTest
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=true -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.micro3d.Micro3dInternalResolutionTest :app:connectedEmulatorDebugAndroidTest
      - name: Diagnose Android instrumentation failures
        if: failure()
        shell: bash
        run: |
          find app/build/outputs/androidTest-results/connected -type f -name '*.xml' -print -exec sed -n '1,160p' {} \; || true
      - name: Upload temporary instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr230-graphics-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
