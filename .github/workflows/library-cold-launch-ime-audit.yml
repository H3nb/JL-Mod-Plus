name: Temporary Library Activity cold launch IME audit

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/library-cold-launch-ime-audit.yml'

permissions:
  contents: read

jobs:
  activity-ime:
    name: Cold launch and resume IME (API ${{ matrix.api }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 27
            arch: x86
          - api: 35
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build focused emulator APK
        run: |
          chmod +x gradlew
          ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest
      - name: Real Activity launch traces and Compose regressions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: |
            set -euo pipefail
            mapfile -t apks < <(find app/build/outputs/apk/emulator/debug -maxdepth 1 -type f -name '*.apk' | sort)
            if (( ${#apks[@]} != 1 )); then
              echo "Expected one emulator APK, found ${#apks[@]}." >&2
              exit 1
            fi
            adb install -r "${apks[0]}"
            bash -euo pipefail ci-library-ime-audit.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-activity-ime-api${{ matrix.api }}
          path: |
            ci-artifacts/ime/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 3
