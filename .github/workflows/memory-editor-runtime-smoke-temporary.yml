name: Memory Editor runtime smoke (temporary)

on:
  pull_request:
    branches: [alpha]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: memory-editor-runtime-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  memory-runtime-smoke:
    if: github.event.pull_request.number == 262 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Provision NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Prepare build identity
        run: |
          chmod +x gradlew
          bash -n scripts/runtime-smoke.sh
          echo "JLMOD_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Memory Editor runtime contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/runtime-smoke.sh --memory-only
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-memory-runtime-smoke
          path: |
            ci-artifacts/runtime-smoke/**
            runtime-logcat.txt
            app/build/outputs/androidTest-results/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7
