name: Temporary Show Controls golden refresh

on:
  push:
    branches:
      - fix/adaptive-show-controls-order

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Trigger renderer golden refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/adaptive-show-controls-order
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Render screenshot references
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest
          git status --short
          expected='app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt'
          mapfile -d '' entries < <(git status --porcelain=v1 -z -- "$expected")
          changed=()
          for entry in "${entries[@]}"; do
            changed+=("${entry:3}")
          done
          if [[ "${#changed[@]}" -ne 2 ]]; then
            printf 'Expected exactly two Show Controls reference changes, got %s\n' "${#changed[@]}" >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              *RuntimeShowControlsScreenshot_Show\ controls\ phone_0da86010_0.png|              *RuntimeShowControlsWideScreenshot_Show\ controls\ wide_c212d9d0_0.png) ;;
              *) echo "Unexpected screenshot reference: $path" >&2; exit 1 ;;
            esac
          done
          git add -- "$expected/RuntimeShowControlsScreenshot_Show controls phone_0da86010_0.png"
          git add -- "$expected/RuntimeShowControlsWideScreenshot_Show controls wide_c212d9d0_0.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Show Controls screenshot references"
          git push origin HEAD:fix/adaptive-show-controls-order
