name: Platform modernization audio runtime qualification

on:
  push:
    branches:
      - android-platform-modernization

permissions:
  contents: read

concurrency:
  group: platform-modernization-audio-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        shell: bash
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run documented audio qualification suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace
            -I scripts/audio-qualification.init.gradle
            -PjlmodRuntimeTestAbi=x86_64
            '-Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.mmapi.synth.SynthPlayerContractTest,io.github.h3nb.jlmodplus.mmapi.synth.SonivoxRuntimeTest,javax.microedition.media.SampledAudioRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.AudioMidletRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.MidiDeliveryRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.RmidRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.UnifiedAudioRuntimeTest'
            :app:connectedEmulatorDebugAndroidTest
