name: PR 200 screen-skin instrumentation (temporary)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [alpha]
    paths:
      - '.github/workflows/pr200-skin-instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: pr200-skin-instrumentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  skin-rendering:
    if: github.event.pull_request.number == 200
    name: Curved screen-skin Android tests
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute four SkinLayerRenderingTest cases on API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.skin.SkinLayerRenderingTest :app:connectedEmulatorDebugAndroidTest

      - name: Verify executed instrumentation results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import sys

          files = list(Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          cases = {}
          for path in files:
              root = ET.parse(path).getroot()
              for test in root.iter("testcase"):
                  if "SkinLayerRenderingTest" not in test.get("classname", ""):
                      continue
                  cases[test.get("name")] = test
          expected = {
              "roundedOpeningMasksCornersAndKeepsFullViewportBounds",
              "rectangularOpeningKeepsLegacyExclusion",
              "opaqueSkinRetainsPaddingBasedScreenExclusion",
              "rasterizedSvgRoundedOpeningUsesSameComposition",
          }
          errors = [name for name, case in cases.items()
                    if any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))]
          print("SkinLayerRenderingTest observed:", sorted(cases))
          print("Missing:", sorted(expected - set(cases)), "Unsuccessful:", errors)
          with open("/dev/stdout", "a") as summary: pass
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"SkinLayerRenderingTest: {len(expected & set(cases))}/4 cases found; failed/skipped: {len(errors)}.\n")
          if (expected - set(cases)) or errors:
              sys.exit(1)
          PY

      - name: Preserve targeted Android test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr200-skin-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
