name: Promote reviewed screenshots

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: screenshot-promotion-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.sender.id == github.event.repository.owner.id &&
      startsWith(github.event.comment.body, format('/jlmod-promote-screenshots{0}', fromJSON('"\n"')))
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Validate reviewed artifact and provenance
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B trusted/scripts/ci-screenshot-promotion.py inspect
          --event "$GITHUB_EVENT_PATH"
          --artifact "$RUNNER_TEMP/screenshot-candidates.zip"
          --state "$RUNNER_TEMP/screenshot-promotion.json"

      - name: Check out exact reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.inspect.outputs.head_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: true

      - name: Promote exact reviewed screenshot renders
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B trusted/scripts/ci-screenshot-promotion.py promote
          --artifact "$RUNNER_TEMP/screenshot-candidates.zip"
          --state "$RUNNER_TEMP/screenshot-promotion.json"
          --target target

      - name: Upload promotion recovery state
        if: ${{ !cancelled() && steps.inspect.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-promotion-state
          path: ${{ runner.temp }}/screenshot-promotion.json
          if-no-files-found: error
          retention-days: 7
