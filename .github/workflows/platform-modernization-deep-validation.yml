name: Platform modernization deep validation

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: platform-modernization-deep-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  toolchain:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'
      - name: Verify Gradle and strict configuration cache
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version | tee gradle-version.txt
          grep -q 'Gradle 9.8.0' gradle-version.txt
          ./gradlew --daemon --stacktrace --configuration-cache --configuration-cache-problems=fail help
          ./gradlew --daemon --stacktrace --configuration-cache --configuration-cache-problems=fail help | tee configuration-cache-help.txt
          grep -Fq 'Reusing configuration cache.' configuration-cache-help.txt
          ./gradlew --daemon --stacktrace --configuration-cache --configuration-cache-problems=fail build --dry-run
      - name: Verify resolved toolchain and runtime baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace buildEnvironment | tee build-environment.txt
          grep -q 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20' build-environment.txt
          grep -q 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.12' build-environment.txt
          ./gradlew --daemon --stacktrace :app:dependencies --configuration emulatorDebugRuntimeClasspath | tee runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.ui:ui(-android)?:1\.12\.1' runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.material3:material3(-android)?:1\.4\.0' runtime-dependencies.txt
          grep -Eq 'androidx\.compose\.material3\.adaptive:adaptive(-android)?:1\.3\.0' runtime-dependencies.txt
          grep -Eq 'androidx\.navigation3:navigation3-runtime(-android)?:1\.1\.7' runtime-dependencies.txt
          grep -Eq 'androidx\.room3:room3-runtime(-android)?:3\.0\.1' runtime-dependencies.txt
          grep -Eq 'androidx\.sqlite:sqlite-framework(-android)?:2\.7\.0' runtime-dependencies.txt
      - name: Verify Room generation and schemas
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --parallel --stacktrace --configuration-cache --configuration-cache-problems=fail :app:testEmulatorDebugUnitTest --tests io.github.h3nb.jlmodplus.librarydb.LibraryMigrationTest
          git diff --exit-code -- app/schemas
      - name: Diagnose Isolated Projects readiness
        id: isolated
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --daemon --stacktrace help --isolated-projects -Dorg.gradle.isolated-projects.diagnostics=true 2>&1 | tee isolated-projects.txt
      - name: Upload toolchain diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-modernization-toolchain
          path: |
            gradle-version.txt
            build-environment.txt
            runtime-dependencies.txt
            configuration-cache-help.txt
            isolated-projects.txt
            build/reports/configuration-cache/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

  release-native:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'
      - name: Build non-publishing minified release
        env:
          JLMOD_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x gradlew
          ./gradlew --daemon --parallel --stacktrace --profile --configuration-cache --configuration-cache-problems=fail :app:assembleEmulatorRelease
      - name: Verify release APK matrix and native provenance
        shell: bash
        run: |
          set -euo pipefail
          output='app/build/outputs/apk/emulator/release'
          metadata="$output/output-metadata.json"
          test -f "$metadata"
          test -f app/build/audio-sources/source-context.json
          jq -e '.ffmpegVersion == "8.1.3" and .openCoreVersion == "0.1.6"' app/build/audio-sources/source-context.json >/dev/null
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            count="$(jq -r --arg abi "$abi" '[.elements[] | select(any(.filters[]?; .filterType == "ABI" and .value == $abi))] | length' "$metadata")"
            [[ "$count" == 1 ]] || { echo "Expected one $abi APK, found $count" >&2; exit 1; }
            stamp="app/build/audio-deps/install-$abi/recipe.txt"
            test -f "$stamp"
            grep -Fq ":30.0.16248370:23:$abi:" "$stamp"
            test -f "app/build/audio-deps/install-$abi/checksums.json"
          done
          universal_count="$(jq -r '[.elements[] | select(((.filters // []) | length) == 0)] | length' "$metadata")"
          [[ "$universal_count" == 1 ]] || { echo "Expected one universal APK, found $universal_count" >&2; exit 1; }
          universal="$(jq -r '.elements[] | select(((.filters // []) | length) == 0) | .outputFile' "$metadata")"
          apk="$output/$universal"
          for library in avformat avcodec avutil swresample; do
            unzip -Z1 "$apk" | grep -Fxq "lib/armeabi-v7a/lib${library}_neon.so"
            for abi in arm64-v8a x86 x86_64; do
              unzip -Z1 "$apk" | grep -Fxq "lib/$abi/lib${library}.so"
            done
            if unzip -Z1 "$apk" | grep -Fxq "lib/armeabi-v7a/lib${library}.so"; then
              echo "Unexpected unsuffixed ARMv7 FFmpeg library: lib${library}.so" >&2
              exit 1
            fi
          done
          test -f app/build/outputs/mapping/emulatorRelease/mapping.txt
      - name: Verify 16 KiB native and APK alignment
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          zipalign="$ANDROID_HOME/build-tools/$build_tools/zipalign"
          test -x "$zipalign"
          output='app/build/outputs/apk/emulator/release'
          universal="$(jq -r '.elements[] | select(((.filters // []) | length) == 0) | .outputFile' "$output/output-metadata.json")"
          apk="$output/$universal"
          "$zipalign" -c -P 16 -v 4 "$apk"
          rm -rf extracted-apk
          mkdir extracted-apk
          unzip -q "$apk" 'lib/*/*.so' -d extracted-apk
          failures=0
          while IFS= read -r -d '' so; do
            while read -r align; do
              if (( align < 0x4000 )); then
                echo "ELF LOAD alignment below 16 KiB: $so ($align)" >&2
                failures=1
              fi
            done < <("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find extracted-apk/lib/arm64-v8a extracted-apk/lib/x86_64 -type f -name '*.so' -print0)
          (( failures == 0 ))
      - name: Verify no source schema mutation
        shell: bash
        run: git diff --exit-code -- app/schemas

  native-runtime-smoke:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'
      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise rebuilt native audio paths
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.media.MediaBoundaryRuntimeTest,javax.microedition.media.SampledAudioRuntimeTest,javax.microedition.media.LegacySmafConversionTest,io.github.h3nb.jlmodplus.mmapi.synth.SonivoxRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.UnifiedAudioRuntimeTest
            :app:connectedEmulatorDebugAndroidTest

  screenshot-failure-contract:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'
      - name: Force one comparison failure without changing canonical references
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 -B -m unittest discover -s scripts/tests -p 'test_ci_screenshot_candidates.py' -v
          readarray -t pair < <(python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          root = Path("app/src/screenshotTestEmulatorDebug/reference")
          files = sorted(root.rglob("*.png"))
          groups = {}
          for path in files:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  continue
              width, height = struct.unpack(">II", data[16:24])
              key = (width, height)
              digest = hashlib.sha256(data).digest()
              for other, other_digest in groups.get(key, []):
                  if other_digest != digest:
                      print(other)
                      print(path)
                      raise SystemExit
              groups.setdefault(key, []).append((path, digest))
          raise SystemExit("No two distinct same-dimension screenshot references found")
          PY
          )
          target="${pair[0]}"
          source="${pair[1]}"
          cp "$source" "$target"
          set +e
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail :app:validateEmulatorDebugScreenshotTest
          status=$?
          set -e
          [[ "$status" -ne 0 ]] || { echo 'Expected forced screenshot comparison failure.' >&2; exit 1; }
          git checkout -- "$target"
          git diff --exit-code -- app/src/screenshotTestEmulatorDebug/reference
          export GITHUB_OUTPUT="$RUNNER_TEMP/candidate-output"
          python3 scripts/ci-screenshot-candidates.py | tee candidate-packager.txt
          grep -q '^available=true$' "$GITHUB_OUTPUT"
          test -f screenshot-candidates/source-context.json
          test -s screenshot-candidates/baselines.patch
          test -n "$(find screenshot-candidates/before -type f -name '*.png' -print -quit)"
          test -n "$(find screenshot-candidates/after -type f -name '*.png' -print -quit)"
          grep -q 'PreviewScreenshot.refImagePath' app/build/test-results/validateEmulatorDebugScreenshotTest/TEST-preview-screenshot-test-engine.xml
          grep -q 'PreviewScreenshot.newImagePath' app/build/test-results/validateEmulatorDebugScreenshotTest/TEST-preview-screenshot-test-engine.xml

  m3g-current:
    if: github.head_ref == 'android-platform-modernization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out modernization head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run stable M3G JNI/runtime subset on r30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.m3g.M3GRuntimeTest#cameraAndLightTransformsCrossJniWithJsr184Semantics,javax.microedition.m3g.M3GRuntimeTest#objectReferenceArraysAndDuplicateRoundTripThroughJni,javax.microedition.m3g.M3GRuntimeTest#rejectsInvalidBindTargetHintsAtPublicApiBoundary,javax.microedition.m3g.M3GRuntimeTest#rejectsImmutableAndUnsupportedImage2DTargetsAtPublicApiBoundary
            :app:connectedEmulatorDebugAndroidTest
