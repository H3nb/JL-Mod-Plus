name: PR 209 temporary Android diagnostics
on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/pr209-android-diagnostics.yml'
      - 'scripts/pr209-android-probe.sh'
      - 'app/src/main/java/javax/microedition/lcdui/keyboard/**'
      - 'app/src/androidTest/java/javax/microedition/lcdui/keyboard/**'
permissions:
  contents: read
jobs:
  pr209-probe:
    if: github.event.pull_request.number == 209
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Install native build toolchain
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run focused instrumentation with crash capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/pr209-android-probe.sh
      - name: Upload Android diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr209-android-crash-evidence
          path: |
            ci-artifacts/pr209-diagnostics/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
