name: PR 252 Visual Screenshot Review

on:
  pull_request:
    branches:
      - alpha
    paths:
      - '.github/workflows/pr252-visual-review.yml'
      - 'scripts/ci-screenshot-review-gallery.py'
      - 'app/src/main/java/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr252-visual-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.number == 252 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Render screenshots without changing branch references
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 scripts/ci-screenshot-candidates.py --prepare-update "$PR_NUMBER"
          ./gradlew --daemon --stacktrace --profile -PjlmodNativeBuild=false :app:updateEmulatorDebugScreenshotTestDefaultTestSuite
          python3 scripts/ci-screenshot-candidates.py --updated
          python3 scripts/ci-screenshot-review-gallery.py

      - name: Upload original renderer images and offline gallery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-PR252-visual-review
          path: screenshot-candidates/
          if-no-files-found: error
          retention-days: 7
