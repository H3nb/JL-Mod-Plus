name: Release JL-Mod Plus

on:
  workflow_dispatch:
    inputs:
      prerelease_suffix:
        description: 'Required on alpha (for example: alpha.1); leave empty on main'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate release channel
        id: channel
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          INPUT_SUFFIX: ${{ inputs.prerelease_suffix }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            alpha)
              if [[ -z "$INPUT_SUFFIX" ]]; then
                echo 'alpha releases require prerelease_suffix (for example: alpha.1).' >&2
                exit 1
              fi
              if [[ ! "$INPUT_SUFFIX" =~ ^[0-9A-Za-z]+([.-][0-9A-Za-z]+)*$ ]]; then
                echo 'Invalid prerelease_suffix. Use identifiers such as alpha.1, beta.1, or rc.1.' >&2
                exit 1
              fi
              echo "version_suffix=-$INPUT_SUFFIX" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              if [[ -n "$INPUT_SUFFIX" ]]; then
                echo 'main releases are stable; prerelease_suffix must be empty.' >&2
                exit 1
              fi
              echo 'version_suffix=' >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Releases are allowed only from alpha or main, not '$BRANCH'." >&2
              exit 1
              ;;
          esac

      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for release signing." >&2
              exit 1
            fi
          done

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks

          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

          keytool -list \
            -keystore release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate and build release
        env:
          VERSION_SUFFIX: ${{ steps.channel.outputs.version_suffix }}
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorRelease

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR='app/build/outputs/apk/emulator/release'
          METADATA="$OUTPUT_DIR/output-metadata.json"

          if [[ ! -f "$METADATA" ]]; then
            echo "Missing APK metadata: $METADATA" >&2
            exit 1
          fi

          APK_FILE="$(jq -r '
            .elements[]
            | select(any(.filters[]?; .filterType == "ABI" and .value == "arm64-v8a"))
            | .outputFile
          ' "$METADATA" | head -n 1)"

          VERSION_NAME="$(jq -r '
            .elements[]
            | select(any(.filters[]?; .filterType == "ABI" and .value == "arm64-v8a"))
            | .versionName
          ' "$METADATA" | head -n 1)"

          if [[ -z "$APK_FILE" || "$APK_FILE" == "null" || -z "$VERSION_NAME" || "$VERSION_NAME" == "null" ]]; then
            echo 'Could not resolve the arm64-v8a release APK or versionName.' >&2
            exit 1
          fi

          APK_PATH="$OUTPUT_DIR/$APK_FILE"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Missing release APK: $APK_PATH" >&2
            exit 1
          fi

          if [[ "${{ github.ref_name }}" == "alpha" && "$VERSION_NAME" != *-* ]]; then
            echo "alpha must produce a pre-release versionName, got '$VERSION_NAME'." >&2
            exit 1
          fi
          if [[ "${{ github.ref_name }}" == "main" && "$VERSION_NAME" == *-* ]]; then
            echo "main must produce a stable versionName, got '$VERSION_NAME'." >&2
            exit 1
          fi

          TAG="v$VERSION_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          mkdir -p dist
          RELEASE_APK="dist/JL-Mod-Plus-$TAG-arm64-v8a.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > dist/SHA256SUMS.txt

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        env:
          APK_PATH: ${{ steps.artifacts.outputs.apk }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found at $APKSIGNER" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.artifacts.outputs.tag }}
          VERSION_NAME: ${{ steps.artifacts.outputs.version_name }}
          APK_PATH: ${{ steps.artifacts.outputs.apk }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            release create "$TAG"
            "$APK_PATH"
            dist/SHA256SUMS.txt
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "JL-Mod Plus $TAG"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
