# Copyright 2026 H3NB

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed ARM64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate release tag and version
        shell: bash
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          test "$version_code" -ge 1
          test "$version_code" -le 2100000000
          printf 'Release version: %s (%s)\n' "$version_name" "$version_code"

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jl-mod-plus-release.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build signed emulator release
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jl-mod-plus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testEmulatorDebugUnitTest
          :app:assembleEmulatorRelease

      - name: Verify signer, manifest, packaged ABI, and R8 mapping
        id: verify-release
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find app/build/outputs/apk/emulator/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          cert_info="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"

          expected_fingerprint="$(grep -v '^[[:space:]]*#' scripts/release-signing-cert-sha256.txt | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          actual_fingerprint="$(printf '%s\n' "$cert_info" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]]
          [[ "$actual_fingerprint" =~ ^[0-9A-F]{64}$ ]]
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Release signer fingerprint does not match scripts/release-signing-cert-sha256.txt" >&2
            echo "Expected: $expected_fingerprint" >&2
            echo "Actual:   $actual_fingerprint" >&2
            exit 1
          fi

          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          grep -F "package: name='io.github.h3nb.jlmodplus' versionCode='$version_code' versionName='$version_name'" <<<"$badging"
          grep -F "minSdkVersion:'23'" <<<"$badging"
          grep -F "targetSdkVersion:'34'" <<<"$badging"
          if grep -q "application-debuggable" <<<"$badging"; then
            echo "Release artifact must not be debuggable" >&2
            exit 1
          fi

          mapping="app/build/outputs/mapping/emulatorRelease/mapping.txt"
          test -s "$mapping"
          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          test "$abis" = "arm64-v8a"
          sha256sum "$apk" > "$apk.sha256"
          printf 'Verified APK: %s\nSigner SHA-256: %s\nABI: %s\nMapping: %s\n' "$apk" "$actual_fingerprint" "$abis" "$mapping"
          printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Attest signed APK provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.verify-release.outputs.apk }}

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-${{ github.ref_name }}-arm64-v8a
          path: |
            app/build/outputs/apk/emulator/release/*.apk
            app/build/outputs/apk/emulator/release/*.sha256
            app/build/outputs/mapping/emulatorRelease/**
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/emulator/release -type f -name '*.apk' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            "$apk" "$apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "JL-Mod Plus $GITHUB_REF_NAME"
