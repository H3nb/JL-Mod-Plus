name: Release JL-Mod Plus

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (e.g. 0.2.3-alpha, 0.2.3-beta, or 0.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jlmod-plus-release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 55

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Test release helpers
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*release*.py' -v

      - name: Plan release identity
        id: channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python3 scripts/release-version.py
          --version "$VERSION" --branch "$BRANCH"
          --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for release signing." >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks

          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

          keytool -list \
            -keystore release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Version preflight already restricts publishing to alpha/stable.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Assemble versioned release
        env:
          RELEASE_VERSION: ${{ steps.channel.outputs.version_name }}
          RELEASE_CODE: ${{ steps.channel.outputs.version_code }}
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --daemon --stacktrace --profile
          --configuration-cache --configuration-cache-problems=fail
          -Pjlmod.versionName="$RELEASE_VERSION"
          -Pjlmod.versionCode="$RELEASE_CODE"
          :app:assembleEmulatorRelease

      - name: Prepare release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.channel.outputs.version_name }}
          VERSION_CODE: ${{ steps.channel.outputs.version_code }}
        run: |
          set -euo pipefail
          MIN_SDK="$(sed -nE 's/^androidMinSdk = "([0-9]+)"$/\1/p' gradle/libs.versions.toml)"
          python3 scripts/prepare-release.py \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --commit "$GITHUB_SHA" --min-sdk "$MIN_SDK" --repository "$GITHUB_REPOSITORY" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signatures and signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          apks=(dist/JL-Mod-Plus-"${{ steps.channel.outputs.tag }}"-*.apk)

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found at $APKSIGNER" >&2
            exit 1
          fi
          if [[ ${#apks[@]} -ne 5 ]]; then
            echo "Expected five release APKs, found ${#apks[@]}." >&2
            exit 1
          fi

          fingerprint() {
            awk -F ': ' '/certificate SHA-256 digest:/ {print tolower($NF)}'
          }
          built_fingerprint=''
          for apk in "${apks[@]}"; do
            certificate="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$certificate"
            current="$(printf '%s\n' "$certificate" | fingerprint)"
            if [[ ! "$current" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unable to read one release signing fingerprint: $apk" >&2
              exit 1
            fi
            if [[ -n "$built_fingerprint" && "$current" != "$built_fingerprint" ]]; then
              echo "Release signer differs across APK variants: $apk" >&2
              exit 1
            fi
            built_fingerprint="$current"
          done

          # Anchor the migration to the certificate on the first published JL-Mod Plus APK.
          mkdir -p prior-release
          gh release download v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64-v8a.apk' --dir prior-release
          shopt -s nullglob
          prior_apks=(prior-release/*-arm64-v8a.apk)
          if [[ ${#prior_apks[@]} -ne 1 || "$("$APKSIGNER" verify --print-certs "${prior_apks[0]}" | fingerprint)" != "$built_fingerprint" ]]; then
            echo 'Signing certificate does not match the existing JL-Mod Plus release.' >&2
            exit 1
          fi

      - name: Publish complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/JL-Mod-Plus-"$TAG"-*.apk)
          if [[ ${#apks[@]} -ne 5 ]]; then
            echo 'Expected five release APKs.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Release tag already exists. Publication aborted.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body \
            >> dist/release-notes.md
          asset_list="$(jq -er '.[] | .path + "#" + .label' dist/assets.json)"
          mapfile -t assets <<< "$asset_list"
          [[ ${#assets[@]} -eq 8 ]]
          args=(
            release create "$TAG" "${assets[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "JL-Mod Plus $TAG"
            --notes-file dist/release-notes.md --draft
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-release-diagnostics
          path: |
            build/reports/problems/**
            build/reports/profile/**
            dist/release-notes.md
            dist/release-info.json
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
