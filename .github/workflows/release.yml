name: Release JL-Mod Plus

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full release version (e.g. 0.2.0-alpha.1 or 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jlmod-plus-release-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 55

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Test release version rules
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_release_version.py' -v

      - name: Plan release identity
        id: channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python3 scripts/release-version.py
          --version "$VERSION" --branch "$BRANCH"
          --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for release signing." >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks

          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

          keytool -list \
            -keystore release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate release sources
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --daemon --stacktrace --profile --continue
          :app:lintEmulatorDebug
          :app:testEmulatorDebugUnitTest
          :dexlib:testDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest

      - name: Assemble versioned release
        env:
          RELEASE_VERSION: ${{ steps.channel.outputs.version_name }}
          RELEASE_CODE: ${{ steps.channel.outputs.version_code }}
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --daemon --stacktrace --profile
          -Pjlmod.versionName="$RELEASE_VERSION"
          -Pjlmod.versionCode="$RELEASE_CODE"
          :app:assembleEmulatorRelease

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR='app/build/outputs/apk/emulator/release'
          METADATA="$OUTPUT_DIR/output-metadata.json"
          MAPPING_SOURCE='app/build/outputs/mapping/emulatorRelease/mapping.txt'

          if [[ ! -f "$METADATA" ]]; then
            echo "Missing APK metadata: $METADATA" >&2
            exit 1
          fi
          if [[ ! -f "$MAPPING_SOURCE" ]]; then
            echo "Missing R8 mapping: $MAPPING_SOURCE" >&2
            exit 1
          fi

          mapfile -t VERSION_NAMES < <(jq -r '.elements[].versionName' "$METADATA" | sort -u)
          mapfile -t VERSION_CODES < <(jq -r '.elements[].versionCode' "$METADATA" | sort -u)
          if [[ ${#VERSION_NAMES[@]} -ne 1 || -z "${VERSION_NAMES[0]}" || "${VERSION_NAMES[0]}" == 'null' ]]; then
            echo 'Release APK outputs do not share one valid versionName.' >&2
            exit 1
          fi
          if [[ ${#VERSION_CODES[@]} -ne 1 || ! "${VERSION_CODES[0]}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Release APK outputs do not share one valid positive versionCode.' >&2
            exit 1
          fi
          VERSION_NAME="${VERSION_NAMES[0]}"
          VERSION_CODE="${VERSION_CODES[0]}"

          if [[ "$VERSION_NAME" != '${{ steps.channel.outputs.version_name }}' ||
                "$VERSION_CODE" != '${{ steps.channel.outputs.version_code }}' ]]; then
            echo 'Built APK identity differs from release plan.' >&2
            exit 1
          fi

          expected_abis=(arm64-v8a armeabi-v7a x86 x86_64)
          declare -A apk_by_label=()
          for abi in "${expected_abis[@]}"; do
            mapfile -t matches < <(jq -r --arg abi "$abi" '
              .elements[]
              | select(any(.filters[]?; .filterType == "ABI" and .value == $abi))
              | .outputFile
            ' "$METADATA")
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one $abi release APK, found ${#matches[@]}." >&2
              exit 1
            fi
            apk_by_label["$abi"]="${matches[0]}"
          done

          mapfile -t universal_matches < <(jq -r '
            .elements[]
            | select(((.filters // []) | length) == 0)
            | .outputFile
          ' "$METADATA")
          if [[ ${#universal_matches[@]} -ne 1 ]]; then
            echo "Expected exactly one universal release APK, found ${#universal_matches[@]}." >&2
            exit 1
          fi
          apk_by_label[universal]="${universal_matches[0]}"

          TAG="v$VERSION_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi

          mkdir -p dist
          for label in "${expected_abis[@]}" universal; do
            source="$OUTPUT_DIR/${apk_by_label[$label]}"
            target="dist/JL-Mod-Plus-$TAG-$label.apk"
            if [[ ! -f "$source" ]]; then
              echo "Missing release APK: $source" >&2
              exit 1
            fi
            cp "$source" "$target"
          done

          RELEASE_MAPPING="dist/JL-Mod-Plus-$TAG-r8-mapping.txt"
          cp "$MAPPING_SOURCE" "$RELEASE_MAPPING"

          jq -n --arg name "$VERSION_NAME" --argjson code "$VERSION_CODE" \
            --arg commit "$GITHUB_SHA" \
            '{schema:1,versionName:$name,versionCode:$code,applicationId:"io.github.h3nb.jlmodplus",minSdk:23,commit:$commit}' \
            > dist/release-info.json
          (
            cd dist
            sha256sum JL-Mod-Plus-"$TAG"-*.apk "$(basename "$RELEASE_MAPPING")" release-info.json > SHA256SUMS.txt
          )

          echo "Release version: $VERSION_NAME (versionCode $VERSION_CODE)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mapping=$RELEASE_MAPPING" >> "$GITHUB_OUTPUT"

      - name: Verify APK signatures and signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          apks=(dist/JL-Mod-Plus-"${{ steps.artifacts.outputs.tag }}"-*.apk)

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found at $APKSIGNER" >&2
            exit 1
          fi
          if [[ ${#apks[@]} -ne 5 ]]; then
            echo "Expected five release APKs, found ${#apks[@]}." >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          fingerprint() {
            "$APKSIGNER" verify --print-certs "$1" |
              awk -F ': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}'
          }
          built_fingerprint="$(fingerprint "${apks[0]}")"
          if [[ ! "$built_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Unable to read release signing fingerprint.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            if [[ "$(fingerprint "$apk")" != "$built_fingerprint" ]]; then
              echo "Release signer differs across APK variants: $apk" >&2
              exit 1
            fi
          done

          # Anchor the migration to the certificate on the first published JL-Mod Plus APK.
          mkdir -p prior-release
          gh release download v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64-v8a.apk' --dir prior-release
          shopt -s nullglob
          prior_apks=(prior-release/*-arm64-v8a.apk)
          if [[ ${#prior_apks[@]} -ne 1 || "$(fingerprint "${prior_apks[0]}")" != "$built_fingerprint" ]]; then
            echo 'Signing certificate does not match the existing JL-Mod Plus release.' >&2
            exit 1
          fi

      - name: Publish complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.artifacts.outputs.tag }}
          MAPPING_PATH: ${{ steps.artifacts.outputs.mapping }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/JL-Mod-Plus-"$TAG"-*.apk)
          if [[ ${#apks[@]} -ne 5 ]]; then
            echo 'Expected five release APKs.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Release tag already exists. Publication aborted.' >&2
            exit 1
          fi
          args=(
            release create "$TAG" "${apks[@]}" "$MAPPING_PATH"
            dist/release-info.json dist/SHA256SUMS.txt
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "JL-Mod Plus $TAG"
            --generate-notes --draft
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-release-diagnostics
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            dexlib/build/reports/lint-results-*.html
            dexlib/build/reports/lint-results-*.xml
            dexlib/build/reports/lint-results-*.sarif
            app/build/reports/tests/**
            app/build/test-results/**
            dexlib/build/reports/tests/**
            dexlib/build/test-results/**
            app/build/reports/screenshotTest/**
            build/reports/problems/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7
