name: PR 181 temporary runtime validation

# Disposable workflow. Remove after connected runtime evidence has been reviewed.
on:
  push:
    branches:
      - fix/midlet-startup-foreground-exit

permissions:
  contents: read

concurrency:
  group: pr181-lifecycle-android-emulator
  cancel-in-progress: true

jobs:
  android-runtime:
    name: Android 35 lifecycle contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Install native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'ndk;30.0.16248370' >/dev/null
          chmod +x gradlew

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run real Android instrumentation methods
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/pr181-temporary-runtime-validation.sh

      - name: Upload executed test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr181-temporary-runtime-evidence
          path: |
            ci-artifacts/pr181-runtime/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/**
          retention-days: 7
          if-no-files-found: warn
