name: Memory Recipes Android qualification (temporary)

on:
  pull_request:
    branches: [alpha]
    paths:
      - 'app/src/main/java/io/github/h3nb/jlmodplus/memory/**'
      - 'app/src/main/aidl/io/github/h3nb/jlmodplus/memory/**'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/memory/MemoryRecipeInstrumentedTest.java'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/memory/MemoryScriptsComposeTest.kt'
      - '.github/workflows/memory-recipes-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run focused recipe instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace --console=plain -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 :app:connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.memory.MemoryRecipeInstrumentedTest,io.github.h3nb.jlmodplus.memory.MemoryScriptsComposeTest
      - name: Archive instrumentation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-recipes-android-tests
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
