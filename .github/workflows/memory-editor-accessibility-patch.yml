name: Memory Editor accessibility patch

on:
  push:
    branches:
      - fix/memory-editor-correctness-20260912
    paths:
      - .github/workflows/memory-editor-accessibility-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused accessibility and clipboard fixes
        run: python3 .github/memory_editor_accessibility_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorRuntimeCompose.kt
          git add app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorController.kt
          git diff --cached --check
          git commit -m "Improve Memory Editor accessibility and clipboard privacy"
          git push
