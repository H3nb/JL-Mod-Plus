name: Temporary Memory IPC runtime validation

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: memory-ipc-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Prepare emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Memory IPC runtime contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.memory.MemoryIpcRuntimeTest
            :app:connectedEmulatorDebugAndroidTest
