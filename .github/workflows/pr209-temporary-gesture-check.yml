name: PR209 temporary gesture instrumentation
on:
  push:
    branches:
      - feature/editor-individual-resize-and-ux

permissions:
  contents: read

jobs:
  gesture-android:
    name: Gesture and persistence on Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Provision NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Run virtual-controls instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodRuntimeTestAbi=x86_64 :app:installEmulatorDebug :app:assembleEmulatorDebugAndroidTest
            mapfile -t apks < <(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print | sort)
            test "${#apks[@]}" -eq 1
            adb install -r -t "${apks[0]}"
            runner=$(adb shell pm list instrumentation | tr -d '\r' | sed -n 's/^instrumentation:\([^ ]*\) (target=io\.github\.h3nb\.jlmodplus\.debug)$/\1/p')
            test -n "$runner"
            adb shell am instrument -w -r -e class javax.microedition.lcdui.keyboard.VirtualControlsKeyboardResizeTest "$runner" | tee /tmp/pr209-instrumentation.log
            grep -Eq '^OK \([0-9]+ tests?\)' /tmp/pr209-instrumentation.log
