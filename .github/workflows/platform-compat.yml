name: Android Platform Compatibility CI

on:
  pull_request:
    branches:
      - alpha
    paths:
      - '.github/workflows/platform-compat.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/src/main/java/javax/microedition/**'
      - 'app/src/main/java/com/nokia/**'
      - 'app/src/main/java/org/microemu/cldc/file/**'
      - 'app/src/main/java/ru/playsoftware/j2meloader/**'
      - 'app/src/debug/**'
      - 'app/src/androidTest/java/ru/playsoftware/j2meloader/platform/**'
      - 'app/src/androidTest/java/ru/playsoftware/j2meloader/util/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime-api-${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Expose Android SDK tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "Android SDK root not found: $sdk_root"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_root/cmdline-tools/latest/bin/avdmanager"

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo '/dev/kvm is unavailable on this runner.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install Android platform emulator image
        shell: bash
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          image="system-images;android-${{ matrix.api }};google_apis;x86_64"
          avd="jlmod-platform-compat-${{ matrix.api }}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' "$image"
          echo 'no' | avdmanager create avd \
            --force \
            --name "$avd" \
            --package "$image" \
            -p "$ANDROID_AVD_HOME/$avd.avd"
          test -f "$ANDROID_AVD_HOME/$avd.ini"

      - name: Start Android platform emulator
        shell: bash
        run: |
          mkdir -p build/ci-logs
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "jlmod-platform-compat-${{ matrix.api }}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > build/ci-logs/platform-compat-emulator.log 2>&1 &
          echo $! > build/ci-logs/platform-compat-emulator.pid

          timeout 120 adb wait-for-device
          timeout 240 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          test "$(adb shell getprop ro.build.version.sdk | tr -d "\r")" = "${{ matrix.api }}"
          adb shell getprop ro.product.cpu.abi

      - name: Run Android platform compatibility instrumentation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -PjlmodRuntimeTestAbi=x86_64 \
            -Pandroid.testInstrumentationRunnerArguments.class=ru.playsoftware.j2meloader.platform.PlatformCompatManifestTest,ru.playsoftware.j2meloader.platform.PlatformCompatBehaviorTest,ru.playsoftware.j2meloader.platform.FileConnectionContractTest,ru.playsoftware.j2meloader.util.UriImportContractTest \
            :app:connectedEmulatorDebugAndroidTest \
            2>&1 | tee build/ci-logs/platform-compat-gradle.log

      - name: Verify APK target SDK
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/emulator/debug -maxdepth 1 -type f -name '*x86_64-debug.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo 'Unable to locate the x86_64 emulator debug APK.'
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          target_sdk="$(apkanalyzer manifest target-sdk "$apk" | tr -d '\r')"
          echo "APK: $apk"
          echo "APK target SDK: $target_sdk"
          test "$target_sdk" = "36"

      - name: Upload platform compatibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-platform-compat-${{ github.run_number }}-api${{ matrix.api }}
          path: |
            build/ci-logs/platform-compat-emulator.log
            build/ci-logs/platform-compat-gradle.log
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Android emulator
        if: always()
        shell: bash
        run: adb emu kill || true
