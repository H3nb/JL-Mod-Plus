name: Apply adaptive Memory Editor gate

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/memory-editor-stack-f914594
          fetch-depth: 0
      - name: Patch MemoryEngineService exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java')
          text = path.read_text(encoding='utf-8')
          old = '''\tprivate int refineKnownAddressSet(long token, int predicate, String first, String second) {
          \t\t// Known/Auto search results are raw address membership. A GC epoch change may make some old
          \t\t// addresses disappear, but it must not reinterpret Next Scan as object-identity recovery,
          \t\t// trigger a fresh mincore range capture, or rescan the whole Java heap. The native refine
          \t\t// filters only the committed addresses. GC remains relevant later when a bounded row is
          \t\t// promoted for Watch/Edit/Freeze/Inspector.
          \t\tlong gcBefore = currentGcCount(token);
          \t\tint result = NativeMemoryEngine.refineKnown(predicate, first, second);
          \t\tif (result != MemoryEngineContract.RESULT_OK) return result;
          \t\tlong gcAfter = currentGcCount(token);
          \t\tadvanceSearchSession(MemoryEngineContract.SEARCH_SESSION_CANDIDATES,
          \t\t\t\tMemoryGcPolicy.publishedSearchEpoch(false, gcBefore, gcAfter));
          \t\treturn MemoryEngineContract.RESULT_OK;
          \t}
          '''
          new = '''\tprivate int refineKnownAddressSet(long token, int predicate, String first, String second) {
          \t\t// Bulk Known/Auto results are address membership. A stale GC epoch merely permits native
          \t\t// to probe for broad relocation; it does not itself request a full target scan. Native
          \t\t// additionally requires a large result set and strong sampled fingerprint evidence.
          \t\t// After a successful refine the published revision epoch advances, so the same GC epoch
          \t\t// cannot repeatedly trigger reconciliation. Small result sets always stay candidate-only.
          \t\tlong gcBefore = currentGcCount(token);
          \t\tboolean allowRelocationReconcile = gcBindings.searchEpochChanged(gcBefore);
          \t\tint result = NativeMemoryEngine.refineKnown(
          \t\t\t\tpredicate, first, second, allowRelocationReconcile);
          \t\tif (result != MemoryEngineContract.RESULT_OK) return result;
          \t\tlong gcAfter = currentGcCount(token);
          \t\tadvanceSearchSession(MemoryEngineContract.SEARCH_SESSION_CANDIDATES,
          \t\t\t\tMemoryGcPolicy.publishedSearchEpoch(false, gcBefore, gcAfter));
          \t\treturn MemoryEngineContract.RESULT_OK;
          \t}
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one refineKnownAddressSet snippet, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java
          git diff --cached --quiet && exit 0
          git commit -m "memory: gate relocation reconciliation by GC epoch"
          git push origin HEAD:ci/memory-editor-stack-f914594
