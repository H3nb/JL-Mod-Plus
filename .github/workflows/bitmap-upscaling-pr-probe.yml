name: 2D + 3D PR Runtime Probe

on:
  push:
    branches: [feature/internal-resolution-alpha]
    paths:
      - '.github/workflows/bitmap-upscaling-pr-probe.yml'
      - 'app/src/main/java/javax/microedition/lcdui/**'
      - 'app/src/main/java/javax/microedition/m3g/**'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/graphics/**'
      - 'app/src/test/java/io/github/h3nb/jlmodplus/graphics/**'
      - 'app/src/test/java/javax/microedition/lcdui/**'
      - 'app/src/androidTest/java/javax/microedition/m3g/**'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/micro3d/**'
      - 'app/src/androidTest/java/javax/microedition/lcdui/BitmapUpscalingGraphicsTest.java'
      - 'app/src/androidTest/java/javax/microedition/lcdui/InternalResolutionGraphicsTest.java'
      - 'app/src/androidTest/java/javax/microedition/lcdui/BitmapUpscalingPerfProbeTest.java'
      - 'app/src/androidTest/java/javax/microedition/lcdui/BitmapUpscalingPhaseProbeTest.java'
      - 'app/src/main/java/javax/microedition/m3g/**'
      - 'app/src/androidTest/java/javax/microedition/m3g/M3GRuntimeTest.java'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/micro3d/**'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/micro3d/Micro3dInternalResolutionTest.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-upscaling-pr-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Bitmap 2D - Android API ${{ matrix.api }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run focused Bitmap/Canvas instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            mkdir -p app/build/outputs/androidTest-results/connected/
            trap 'adb logcat -d -s JL-HD-Perf:I > app/build/outputs/androidTest-results/connected/hd-perf-logcat.txt || true' EXIT
            # Runner-local retry policy only: do not change the checked-in
            # Gradle version or its pinned SHA-256 distribution checksum.
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' gradle/wrapper/gradle-wrapper.properties
            printf '\nretries=2\nretryBackOffMs=1500\n' >> gradle/wrapper/gradle-wrapper.properties
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.BitmapUpscalingGraphicsTest,javax.microedition.lcdui.InternalResolutionGraphicsTest,javax.microedition.lcdui.BitmapUpscalingPerfProbeTest,javax.microedition.lcdui.BitmapUpscalingPhaseProbeTest :app:connectedEmulatorDebugAndroidTest
      - name: Preserve runtime reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitmap-upscaling-pr-api${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn

  native-m3g:
    name: Native M3G + Micro3D - Android API 35
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Provision NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native M3G and Micro3D HD contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            # Runner-local retry policy only: do not change the checked-in
            # Gradle version or its pinned SHA-256 distribution checksum.
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' gradle/wrapper/gradle-wrapper.properties
            printf '\nretries=2\nretryBackOffMs=1500\n' >> gradle/wrapper/gradle-wrapper.properties
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=true -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.m3g.M3GRuntimeTest#highResolutionGraphicsTargetKeepsLogicalViewportAndPhysicalRaster,io.github.h3nb.jlmodplus.micro3d.Micro3dInternalResolutionTest,io.github.h3nb.jlmodplus.micro3d.EnvironmentTextureGlesTest :app:connectedEmulatorDebugAndroidTest
      - name: Preserve native M3G and Micro3D runtime reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3g-native-hd-api35
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn
