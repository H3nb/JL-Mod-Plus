name: Update Memory Editor screenshot baselines

on:
  push:
    branches:
      - fix/memory-editor-correctness-20260912
    paths:
      - .github/workflows/update-memory-editor-screenshots.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Update screenshot references
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Verify and commit only expected baselines
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            'app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/memory/MemoryEditorScreenshotTestKt/MemoryEditorLandscapeKnownSearchDialogScreenshot_Memory Editor landscape known search dialog_a2b3282f_0.png'
            'app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/memory/MemoryEditorScreenshotTestKt/MemoryEditorPortraitScreenshot_Memory Editor portrait_f8429708_0.png'
            'app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/memory/MemoryEditorScreenshotTestKt/MemoryInspectorCompactScreenshot_Memory Inspector compact_bb0f7d84_0.png'
          )

          mapfile -t changed < <(git diff --name-only -- 'app/src/screenshotTestEmulatorDebug/reference/' | sort)
          printf 'Changed screenshot references:\n%s\n' "${changed[*]}"

          if [[ ${#changed[@]} -ne 3 ]]; then
            echo "Expected exactly 3 changed screenshot references, found ${#changed[@]}" >&2
            exit 1
          fi

          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo 'Screenshot updater changed an unexpected baseline.' >&2
            diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${changed[@]}") || true
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git diff --cached --check
          git commit -m 'Update Memory Editor screenshot baselines'
          git push
