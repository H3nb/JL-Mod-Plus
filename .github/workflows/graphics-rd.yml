name: Graphics R&D (experimental)

on:
  push:
    branches:
      - research/graphics-architecture
    paths:
      - '.github/workflows/graphics-rd.yml'
      - 'scripts/graphics-rd-smoke.sh'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/research/**'
      - 'app/src/main/java/javax/microedition/**'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/micro3d/**'
      - 'app/src/main/cpp/m3g/**'
      - 'docs/research/graphics/**'

permissions:
  contents: read

concurrency:
  group: graphics-rd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offscreen-and-native-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Install native toolchain
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run graphics experiments on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/graphics-rd-smoke.sh
      - name: Upload graphics R&D evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphics-rd-evidence
          path: |
            ci-artifacts/graphics-rd/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
