name: Phase 5A.1 Screenshot Baseline Helper

on:
  push:
    branches:
      - docs/localization-contract

permissions:
  contents: write

jobs:
  update-reviewed-baselines:
    if: ${{ github.repository == 'H3nb/JL-Mod-Plus' && !contains(github.event.head_commit.message, 'Update reviewed screenshot references') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: docs/localization-contract
          submodules: recursive
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Regenerate screenshot references
        run: |
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --profile :app:updateEmulatorDebugScreenshotTest

      - name: Verify reviewed baseline scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-baselines.txt <<'EOF'
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigScreenPresetDialogScreenshot_Config screen presets_ebb6890e_0.png
          app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt/RuntimeFullscreenMenuDarkLandscapeScreenshot_Runtime fullscreen menu dark landscape_38047bd8_0.png
          app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt/RuntimeOverflowMenuScreenshot_Runtime overflow menu_821c17cd_0.png
          EOF
          git diff --name-only -- app/src/screenshotTestEmulatorDebug/reference | sort > /tmp/actual-baselines.txt
          sort -o /tmp/expected-baselines.txt /tmp/expected-baselines.txt
          diff -u /tmp/expected-baselines.txt /tmp/actual-baselines.txt

      - name: Commit reviewed screenshot references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --             'app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigScreenPresetDialogScreenshot_Config screen presets_ebb6890e_0.png'             'app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt/RuntimeFullscreenMenuDarkLandscapeScreenshot_Runtime fullscreen menu dark landscape_38047bd8_0.png'             'app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt/RuntimeOverflowMenuScreenshot_Runtime overflow menu_821c17cd_0.png'
          git diff --cached --quiet && exit 0
          git commit -m 'Update reviewed screenshot references [skip ci]'
          git push origin HEAD:docs/localization-contract
