name: Native cache qualification

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: native-cache-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relocatable-arm64:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out root A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Create clean root B snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/root-b"
          mkdir -p "$RUNNER_TEMP/root-b"
          cp -a . "$RUNNER_TEMP/root-b/"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Build native dependencies in root A
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --console=plain --no-configuration-cache --build-cache --rerun-tasks \
            :app:buildNativeAudioarm64v8a | tee "$RUNNER_TEMP/root-a-native.log"
          grep -Fq 'PASS prepared pinned native audio sources' "$RUNNER_TEMP/root-a-native.log"
          grep -Fq 'PASS build arm64-v8a' "$RUNNER_TEMP/root-a-native.log"
          (
            cd app/build/audio-deps/install-arm64-v8a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/root-a.sha256"

      - name: Restore native dependencies in root B
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/root-b"
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --console=plain --no-configuration-cache --build-cache \
            :app:buildNativeAudioarm64v8a | tee "$RUNNER_TEMP/root-b-native.log"
          grep -Fq '> Task :app:buildNativeAudioarm64v8a FROM-CACHE' "$RUNNER_TEMP/root-b-native.log"
          if grep -Fq 'PASS prepared pinned native audio sources' "$RUNNER_TEMP/root-b-native.log"; then
            echo 'Source preparation unexpectedly ran on the root-B Build Cache hit.' >&2
            exit 1
          fi
          (
            cd app/build/audio-deps/install-arm64-v8a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/root-b.sha256"
          diff -u "$RUNNER_TEMP/root-a.sha256" "$RUNNER_TEMP/root-b.sha256"

      - name: Package APK in root B
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/root-b"
          ./gradlew --daemon --stacktrace --console=plain --configuration-cache --configuration-cache-problems=fail \
            :app:assembleEmulatorDebug
          test -f app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk
          {
            echo 'Native cache relocation qualification passed.'
            echo 'root-B restored arm64 native outputs FROM-CACHE without source preparation.'
            echo 'All restored output files matched root-A SHA-256 values.'
            echo 'root-B packaged the emulator debug APK successfully.'
          } >> "$GITHUB_STEP_SUMMARY"

  all-abi-source-preparation:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Build all native dependency ABIs from cache miss
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --console=plain --no-configuration-cache \
            --no-build-cache --rerun-tasks --parallel \
            :app:buildNativeAudioarm64v8a \
            :app:buildNativeAudioarmeabiv7a \
            :app:buildNativeAudiox86 \
            :app:buildNativeAudiox8664 | tee all-abi-native.log

          test "$(grep -Fc 'PASS prepared pinned native audio sources' all-abi-native.log)" -eq 1
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "PASS build $abi" all-abi-native.log
          done

      - name: Assemble all-ABI release from qualified outputs
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --console=plain \
            --configuration-cache --configuration-cache-problems=fail \
            :app:assembleEmulatorRelease
          test -f app/build/outputs/apk/emulator/release/app-emulator-universal-release-unsigned.apk
          {
            echo 'All-ABI source preparation qualification passed.'
            echo 'Pinned sources were prepared exactly once for four forced native cache misses.'
            echo 'All four ABI dependency builds completed and release packaging succeeded.'
          } >> "$GITHUB_STEP_SUMMARY"
