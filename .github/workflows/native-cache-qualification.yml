name: Native cache qualification

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: native-cache-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-concurrency:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Qualify all-ABI source preparation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --daemon --stacktrace --console=plain --profile \
            --no-build-cache --configuration-cache --configuration-cache-problems=fail \
            :app:buildNativeAudioarm64v8a \
            :app:buildNativeAudioarmeabiv7a \
            :app:buildNativeAudiox86 \
            :app:buildNativeAudiox8664 | tee native-all-abi.log

          prep_count="$(grep -cF 'PASS prepared pinned native audio sources =>' native-all-abi.log || true)"
          [[ "$prep_count" -eq 1 ]] || {
            echo "Expected exactly one native source preparation, saw $prep_count." >&2
            exit 1
          }
          ! grep -Fq 'prepareNativeAudioSources' native-all-abi.log

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "PASS build $abi =>" native-all-abi.log
            lib_dir="app/build/audio-deps/install-$abi/lib"
            [[ "$(find "$lib_dir" -maxdepth 1 -type f -name '*.so' | wc -l)" -eq 4 ]]
          done

          sha256sum app/build/audio-deps/install-*/lib/*.so | sort > native-all-abi-sha256.txt

      - name: Upload concurrency diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-concurrency
          path: |
            native-all-abi.log
            native-all-abi-sha256.txt
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7

  native-portability:
    if: github.event.pull_request.number == 152
    needs: native-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out root A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: root-A
          persist-credentials: false
          submodules: recursive

      - name: Check out root B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: root-B
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Qualify native Build Cache relocation
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x root-A/gradlew root-B/gradlew

          find "$HOME/.gradle/caches" -maxdepth 1 -type d -name 'build-cache-*' -prune -exec rm -rf {} +

          (
            cd root-A
            ./gradlew --daemon --stacktrace --console=plain \
              --configuration-cache --configuration-cache-problems=fail \
              :app:buildNativeAudioarm64v8a
          ) | tee root-a.log

          ! grep -Fq ':app:buildNativeAudioarm64v8a FROM-CACHE' root-a.log
          [[ "$(grep -cF 'PASS prepared pinned native audio sources =>' root-a.log || true)" -eq 1 ]]
          (
            cd root-A
            sha256sum app/build/audio-deps/install-arm64-v8a/lib/*.so | sed 's#  .*lib/#  #' | sort
          ) > root-a-sha256.txt

          (
            cd root-B
            ./gradlew --daemon --stacktrace --console=plain \
              --configuration-cache --configuration-cache-problems=fail \
              :app:buildNativeAudioarm64v8a
          ) | tee root-b.log

          grep -Fq ':app:buildNativeAudioarm64v8a FROM-CACHE' root-b.log
          ! grep -Fq 'PASS prepared pinned native audio sources =>' root-b.log
          (
            cd root-B
            sha256sum app/build/audio-deps/install-arm64-v8a/lib/*.so | sed 's#  .*lib/#  #' | sort
          ) > root-b-sha256.txt
          diff -u root-a-sha256.txt root-b-sha256.txt

          (
            cd root-B
            ./gradlew --daemon --stacktrace --console=plain \
              --configuration-cache --configuration-cache-problems=fail \
              :app:assembleEmulatorDebug
          ) | tee root-b-package.log

          test -f root-B/app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk

          {
            echo 'Native cache portability qualification passed.'
            echo 'root-B restored the arm64 native dependency output FROM-CACHE.'
            echo 'Source preparation did not run in root-B.'
            echo 'Restored shared-library SHA-256 values match root-A.'
            echo 'root-B packaged the emulator debug APK successfully.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portability diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-portability
          path: |
            root-a.log
            root-b.log
            root-b-package.log
            root-a-sha256.txt
            root-b-sha256.txt
          if-no-files-found: warn
          retention-days: 7
