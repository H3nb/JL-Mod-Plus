name: Memory Editor stabilization

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/memory-editor-stabilize.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - name: Apply stabilization patches
        run: |
          python3 .github/memory_editor_stabilize.py
          python3 .github/memory_editor_stabilize_strings.py
      - name: Validate focused build
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testEmulatorDebugUnitTest
          :app:lintEmulatorDebug
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest
      - name: Commit stabilized Memory Editor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/memory-editor-stabilize.yml .github/memory_editor_stabilize.py .github/memory_editor_stabilize_strings.py
          git add \
            app/src/main/aidl/ru/playsoftware/j2meloader/memory/IMemoryEngineService.aidl \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineContract.java \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorModels.kt \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorController.kt \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt \
            app/src/main/res/values/memory_editor_strings.xml \
            app/src/main/res/values-in/memory_editor_strings.xml \
            app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEditorComposeTest.kt \
            app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEngineContractTest.java \
            app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInputComposeTest.kt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Stabilize Memory Editor workspace state and input'
          git push origin HEAD:ci/memory-editor-stack-f914594
