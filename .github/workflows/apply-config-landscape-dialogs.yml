name: Apply adaptive Config dialogs

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v5.0.0
        with:
          cache-read-only: true
      - name: Apply adaptive landscape dialog layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ru/playsoftware/j2meloader/config/ConfigComposeBridge.kt')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          # Screen preset dialog: remove the fixed 320dp minimum and size against the viewport.
          replace_once(
              '    var customResolutionVisible by rememberSaveable { mutableStateOf(false) }\n    val listedPresets =',
              '    var customResolutionVisible by rememberSaveable { mutableStateOf(false) }\n    val landscape = configDialogLandscape()\n    val dialogMaxHeight = (LocalConfiguration.current.screenHeightDp.dp * 0.88f).coerceAtLeast(180.dp)\n    val listedPresets =',
              'screen preset landscape state',
          )
          replace_once(
              '''            modifier = Modifier\n                .fillMaxWidth(0.92f)\n                .widthIn(max = 560.dp)\n                .heightIn(min = 320.dp, max = 640.dp),''',
              '''            modifier = Modifier\n                .fillMaxWidth(if (landscape) 0.90f else 0.92f)\n                .widthIn(max = if (landscape) 840.dp else 560.dp)\n                .heightIn(max = dialogMaxHeight),''',
              'screen preset surface sizing',
          )

          # Shared adaptive sizing for Config-owned popup editors.
          marker = '@Composable\ninternal fun CustomResolutionDialog('
          helper = '''@Composable\nprivate fun configDialogLandscape(): Boolean =\n    LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE\n\nprivate fun configDialogModifier(landscape: Boolean): Modifier = if (landscape) {\n    Modifier\n        .fillMaxWidth(0.90f)\n        .widthIn(max = 840.dp)\n} else {\n    Modifier.widthIn(max = 560.dp)\n}\n\n@Composable\nprivate fun configDialogBodyModifier(landscape: Boolean): Modifier {\n    val screenHeight = LocalConfiguration.current.screenHeightDp.dp\n    val maxBodyHeight = if (landscape) {\n        (screenHeight * 0.48f).coerceAtLeast(120.dp)\n    } else {\n        (screenHeight * 0.62f).coerceAtLeast(220.dp)\n    }\n    return Modifier\n        .heightIn(max = maxBodyHeight)\n        .verticalScroll(rememberScrollState())\n}\n\n'''
          replace_once(marker, helper + marker, 'adaptive dialog helpers')

          # Custom resolution dialog.
          replace_once(
              '    val valid = validWidth != null && validHeight != null\n\n    AlertDialog(\n        onDismissRequest = onDismissRequest,',
              '    val valid = validWidth != null && validHeight != null\n    val landscape = configDialogLandscape()\n\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,',
              'custom resolution adaptive shell',
          )
          replace_once(
              '        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                Row(',
              '        text = {\n            Column(\n                modifier = configDialogBodyModifier(landscape),\n                verticalArrangement = Arrangement.spacedBy(12.dp),\n            ) {\n                Row(',
              'custom resolution scroll body',
          )

          # Font size editor: adaptive shell + horizontal fields in landscape.
          replace_once('private fun FontSizesDialog(', 'internal fun FontSizesDialog(', 'font dialog visibility')
          replace_once(
              '    var largeDraft by remember(large) { mutableStateOf(large) }\n    AlertDialog(\n        onDismissRequest = onDismissRequest,',
              '    var largeDraft by remember(large) { mutableStateOf(large) }\n    val landscape = configDialogLandscape()\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,',
              'font dialog adaptive shell',
          )
          old_font_body = '''        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                Text(\n                    text = stringResource(R.string.config_help_font_sizes_long),\n                    style = MaterialTheme.typography.bodyMedium,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n                OutlinedTextField(\n                    value = smallDraft,\n                    onValueChange = { smallDraft = it },\n                    label = { Text(stringResource(R.string.PREF_FONT_SMALL)) },\n                    singleLine = true,\n                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                    modifier = Modifier.fillMaxWidth(),\n                )\n                OutlinedTextField(\n                    value = mediumDraft,\n                    onValueChange = { mediumDraft = it },\n                    label = { Text(stringResource(R.string.PREF_FONT_MEDIUM)) },\n                    singleLine = true,\n                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                    modifier = Modifier.fillMaxWidth(),\n                )\n                OutlinedTextField(\n                    value = largeDraft,\n                    onValueChange = { largeDraft = it },\n                    label = { Text(stringResource(R.string.PREF_FONT_LARGE)) },\n                    singleLine = true,\n                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                    modifier = Modifier.fillMaxWidth(),\n                )\n            }\n        },'''
          new_font_body = '''        text = {\n            Column(\n                modifier = configDialogBodyModifier(landscape),\n                verticalArrangement = Arrangement.spacedBy(10.dp),\n            ) {\n                Text(\n                    text = stringResource(R.string.config_help_font_sizes_long),\n                    style = MaterialTheme.typography.bodyMedium,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n                if (landscape) {\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(12.dp),\n                    ) {\n                        FontSizeField(smallDraft, { smallDraft = it }, R.string.PREF_FONT_SMALL, Modifier.weight(1f))\n                        FontSizeField(mediumDraft, { mediumDraft = it }, R.string.PREF_FONT_MEDIUM, Modifier.weight(1f))\n                        FontSizeField(largeDraft, { largeDraft = it }, R.string.PREF_FONT_LARGE, Modifier.weight(1f))\n                    }\n                } else {\n                    FontSizeField(smallDraft, { smallDraft = it }, R.string.PREF_FONT_SMALL)\n                    FontSizeField(mediumDraft, { mediumDraft = it }, R.string.PREF_FONT_MEDIUM)\n                    FontSizeField(largeDraft, { largeDraft = it }, R.string.PREF_FONT_LARGE)\n                }\n            }\n        },'''
          replace_once(old_font_body, new_font_body, 'font dialog body')
          font_end = '''    )\n}\n\n@Composable\nprivate fun InputSection('''
          font_field = '''    )\n}\n\n@Composable\nprivate fun FontSizeField(\n    value: String,\n    onValueChange: (String) -> Unit,\n    labelRes: Int,\n    modifier: Modifier = Modifier.fillMaxWidth(),\n) {\n    OutlinedTextField(\n        value = value,\n        onValueChange = onValueChange,\n        label = { Text(stringResource(labelRes)) },\n        singleLine = true,\n        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n        modifier = modifier,\n    )\n}\n\n@Composable\nprivate fun InputSection('''
          replace_once(font_end, font_field, 'font field helper')

          # Confirmation dialog also follows landscape width, even though its body is short.
          replace_once(
              '    AlertDialog(\n        onDismissRequest = onDismissRequest,\n        title = { Text(stringResource(action.title)) },',
              '    val landscape = configDialogLandscape()\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,\n        title = { Text(stringResource(action.title)) },',
              'confirmation adaptive shell',
          )

          # Number dialog.
          replace_once(
              '    var draft by remember(initialValue) { mutableStateOf(initialValue) }\n\n    AlertDialog(\n        onDismissRequest = onDismissRequest,',
              '    var draft by remember(initialValue) { mutableStateOf(initialValue) }\n    val landscape = configDialogLandscape()\n\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,',
              'number adaptive shell',
          )
          replace_once(
              '        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                if (description != null) {',
              '        text = {\n            Column(\n                modifier = configDialogBodyModifier(landscape),\n                verticalArrangement = Arrangement.spacedBy(10.dp),\n            ) {\n                if (description != null) {',
              'number scroll body',
          )

          # Slider dialog.
          replace_once(
              '    var draftText by remember(initialValue) { mutableStateOf(initialValue.toString()) }\n    val range = valueRange.first.toFloat()..valueRange.last.toFloat()\n\n    AlertDialog(\n        onDismissRequest = onDismissRequest,',
              '    var draftText by remember(initialValue) { mutableStateOf(initialValue.toString()) }\n    val range = valueRange.first.toFloat()..valueRange.last.toFloat()\n    val landscape = configDialogLandscape()\n\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,',
              'slider adaptive shell',
          )
          replace_once(
              '        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                if (description != null) {',
              '        text = {\n            Column(\n                modifier = configDialogBodyModifier(landscape),\n                verticalArrangement = Arrangement.spacedBy(12.dp),\n            ) {\n                if (description != null) {',
              'slider scroll body',
          )

          # Choice dialog: wide shell and a shorter scrollable option list in landscape.
          replace_once(
              ') {\n    AlertDialog(\n        onDismissRequest = onDismissRequest,\n        title = { Text(title) },\n        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                if (description != null) {',
              ') {\n    val landscape = configDialogLandscape()\n    AlertDialog(\n        modifier = configDialogModifier(landscape),\n        properties = DialogProperties(usePlatformDefaultWidth = !landscape),\n        onDismissRequest = onDismissRequest,\n        title = { Text(title) },\n        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                if (description != null) {',
              'choice adaptive shell',
          )
          replace_once(
              '                LazyColumn(modifier = Modifier.heightIn(max = 360.dp)) {',
              '                LazyColumn(modifier = Modifier.heightIn(max = if (landscape) 180.dp else 360.dp)) {',
              'choice list height',
          )

          path.write_text(text)

          # Screenshot coverage: reproduce the short landscape viewport that exposed the bug.
          test_path = Path('app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/config/ConfigScreenshotTest.kt')
          tests = test_path.read_text()
          marker = '''@PreviewTest\n@Preview(name = "Config screen presets", widthDp = 360, heightDp = 640, showBackground = true)'''
          insert = '''@PreviewTest\n@Preview(name = "Config font sizes landscape", widthDp = 640, heightDp = 360, showBackground = true)\n@Composable\nfun ConfigFontSizesLandscapeScreenshot() {\n    JLModPlusTheme {\n        FontSizesDialog(\n            small = "18",\n            medium = "22",\n            large = "26",\n            onDismissRequest = {},\n            onConfirm = { _, _, _ -> },\n        )\n    }\n}\n\n@PreviewTest\n@Preview(\n    name = "Config font sizes landscape large font",\n    widthDp = 640,\n    heightDp = 360,\n    fontScale = 1.35f,\n    showBackground = true,\n)\n@Composable\nfun ConfigFontSizesLandscapeLargeFontScreenshot() {\n    JLModPlusTheme {\n        FontSizesDialog(\n            small = "18",\n            medium = "22",\n            large = "26",\n            onDismissRequest = {},\n            onConfirm = { _, _, _ -> },\n        )\n    }\n}\n\n@PreviewTest\n@Preview(name = "Config choice dialog landscape", widthDp = 640, heightDp = 360, showBackground = true)\n@Composable\nfun ConfigChoiceDialogLandscapeScreenshot() {\n    JLModPlusTheme {\n        ConfigChoiceDialog(\n            title = "Screen Orientation",\n            description = "Determines the requested display orientation while the application is running.",\n            selected = "Automatic",\n            options = listOf("Automatic", "Landscape", "Reverse Landscape", "Portrait", "Reverse Portrait"),\n            onDismissRequest = {},\n            onSelected = {},\n        )\n    }\n}\n\n''' + marker
          if tests.count(marker) != 1:
              raise SystemExit('screenshot insertion marker not unique')
          tests = tests.replace(marker, insert, 1)
          test_path.write_text(tests)
          PY

          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          ./gradlew --no-daemon :app:compileEmulatorDebugKotlin :app:validateEmulatorDebugScreenshotTest :app:testEmulatorDebugUnitTest
          rm .github/workflows/apply-config-landscape-dialogs.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Config dialogs adaptive in landscape"
          git push origin HEAD:ui/redesign-config
