name: Memory Editor history audit fix

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/memory-editor-history-sync.yml

permissions:
  contents: write

jobs:
  fix-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - name: Apply history synchronization patch
        run: python3 .github/memory_editor_history_sync.py
      - name: Validate full Memory Editor integration
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest
      - name: Commit history audit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/memory-editor-history-sync.yml .github/memory_editor_history_sync.py
          git add \
            app/src/main/cpp/memory/memory_engine.cpp \
            app/src/main/java/ru/playsoftware/j2meloader/memory/NativeMemoryEngine.java \
            app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Synchronize Memory Editor Undo history'
          git push origin HEAD:ci/memory-editor-stack-f914594
