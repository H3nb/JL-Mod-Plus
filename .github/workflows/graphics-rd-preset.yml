name: Graphics R&D GLSLP Preset (JVM only)

on:
  push:
    branches: [research/graphics-architecture]
    paths:
      - '.github/workflows/graphics-rd-preset.yml'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/research/GlslpPresetResearch.java'
      - 'app/src/test/java/io/github/h3nb/jlmodplus/research/GlslpPresetResearchTest.java'

permissions:
  contents: read

concurrency:
  group: graphics-rd-preset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preset-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Validate bounded preset planning
        run: |
          ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false \
            :app:testEmulatorDebugUnitTest \
            --tests io.github.h3nb.jlmodplus.research.GlslpPresetResearchTest
      - name: Upload focused JVM test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphics-rd-preset-jvm-evidence
          path: |
            app/build/test-results/testEmulatorDebugUnitTest/
            app/build/reports/tests/testEmulatorDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
