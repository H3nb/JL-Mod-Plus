name: Memory Editor adaptive input fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memory-editor-adaptive-input.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply guarded source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/memory-editor-adaptive-input.py')
          text = path.read_text()
          old = '''private fun RowScope.KeypadButton(\n    label: String,\n    onClick: () -> Unit,\n    weight: Float = 1f,\n) {'''
          new = '''private fun RowScope.KeypadButton(\n    label: String,\n    weight: Float = 1f,\n    onClick: () -> Unit,\n) {'''
          if text.count(old) != 1:
              raise SystemExit('KeypadButton generator marker mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/memory-editor-adaptive-input.py
          git diff --check
          git diff --name-only
      - name: Validate source and unit integration
        run: ./gradlew :app:testEmulatorDebugUnitTest :app:lintEmulatorDebug :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest --stacktrace
      - name: Commit adaptive input source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt \
                  app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt \
                  app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt \
                  app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryInputComposeTest.kt \
                  app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTest.kt
          git commit -m 'Fix Memory Editor caret and adaptive landscape input'
          git rm .github/workflows/memory-editor-adaptive-input.yml .github/scripts/memory-editor-adaptive-input.py
          git commit -m 'Remove adaptive input helper files'
          git push origin HEAD:ci/memory-editor-stack-f914594
