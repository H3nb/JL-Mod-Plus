name: Memory Editor hardening patch
# retry after matching current traversal source

on:
  push:
    branches:
      - fix/memory-editor-correctness-20260912
    paths:
      - .github/workflows/memory-editor-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused Memory Editor hardening fixes
        run: python3 .github/memory_editor_hardening_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/h3nb/jlmodplus/memory/ManagedJavaMemoryEngine.java
          git add app/src/main/java/io/github/h3nb/jlmodplus/memory/ManagedJavaValue.java
          git add app/src/main/java/io/github/h3nb/jlmodplus/memory/ManagedAutoKnownQuery.java
          git diff --cached --check
          git commit -m "Harden Memory Editor freeze and traversal lifecycle"
          git push
