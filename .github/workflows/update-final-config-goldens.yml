name: Update final config goldens

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v5.0.0
        with:
          cache-read-only: true
      - name: Regenerate references
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          rm .github/workflows/update-final-config-goldens.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update final config screenshot references"
          git push origin HEAD:ui/redesign-config
