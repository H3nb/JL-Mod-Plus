name: Apply landscape navigation refinement

on:
  push:
    branches:
      - ui/redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign
          persist-credentials: true

      - name: Keep landscape navigation rail persistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt')
          text = path.read_text()
          text = text.replace('import androidx.compose.animation.expandHorizontally\n', '', 1)
          text = text.replace('import androidx.compose.animation.shrinkHorizontally\n', '', 1)
          pattern = re.compile(r"        if \(isLandscape && !isImeVisible\) \{\n            AnimatedVisibility\(.*?\n        \}\n\n        Scaffold\(", re.S)
          replacement = "        if (isLandscape) {\n            // The side rail does not consume vertical content space, so keep it persistent.\n            LibraryNavigationRail(\n                selected = destination,\n                onSelected = { selectedDestinationIndex = it.ordinal },\n            )\n        }\n\n        Scaffold("
          text, count = pattern.subn(replacement, text, count=1)
          if count == 0 and replacement[:-1] not in text:
              raise SystemExit('Landscape navigation block changed unexpectedly')
          old_callback = '                onNavigationVisibilityChanged = { showNavigationBar = it },\n'
          new_callback = '                onNavigationVisibilityChanged = { visible ->\n                    if (!isLandscape) showNavigationBar = visible\n                },\n'
          if old_callback in text:
              text = text.replace(old_callback, new_callback, 1)
          elif new_callback not in text:
              raise SystemExit('Navigation visibility callback changed unexpectedly')
          path.write_text(text)
          PY

      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'fix(ui): keep landscape navigation rail visible'
          git push origin HEAD:ui/redesign
