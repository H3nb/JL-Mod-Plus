name: Android CI

on:
  pull_request:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          submodules: recursive

      - name: Detect persisted refinement
        id: detect
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "fix(ui): refine adaptive library chrome and icons" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore shared debug keystore
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        if: steps.detect.outputs.skip != 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        if: steps.detect.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Grant execute permission for Gradle wrapper
        if: steps.detect.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Apply library refinements
        if: steps.detect.outputs.skip != 'true'
        run: python .github/scripts/apply_library_refinements.py

      - name: Tighten refinement details
        if: steps.detect.outputs.skip != 'true'
        run: >-
          python -c "from pathlib import Path; p=Path('app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt'); s=p.read_text(); old='val headerScrollConnection = remember(\n        chromeHysteresis,\n        onFabVisibilityChanged,'; new='val headerScrollConnection = remember(\n        chromeHysteresis,\n        state.layout,\n        onFabVisibilityChanged,'; assert old in s; s=s.replace(old,new,1); assert 'normalized.findLibraryLetterboxColor()' in s; s=s.replace('normalized.findLibraryLetterboxColor()','fileSource.findLibraryLetterboxColor()',1); p.write_text(s)"

      - name: Refresh screenshot references
        if: steps.detect.outputs.skip != 'true'
        run: ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest

      - name: Validate refined library
        if: steps.detect.outputs.skip != 'true'
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Commit refined source and screenshots
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt app/src/androidTest/java/ru/playsoftware/j2meloader/applist/LibraryComposeTest.kt app/src/screenshotTestEmulatorDebug/reference
          git commit -m 'fix(ui): refine adaptive library chrome and icons'
          git push origin "HEAD:$HEAD_BRANCH"
