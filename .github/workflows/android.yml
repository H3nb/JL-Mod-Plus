name: Android CI

on:
  pull_request:
    branches:
      - alpha
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY_NAME" ]]; then
              echo 'Shared debug keystore secret is unavailable to fork pull requests; using the runner debug key.'
              exit 0
            fi
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          # Internal PRs may persist Gradle state for subsequent commits in the same PR.
          # Fork PRs stay read-only so untrusted code cannot populate repository caches.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # One-shot maintenance path. The marker is removed by the generated baseline commit;
      # this workflow change is restored by the caller immediately afterwards.
      - name: Refresh screenshot baselines once
        if: ${{ github.event_name == 'pull_request' && hashFiles('.ci/update-screenshot-baselines') != '' }}
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
          git checkout -B "${PR_HEAD_REF}" "refs/remotes/origin/${PR_HEAD_REF}"

          ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

          cat > /tmp/expected-goldens.txt <<'EOF'
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigCompactLandscapeScreenshot_Config compact landscape_d8f6b225_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigCustomResolutionScreenshot_Config custom resolution_719f0007_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigDarkPhoneScreenshot_Config dark phone_7b24fbbd_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigGamepadUnavailableScreenshot_Config gamepad unavailable large font_b00c7e4e_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigLandscapeScreenshot_Config landscape_75b9c080_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigLargeFontFormScreenshot_Config large font form_ea9d3c41_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigLightPhoneScreenshot_Config light phone_d64d007f_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigMediaEmptyScreenshot_Config media empty_05f2e3b0_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigMediumPortraitScreenshot_Config medium portrait_11f22425_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigPreferenceComponentsScreenshot_Config preference components_c84baa18_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigQuickDarkScreenshot_Config quick dark_758f3757_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigQuickScreenshot_Config quick light_dc46fefc_0.png
          app/src/screenshotTestEmulatorDebug/reference/io/github/h3nb/jlmodplus/config/ConfigScreenshotTestKt/ConfigSystemPropertiesScreenshot_Config system properties_07ad818e_0.png
          app/src/screenshotTestEmulatorDebug/reference/javax/microedition/shell/RuntimeMenuScreenshotTestKt/RuntimeLayoutSelectionScreenshot_Runtime layout selection dark landscape_2dae70f6_0.png
          EOF
          sed -i 's/^          //' /tmp/expected-goldens.txt
          git diff --name-only -- app/src/screenshotTestEmulatorDebug/reference | sort > /tmp/actual-goldens.txt
          sort /tmp/expected-goldens.txt -o /tmp/expected-goldens.txt
          if ! diff -u /tmp/expected-goldens.txt /tmp/actual-goldens.txt; then
            echo 'Refusing to commit: screenshot update changed an unexpected reference set.' >&2
            exit 1
          fi

          git rm .ci/update-screenshot-baselines
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestEmulatorDebug/reference
          git commit -m 'Update screenshot baselines'

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Lint, test, and assemble
        env:
          JLMOD_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-ci-diagnostics
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            dexlib/build/reports/lint-results-*.html
            dexlib/build/reports/lint-results-*.xml
            dexlib/build/reports/lint-results-*.sarif
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/screenshotTest/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload arm64 emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-emulator-debug-arm64-v8a
          path: app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
