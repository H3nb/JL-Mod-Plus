name: Android CI

on:
  pull_request:
    branches:
      - alpha
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v4.1.6
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests and assemble emulator debug APK
        run: ./gradlew --no-daemon :app:testEmulatorDebugUnitTest :app:assembleEmulatorDebug

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@v4.3.3
        with:
          name: JL-Mod-Plus-alpha-debug
          path: app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 7
