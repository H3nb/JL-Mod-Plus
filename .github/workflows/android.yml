name: Android CI

on:
  pull_request:
    branches:
      - alpha
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check Gradle configuration
        run: ./gradlew --no-daemon --stacktrace help

      - name: Check Gradle task graph
        run: ./gradlew --no-daemon --stacktrace build --dry-run

      - name: Run emulator debug lint
        id: app_lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug

      - name: Run dexlib lint baseline
        run: ./gradlew --no-daemon --stacktrace :dexlib:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-lint-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-emulatorDebug.*
            dexlib/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Run unit tests and assemble emulator debug APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testEmulatorDebugUnitTest
          :app:assembleEmulatorDebug
          :app:copyEmulatorDebugApk

      - name: Verify emulator debug APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/renamed_apks/emulatorDebug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No renamed emulator debug APK was produced."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            unzip -tqq "$apk"
            abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u | paste -sd, -)"
            printf 'Verified APK: %s\nPackaged ABIs: %s\n' "$apk" "${abis:-none}"
          done

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-alpha-debug
          path: app/build/outputs/renamed_apks/emulatorDebug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enforce emulator lint gate
        if: ${{ always() && steps.app_lint.outcome == 'failure' }}
        run: |
          echo "Android lint reported findings outside the committed baseline."
          exit 1
