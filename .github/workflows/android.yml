name: Android CI

on:
  pull_request:
    branches:
      - alpha
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check Gradle configuration
        run: ./gradlew --no-daemon --stacktrace help

      - name: Check Gradle task graph
        run: ./gradlew --no-daemon --stacktrace build --dry-run

      - name: Run emulator debug lint
        id: app_lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug

      - name: Run dexlib lint
        run: ./gradlew --no-daemon --stacktrace :dexlib:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-lint-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-emulatorDebug.*
            dexlib/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Run unit test task and assemble emulator debug APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testEmulatorDebugUnitTest
          :app:assembleEmulatorDebug
          :app:copyEmulatorDebugApk

      - name: Verify arm64 emulator debug APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/renamed_apks/emulatorDebug/*-arm64-v8a.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64-v8a emulator debug APK; found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          unzip -tqq "$apk"

          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u | paste -sd, -)"
          if [[ "$abis" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries; found: ${abis:-none}"
            exit 1
          fi

          required_native_libs=(
            libc++_shared.so
            libgles_utils.so
            libjavam3g.so
            libmicro3d.so
            libmmapi_common.so
            libmmapi_eas.so
            libmmapi_tsf.so
          )
          apk_entries="$(unzip -Z1 "$apk")"
          for lib in "${required_native_libs[@]}"; do
            if ! grep -Fxq "lib/arm64-v8a/$lib" <<<"$apk_entries"; then
              echo "Required native library is missing from $apk: $lib"
              exit 1
            fi
          done

          echo "Verified APK: $apk"
          echo "Packaged ABI: arm64-v8a"
          echo "Required app-owned native libraries: present"

      - name: Verify 16 KB alignment of native audio dependencies
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/renamed_apks/emulatorDebug/*-arm64-v8a.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64-v8a emulator debug APK; found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"

          ndk_version="$(sed -n 's/.*extra.set("ndkVersion", "\([^"]*\)").*/\1/p' build.gradle.kts)"
          llvm_objdump="$ANDROID_HOME/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          if [[ -z "$ndk_version" || ! -x "$llvm_objdump" ]]; then
            echo "Cannot locate llvm-objdump for configured NDK: ${ndk_version:-unknown}"
            exit 1
          fi

          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$native_dir"

          dependency_native_libs=(
            liboboe.so
            libffmpegkit.so
            libffmpegkit_abidetect.so
            libavcodec.so
            libavdevice.so
            libavfilter.so
            libavformat.so
            libavutil.so
            libswresample.so
            libswscale.so
          )

          alignment_failed=0
          for lib in "${dependency_native_libs[@]}"; do
            so="$native_dir/lib/arm64-v8a/$lib"
            if [[ ! -f "$so" ]]; then
              echo "Required native audio dependency is missing from $apk: $lib"
              alignment_failed=1
              continue
            fi

            mapfile -t load_alignments < <("$llvm_objdump" -p "$so" | awk '$1 == "LOAD" {print $NF}')
            if (( ${#load_alignments[@]} == 0 )); then
              echo "No ELF LOAD segments found: $lib"
              alignment_failed=1
              continue
            fi

            library_failed=0
            for alignment in "${load_alignments[@]}"; do
              exponent="$(sed -n 's/^2\*\*\([0-9][0-9]*\)$/\1/p' <<<"$alignment")"
              if [[ -z "$exponent" ]] || (( exponent < 14 )); then
                echo "ELF alignment below 16 KB: $lib ($alignment)"
                library_failed=1
                alignment_failed=1
              fi
            done

            if (( library_failed == 0 )); then
              echo "ELF 16 KB aligned: $lib (${load_alignments[*]})"
            fi
          done

          if (( alignment_failed != 0 )); then
            exit 1
          fi

          echo "All packaged Oboe and FFmpegKit arm64 binaries are 16 KB aligned."

      - name: Upload arm64 emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-emulator-debug-arm64-v8a
          path: app/build/outputs/renamed_apks/emulatorDebug/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enforce emulator lint gate
        if: ${{ always() && steps.app_lint.outcome == 'failure' }}
        run: |
          echo "Android lint reported findings outside the committed baseline."
          exit 1
