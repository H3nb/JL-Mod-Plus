name: Android CI

on:
  pull_request:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Refresh screenshot references
        run: ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest

      - name: Commit refreshed screenshot references
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestEmulatorDebug/reference
          if git diff --cached --quiet; then
            echo 'No screenshot reference changes to commit.'
            exit 0
          fi
          git commit -m 'test(ui): refresh library screenshot baselines'
          git push origin "HEAD:$HEAD_BRANCH"
