name: Android CI

on:
  pull_request:
    branches:
      - alpha
    types: [opened, synchronize, reopened, edited]
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate, generate screenshot candidates, or run selected Android runtime tests'
        type: choice
        required: true
        default: validate
        options:
          - validate
          - update-screenshots
          - runtime-smoke

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mode || 'validate' }}
  cancel-in-progress: true

jobs:
  build:
    # Maintenance runs must not report the same check name as PR validation.
    name: ${{ inputs.mode == 'update-screenshots' && 'screenshot-candidates' || inputs.mode == 'runtime-smoke' && 'runtime-smoke' || 'Build and tests' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore shared debug keystore
        if: github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate'
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY_NAME" ]]; then
              echo 'Shared debug keystore secret is unavailable to fork pull requests; using the runner debug key.'
              exit 0
            fi
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Internal PRs may persist Gradle state for subsequent commits in the same PR.
          # Fork PRs stay read-only; their missing secret also disables Configuration Cache persistence.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Provision NDK r30 for native-producing modes
        if: github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') != 'update-screenshots'
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null

      - name: Prepare build identity
        id: prepare
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'validate' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            validate|update-screenshots|runtime-smoke) ;;
            *) echo "Unsupported CI mode: $MODE" >&2; exit 1 ;;
          esac
          chmod +x gradlew
          echo "JLMOD_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: CI helper tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_*.py' -v

      - name: Assemble arm64 debug APK
        id: assemble
        if: github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail :app:assembleEmulatorDebug

      - name: Stage APK for early device testing
        id: stage_apk
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p ci-apk
          cp app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk ci-apk/
          {
            echo 'Assembly succeeded. Validation is still pending; this is an unverified debug APK.'
            echo "Built source commit: $JLMOD_BUILD_COMMIT"
            echo "PR head commit: ${PR_HEAD_SHA:-not a PR run}"
            echo "Final results: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'The final build check requires Build and tests, Screenshot validation, and Lint to succeed.'
            echo 'Inspect the CI, screenshot, and lint diagnostic artifacts for reports.'
          } > ci-apk/BUILD-INFO.txt

      - name: Upload APK before validation completes
        if: ${{ !cancelled() && steps.stage_apk.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-emulator-debug-arm64-v8a
          path: ci-apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Tests and instrumentation compilation
        id: validation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate') }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=(
            :app:testEmulatorDebugUnitTest
            :dexlib:testDebugUnitTest
            :app:assembleEmulatorDebugAndroidTest
          )
          ./gradlew --daemon --stacktrace --profile --continue --configuration-cache --configuration-cache-problems=fail "${tasks[@]}"

      - name: Generate screenshot candidates on manual request
        id: update_candidates
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update-screenshots' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshot-candidates
          cp -a app/src/screenshotTestEmulatorDebug/reference screenshot-candidates/before
          ./gradlew --daemon --stacktrace --profile -PjlmodNativeBuild=false :app:updateEmulatorDebugScreenshotTest
          cp -a app/src/screenshotTestEmulatorDebug/reference screenshot-candidates/after
          # Include newly generated files as well as changed/deleted references.
          git add --intent-to-add -- app/src/screenshotTestEmulatorDebug/reference
          git diff --binary HEAD -- app/src/screenshotTestEmulatorDebug/reference > screenshot-candidates/baselines.patch
          git rev-parse HEAD > screenshot-candidates/source-commit.txt
          git diff --stat HEAD -- app/src/screenshotTestEmulatorDebug/reference > screenshot-candidates/changes.txt

      - name: Upload manually generated screenshot candidates for review
        if: ${{ !cancelled() && steps.update_candidates.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-candidates
          path: screenshot-candidates/
          if-no-files-found: error
          retention-days: 7

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode == 'runtime-smoke' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run selected Android runtime contracts
        id: runtime
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'runtime-smoke' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c 'trap "adb logcat -d -v threadtime > runtime-logcat.txt 2>&1 || true" EXIT;
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.graphics.AmbientColorSamplerTest,javax.microedition.media.MediaBoundaryRuntimeTest,io.github.h3nb.jlmodplus.librarydb.LibraryDatabaseAndroidTest,io.github.h3nb.jlmodplus.crashes.CrashReportsComposeTest,io.github.h3nb.jlmodplus.config.PresetAuthorityIpcRuntimeTest#staleRuntimeIdentityCannotModifyReplacementApp,io.github.h3nb.jlmodplus.crashes.CrashRuntimeIsolationTest#repeatedRemoteSessionCrashesKeepMainProcessAndPersistExactReports,io.github.h3nb.jlmodplus.crashes.CrashRuntimeIsolationTest#launchingDifferentMidletReplacesBackgroundRuntimeWithoutCrashOrGuestTeardown,io.github.h3nb.jlmodplus.crashes.CrashRuntimeIsolationTest#hungUserExitReturnsToLibraryAndTerminatesWithoutCrashReport,io.github.h3nb.jlmodplus.crashes.ProcessExitRuntimeTest#abruptRemoteSigkillDoesNotBecomeAFatalReport,io.github.h3nb.jlmodplus.crashes.ProcessExitRuntimeTest#newerNonfatalEvidenceStaysQueryableWithoutHidingFatalNotice,io.github.h3nb.jlmodplus.runtime.EmulatorShutdownOrderTest,io.github.h3nb.jlmodplus.crashes.RuntimeShutdownFixtureTest#cleanupWithoutCommittedOwnershipDoesNotTouchState,io.github.h3nb.jlmodplus.crashes.RuntimeShutdownFixtureTest#earlySetupCleanupRestoresPreferenceAndPreservesUnrelatedRuntime,io.github.h3nb.jlmodplus.crashes.RuntimeShutdownFixtureTest#failedPreferenceRestorationPreservesOwnedFixtureForRetry
            :app:connectedEmulatorDebugAndroidTest'

      - name: Record validation results
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'validate' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
          UPDATE_RESULT: ${{ steps.update_candidates.outcome }}
          RUNTIME_RESULT: ${{ steps.runtime.outcome }}
        run: |
          mkdir -p ci-artifacts
          {
            echo "Mode: $MODE"
            echo "Built source commit: ${JLMOD_BUILD_COMMIT:-unavailable}"
            echo "PR head commit: ${PR_HEAD_SHA:-not a PR run}"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "APK assembly: $ASSEMBLE_RESULT"
            echo "Tests and instrumentation compilation: $VALIDATION_RESULT"
            echo "Manual screenshot generation: $UPDATE_RESULT"
            echo "Selected runtime tests: $RUNTIME_RESULT"
            echo 'Screenshot validation and lint run in separate jobs. The final build check requires all validation jobs to succeed.'
            echo 'An APK artifact is not evidence that validation passed. Inspect the task reports.'
          } | tee ci-artifacts/validation.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-ci-diagnostics
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            dexlib/build/reports/tests/**
            dexlib/build/test-results/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build/reports/problems/**
            build/reports/profile/**
            ci-artifacts/validation.txt
            runtime-logcat.txt
          if-no-files-found: warn
          retention-days: 7


  memory-ipc-runtime:
    name: Memory IPC runtime
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'runtime-smoke' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run structured completion Binder contract
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.memory.MemoryIpcRuntimeTest#missingRuntimeCompletionCarriesStructuredReason
            :app:connectedEmulatorDebugAndroidTest

  screenshots:
    name: Screenshot validation
    if: inputs.mode != 'update-screenshots' && inputs.mode != 'runtime-smoke'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate screenshot references
        id: screenshots
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail -PjlmodNativeBuild=false :app:validateEmulatorDebugScreenshotTest

      - name: Package existing screenshot renders after comparison failure
        id: candidates
        if: ${{ !cancelled() && steps.screenshots.outcome == 'failure' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-screenshot-candidates.py

      - name: Upload screenshot candidates for review
        if: ${{ !cancelled() && steps.candidates.outcome == 'success' && steps.candidates.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-candidates
          path: screenshot-candidates/
          if-no-files-found: error
          retention-days: 7

      - name: Upload screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-diagnostics
          path: |
            app/build/reports/screenshotTest/**
            app/build/test-results/validateEmulatorDebugScreenshotTest/**
            build/reports/problems/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    if: inputs.mode != 'update-screenshots' && inputs.mode != 'runtime-smoke'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Lint app and dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile --continue --configuration-cache --configuration-cache-problems=fail -PjlmodNativeBuild=false :app:lintEmulatorDebug

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-lint-diagnostics
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            dexlib/build/reports/lint-results-*.html
            dexlib/build/reports/lint-results-*.xml
            dexlib/build/reports/lint-results-*.sarif
            build/reports/problems/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7





  # Temporary PR #152 qualification jobs; remove before platform freeze.
  native-portability:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/jlmod-gradle-portability

    steps:
      - name: Check out root A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          path: root-a

      - name: Check out root B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          path: root-b

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle without remote state cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Build arm64 dependencies in root A
        shell: bash
        working-directory: root-a
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --build-cache \
            :app:buildNativeAudioarm64v8a | tee ../root-a-native.log

          grep -Fq '> Task :app:buildNativeAudioarm64v8a' ../root-a-native.log
          if grep -Fq '> Task :app:buildNativeAudioarm64v8a FROM-CACHE' ../root-a-native.log; then
            echo 'Root A unexpectedly restored the native task from cache.' >&2
            exit 1
          fi
          [[ $(grep -Fc 'PASS prepared pinned native audio sources' ../root-a-native.log) -eq 1 ]]
          (
            cd app/build/audio-deps/install-arm64-v8a/lib
            sha256sum *.so | sort
          ) > ../root-a-arm64.sha256

      - name: Restore arm64 dependencies in root B
        shell: bash
        working-directory: root-b
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf app/build/audio-sources app/build/audio-deps app/build/audio-work
          ./gradlew --no-daemon --stacktrace --console=plain --build-cache \
            :app:buildNativeAudioarm64v8a | tee ../root-b-native.log

          grep -Fq '> Task :app:buildNativeAudioarm64v8a FROM-CACHE' ../root-b-native.log
          if grep -Fq 'PASS prepared pinned native audio sources' ../root-b-native.log; then
            echo 'Native source preparation ran despite a Build Cache hit.' >&2
            exit 1
          fi
          if [[ -e app/build/audio-sources ]]; then
            echo 'Source extraction exists after a cache-only restore in root B.' >&2
            exit 1
          fi
          (
            cd app/build/audio-deps/install-arm64-v8a/lib
            sha256sum *.so | sort
          ) > ../root-b-arm64.sha256
          diff -u ../root-a-arm64.sha256 ../root-b-arm64.sha256

      - name: Package debug APK from relocated output
        shell: bash
        working-directory: root-b
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain --build-cache \
            :app:assembleEmulatorDebug | tee ../root-b-package.log
          if grep -Fq 'PASS prepared pinned native audio sources' ../root-b-package.log; then
            echo 'APK packaging unexpectedly prepared native sources.' >&2
            exit 1
          fi
          test -f app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk

  release-native:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/jlmod-gradle-release-native

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle without remote state cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Create temporary release signing material
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore qualification-release.jks \
            -storepass android \
            -keypass android \
            -alias qualification \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=JL-Mod Plus Final Qualification,O=CI,C=US'
          cat > keystore.properties <<'EOF'
          keyAlias=qualification
          keyPassword=android
          storeFile=qualification-release.jks
          storePassword=android
          EOF

      - name: Build all native dependency ABIs from cold state
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf app/build/audio-sources app/build/audio-deps app/build/audio-work
          ./gradlew --no-daemon --stacktrace --console=plain --profile --no-build-cache \
            :app:buildNativeAudioarm64v8a \
            :app:buildNativeAudioarmeabiv7a \
            :app:buildNativeAudiox86 \
            :app:buildNativeAudiox8664 | tee native-all-abi.log

          [[ $(grep -Fc 'PASS prepared pinned native audio sources' native-all-abi.log) -eq 1 ]]
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            safe="${abi//[-_]/}"
            grep -Fq "> Task :app:buildNativeAudio${safe}" native-all-abi.log
            grep -Fq "PASS build ${abi}" native-all-abi.log
            test "$(find "app/build/audio-deps/install-${abi}/lib" -maxdepth 1 -type f -name '*.so' | wc -l)" -eq 4
          done

      - name: Build minified all-ABI release
        shell: bash
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain --profile --no-build-cache \
            --configuration-cache --configuration-cache-problems=fail \
            :app:assembleEmulatorRelease | tee release-build.log

          if grep -Fq 'PASS prepared pinned native audio sources' release-build.log; then
            echo 'Release packaging repeated native source preparation.' >&2
            exit 1
          fi

      - name: Verify APK matrix, native provenance, and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          output='app/build/outputs/apk/emulator/release'
          metadata="$output/output-metadata.json"
          test -f "$metadata"
          test -f app/build/audio-sources/source-context.json
          jq -e '.ffmpegVersion == "8.1.3" and .openCoreVersion == "0.1.6"' \
            app/build/audio-sources/source-context.json >/dev/null

          expected_abis=(arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${expected_abis[@]}"; do
            count="$(jq -r --arg abi "$abi" \
              '[.elements[] | select(any(.filters[]?; .filterType == "ABI" and .value == $abi))] | length' \
              "$metadata")"
            [[ "$count" == 1 ]] || { echo "Expected one $abi APK, found $count" >&2; exit 1; }
            stamp="app/build/audio-deps/install-$abi/recipe.txt"
            test -f "$stamp"
            grep -Fq ":30.0.16248370:23:$abi:" "$stamp"
            test -f "app/build/audio-deps/install-$abi/checksums.json"
          done

          universal_count="$(jq -r '[.elements[] | select(((.filters // []) | length) == 0)] | length' "$metadata")"
          [[ "$universal_count" == 1 ]] || { echo "Expected one universal APK, found $universal_count" >&2; exit 1; }
          universal="$(jq -r '.elements[] | select(((.filters // []) | length) == 0) | .outputFile' "$metadata")"
          apk="$output/$universal"
          test -f "$apk"

          for library in avformat avcodec avutil swresample; do
            unzip -Z1 "$apk" | grep -Fxq "lib/armeabi-v7a/lib${library}_neon.so"
            for abi in arm64-v8a x86 x86_64; do
              unzip -Z1 "$apk" | grep -Fxq "lib/$abi/lib${library}.so"
            done
            if unzip -Z1 "$apk" | grep -Fxq "lib/armeabi-v7a/lib${library}.so"; then
              echo "Unexpected unsuffixed ARMv7 FFmpeg library: lib${library}.so" >&2
              exit 1
            fi
          done

          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          zipalign="$ANDROID_HOME/build-tools/$build_tools/zipalign"
          test -x "$zipalign"
          "$zipalign" -c -P 16 -v 4 "$apk"

          rm -rf extracted-apk
          mkdir extracted-apk
          unzip -q "$apk" 'lib/*/*.so' -d extracted-apk
          failures=0
          while IFS= read -r -d '' so; do
            while read -r align; do
              if (( align < 0x4000 )); then
                echo "ELF LOAD alignment below 16 KiB: $so ($align)" >&2
                failures=1
              fi
            done < <("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find extracted-apk/lib/arm64-v8a extracted-apk/lib/x86_64 -type f -name '*.so' -print0)
          (( failures == 0 ))

          x86_apk="$(jq -r '
            .elements[]
            | select(any(.filters[]?; .filterType == "ABI" and .value == "x86_64"))
            | .outputFile
          ' "$metadata" | head -n1)"
          test -n "$x86_apk"
          printf '%s\n' "$output/$x86_apk" > final-r8-apk.txt
          test -f app/build/outputs/mapping/emulatorRelease/mapping.txt
          git diff --exit-code -- app/schemas

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify retained R8 workaround at runtime
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(cat final-r8-apk.txt)"
            adb root || true
            adb wait-for-device
            adb install -r "$apk"
            adb logcat -c
            adb shell am force-stop io.github.h3nb.jlmodplus
            adb shell am start -W \
              -n io.github.h3nb.jlmodplus/io.github.h3nb.jlmodplus.memory.MemoryEditorActivity \
              --el ru.playsoftware.j2meloader.memory.extra.RUNTIME_TOKEN 1 \
              | tee final-r8-memory-start.txt
            sleep 8
            adb logcat -d -v threadtime > final-r8-memory-logcat.txt
            adb shell dumpsys activity exit-info io.github.h3nb.jlmodplus > final-r8-memory-exit-info.txt || true
            if grep -Eiq 'VerifyError|verification failed|rejecting opcode|invalid.*register|wide.*register|FATAL EXCEPTION.*memory_engine' final-r8-memory-logcat.txt; then
              echo 'Retained R8 workaround did not protect the minified Memory Editor.' >&2
              grep -Ein 'VerifyError|verification failed|rejecting opcode|invalid.*register|wide.*register|FATAL EXCEPTION' final-r8-memory-logcat.txt >&2 || true
              exit 1
            fi
            if grep -Eiq 'REASON_CRASH|reason=crash|crash native|crash java' final-r8-memory-exit-info.txt; then
              echo 'Minified Memory Editor recorded a crash exit.' >&2
              cat final-r8-memory-exit-info.txt >&2
              exit 1
            fi
            echo 'Retained Memory Editor R8 workaround passed runtime qualification.'

      - name: Upload release/native diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-release-native-qualification
          path: |
            native-all-abi.log
            release-build.log
            final-r8-memory-start.txt
            final-r8-memory-logcat.txt
            final-r8-memory-exit-info.txt
            build/reports/profile/**
            app/build/outputs/mapping/emulatorRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 7

  api23-audio:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 23 native audio smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            --configuration-cache --configuration-cache-problems=fail
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.media.MediaBoundaryRuntimeTest#generatedSynthesisSampledAndVideoShareOutputAndSeekDrainsVideo
            :app:connectedEmulatorDebugAndroidTest

  native-runtime:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native audio and stable M3G runtime subset
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            --configuration-cache --configuration-cache-problems=fail
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.media.MediaBoundaryRuntimeTest,javax.microedition.media.SampledAudioRuntimeTest,javax.microedition.media.LegacySmafConversionTest,io.github.h3nb.jlmodplus.mmapi.synth.SonivoxRuntimeTest,io.github.h3nb.jlmodplus.mmapi.synth.UnifiedAudioRuntimeTest,javax.microedition.m3g.M3GRuntimeTest#cameraAndLightTransformsCrossJniWithJsr184Semantics,javax.microedition.m3g.M3GRuntimeTest#objectReferenceArraysAndDuplicateRoundTripThroughJni,javax.microedition.m3g.M3GRuntimeTest#rejectsInvalidBindTargetHintsAtPublicApiBoundary,javax.microedition.m3g.M3GRuntimeTest#rejectsImmutableAndUnsupportedImage2DTargetsAtPublicApiBoundary
            :app:connectedEmulatorDebugAndroidTest

  ci:
    # Preserve the required PR check name; maintenance cannot satisfy it.
    name: ${{ (inputs.mode == 'update-screenshots' || inputs.mode == 'runtime-smoke') && 'maintenance-status' || 'build' }}
    needs: [build, screenshots, lint]
    if: ${{ always() && inputs.mode != 'update-screenshots' && inputs.mode != 'runtime-smoke' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both validation jobs to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCREENSHOT_RESULT: ${{ needs.screenshots.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          echo "Build and tests: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshot validation: $SCREENSHOT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint: $LINT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$BUILD_RESULT" == 'success' && "$SCREENSHOT_RESULT" == 'success' && "$LINT_RESULT" == 'success' ]]
