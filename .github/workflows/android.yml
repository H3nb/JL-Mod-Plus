name: Apply landscape navigation refinement

on:
  push:
    branches:
      - ui/redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign
          persist-credentials: true

      - name: Keep landscape navigation rail persistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt')
          text = path.read_text()

          text = text.replace('import androidx.compose.animation.expandHorizontally\n', '', 1)
          text = text.replace('import androidx.compose.animation.shrinkHorizontally\n', '', 1)

          old = '''        if (isLandscape && !isImeVisible) {
            AnimatedVisibility(
                visible = showNavigationBar,
                enter = fadeIn(
                    animationSpec = tween(
                        durationMillis = LIBRARY_CHROME_ANIMATION_MILLIS,
                        easing = FastOutSlowInEasing,
                    ),
                ) + expandHorizontally(
                    animationSpec = tween(
                        durationMillis = LIBRARY_CHROME_ANIMATION_MILLIS,
                        easing = FastOutSlowInEasing,
                    ),
                    expandFrom = Alignment.Start,
                ),
                exit = fadeOut(
                    animationSpec = tween(
                        durationMillis = LIBRARY_CHROME_ANIMATION_MILLIS,
                        easing = FastOutSlowInEasing,
                    ),
                ) + shrinkHorizontally(
                    animationSpec = tween(
                        durationMillis = LIBRARY_CHROME_ANIMATION_MILLIS,
                        easing = FastOutSlowInEasing,
                    ),
                    shrinkTowards = Alignment.Start,
                ),
            ) {
                LibraryNavigationRail(
                    selected = destination,
                    onSelected = { selectedDestinationIndex = it.ordinal },
                )
            }
        }
'''
          new = '''        if (isLandscape) {
            // The side rail does not consume vertical content space, so keep it persistent.
            LibraryNavigationRail(
                selected = destination,
                onSelected = { selectedDestinationIndex = it.ordinal },
            )
        }
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Landscape navigation block changed unexpectedly')

          old_callback = '                onNavigationVisibilityChanged = { showNavigationBar = it },\n'
          new_callback = '''                onNavigationVisibilityChanged = { visible ->
                    if (!isLandscape) showNavigationBar = visible
                },
'''
          if old_callback in text:
              text = text.replace(old_callback, new_callback, 1)
          elif new_callback not in text:
              raise SystemExit('Navigation visibility callback changed unexpectedly')

          path.write_text(text)
          PY

      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'fix(ui): keep landscape navigation rail visible'
          git push origin HEAD:ui/redesign
