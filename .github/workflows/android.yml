name: Android CI

on:
  pull_request:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Apply final Library follow-up
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/scripts/library_pr2_followup_v2.py.gz.b64 | gzip -dc > /tmp/library_pr2_final_followup.py
          python /tmp/library_pr2_final_followup.py
          git checkout 37796e0f22cee50c2380eb5bfd0feeac9a926ada -- .github/workflows/android.yml
          rm .github/scripts/library_pr2_final_followup.py.gz.b64
          rm .github/scripts/library_pr2_followup_v2.py.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: finish Library startup correction'
          git push origin HEAD:agent/library-pr2-features
