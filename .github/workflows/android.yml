      - name: Refresh screenshot references
        run: ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest

      - name: Validate refined library
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Commit refinements and restore CI workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/android.yml > .github/workflows/android.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android.yml app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt app/src/androidTest/java/ru/playsoftware/j2meloader/applist/LibraryComposeTest.kt app/src/screenshotTestEmulatorDebug/reference
          git commit -m 'fix(ui): refine adaptive library chrome and icons'
          git push origin "HEAD:$HEAD_BRANCH"
