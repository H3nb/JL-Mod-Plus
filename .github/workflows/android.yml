name: Android CI

on:
  pull_request:
    branches:
      - alpha
  push:
    branches:
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check Gradle configuration
        run: ./gradlew --no-daemon --stacktrace help

      - name: Check Gradle task graph
        run: ./gradlew --no-daemon --stacktrace build --dry-run

      - name: Capture emulator debug dependency graph
        shell: bash
        run: |
          mkdir -p build/ci-reports
          ./gradlew --no-daemon --console=plain \
            :app:dependencies \
            --configuration emulatorDebugRuntimeClasspath \
            > build/ci-reports/emulator-debug-runtime-classpath.txt

      - name: Run emulator debug lint
        id: app_lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug

      - name: Run dexlib lint
        run: ./gradlew --no-daemon --stacktrace :dexlib:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-lint-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-emulatorDebug.*
            dexlib/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Run unit test task and assemble emulator debug APK
        id: assemble
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          ./gradlew --no-daemon --stacktrace \
            :app:testEmulatorDebugUnitTest \
            :app:assembleEmulatorDebug \
            :app:copyEmulatorDebugApk \
            2>&1 | tee build/ci-logs/assemble-emulator-debug.log

      - name: Summarize validation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/ci-reports
          summary="build/ci-reports/validation-summary.md"
          assemble_log="build/ci-logs/assemble-emulator-debug.log"
          native_warnings="build/ci-reports/native-warnings.txt"
          : > "$native_warnings"

          shopt -s nullglob
          test_xml=(app/build/test-results/testEmulatorDebugUnitTest/*.xml)
          if (( ${#test_xml[@]} > 0 )); then
            sum_xml_attr() {
              local attr="$1"
              grep -hoE "${attr}=\"[0-9]+\"" "${test_xml[@]}" \
                | sed -E 's/.*="([0-9]+)"/\1/' \
                | awk '{ total += $1 } END { print total + 0 }'
            }
            tests="$(sum_xml_attr tests)"
            failures="$(sum_xml_attr failures)"
            errors="$(sum_xml_attr errors)"
            skipped="$(sum_xml_attr skipped)"
            test_status="${tests} executed; ${failures} failures; ${errors} errors; ${skipped} skipped"
          elif [[ -f "$assemble_log" ]] && grep -Fq ':app:testEmulatorDebugUnitTest NO-SOURCE' "$assemble_log"; then
            test_status="NO-SOURCE"
          else
            test_status="no XML results detected"
          fi

          if [[ -f "$assemble_log" ]]; then
            grep -nE 'app/src/main/cpp/.*warning:' "$assemble_log" > "$native_warnings" || true
          fi
          native_warning_count="$(wc -l < "$native_warnings" | tr -d ' ')"
          pointer_to_integer_count="$(grep -Ec '\[-W(pointer-to-int-cast|void-pointer-to-int-cast)\]' "$native_warnings" || true)"
          integer_to_pointer_count="$(grep -Ec '\[-W(int-to-pointer-cast|int-to-void-pointer-cast)\]' "$native_warnings" || true)"
          pointer_integer_compare_count="$(grep -Ec '\[-Wpointer-integer-compare\]' "$native_warnings" || true)"
          pointer_type_count="$(grep -Ec '\[-Wincompatible-pointer-types\]' "$native_warnings" || true)"
          shift_count="$(grep -Ec '\[-Wshift-negative-value\]' "$native_warnings" || true)"

          dependency_status="missing"
          if [[ -s build/ci-reports/emulator-debug-runtime-classpath.txt ]]; then
            dependency_status="captured"
          fi

          cat > "$summary" <<EOF
          ## Android CI validation evidence

          - Emulator debug runtime dependency graph: ${dependency_status}
          - Unit tests: ${test_status}
          - Native compiler warnings captured from app/src/main/cpp: ${native_warning_count}
          - Selected native warning categories by Clang diagnostic flag:
            - pointer to integer: ${pointer_to_integer_count}
            - integer to pointer: ${integer_to_pointer_count}
            - pointer/integer comparison: ${pointer_integer_compare_count}
            - incompatible pointer type: ${pointer_type_count}
            - negative signed shift: ${shift_count}
          EOF

          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-ci-evidence-${{ github.run_number }}
          path: |
            build/ci-reports/
            app/build/test-results/testEmulatorDebugUnitTest/
            app/build/reports/tests/testEmulatorDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload assemble log on failure
        if: ${{ failure() && steps.assemble.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-assemble-log-${{ github.run_number }}
          path: build/ci-logs/assemble-emulator-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify arm64 emulator debug APK and 16 KB alignment
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/renamed_apks/emulatorDebug/*-arm64-v8a.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64-v8a emulator debug APK; found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          unzip -tqq "$apk"

          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u | paste -sd, -)"
          if [[ "$abis" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries; found: ${abis:-none}"
            exit 1
          fi

          required_native_libs=(
            libc++_shared.so
            libgles_utils.so
            libjavam3g.so
            libmicro3d.so
            libmmapi_common.so
            libmmapi_eas.so
            libmmapi_tsf.so
            liboboe.so
            libffmpegkit.so
            libffmpegkit_abidetect.so
            libavcodec.so
            libavdevice.so
            libavfilter.so
            libavformat.so
            libavutil.so
            libswresample.so
            libswscale.so
          )
          apk_entries="$(unzip -Z1 "$apk")"
          for lib in "${required_native_libs[@]}"; do
            if ! grep -Fxq "lib/arm64-v8a/$lib" <<<"$apk_entries"; then
              echo "Required native library is missing from $apk: $lib"
              exit 1
            fi
          done

          ndk_version="$(sed -n 's/.*extra.set("ndkVersion", "\([^"]*\)").*/\1/p' build.gradle.kts)"
          llvm_objdump="$ANDROID_HOME/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          if [[ -z "$ndk_version" || ! -x "$llvm_objdump" ]]; then
            echo "Cannot locate llvm-objdump for configured NDK: ${ndk_version:-unknown}"
            exit 1
          fi

          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$native_dir"
          mapfile -t packaged_libs < <(find "$native_dir/lib/arm64-v8a" -type f -name '*.so' | sort)
          if (( ${#packaged_libs[@]} == 0 )); then
            echo "No packaged native libraries found in $apk"
            exit 1
          fi

          alignment_failed=0
          for so in "${packaged_libs[@]}"; do
            mapfile -t load_alignments < <("$llvm_objdump" -p "$so" | awk '$1 == "LOAD" {print $NF}')
            if (( ${#load_alignments[@]} == 0 )); then
              echo "No ELF LOAD segments found: ${so##*/}"
              alignment_failed=1
              continue
            fi

            library_failed=0
            for alignment in "${load_alignments[@]}"; do
              exponent="$(sed -n 's/^2\*\*\([0-9][0-9]*\)$/\1/p' <<<"$alignment")"
              if [[ -z "$exponent" ]] || (( exponent < 14 )); then
                echo "ELF alignment below 16 KB: ${so##*/} ($alignment)"
                library_failed=1
                alignment_failed=1
              fi
            done

            if (( library_failed == 0 )); then
              echo "ELF 16 KB aligned: ${so##*/} (${load_alignments[*]})"
            fi
          done

          if (( alignment_failed != 0 )); then
            exit 1
          fi

          mapfile -t zipalign_bins < <(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign | sort -V)
          if (( ${#zipalign_bins[@]} == 0 )); then
            echo "Cannot locate zipalign in Android SDK Build Tools."
            exit 1
          fi
          zipalign_bin="${zipalign_bins[$((${#zipalign_bins[@]} - 1))]}"
          "$zipalign_bin" -c -P 16 4 "$apk"

          echo "Verified APK: $apk"
          echo "Packaged ABI: arm64-v8a"
          echo "Required app/native dependency libraries: present"
          echo "Packaged native libraries: ${#packaged_libs[@]}"
          echo "All ELF LOAD segments and APK native entries are 16 KB aligned"

      - name: Upload arm64 emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: JL-Mod-Plus-emulator-debug-arm64-v8a
          path: app/build/outputs/renamed_apks/emulatorDebug/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enforce emulator lint gate
        if: ${{ always() && steps.app_lint.outcome == 'failure' }}
        run: |
          echo "Android lint reported findings outside the committed baseline."
          exit 1
