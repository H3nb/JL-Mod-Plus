name: Android CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('PR {0} | {1} | {2} | test {3} | request {4}', inputs.pr_number || '-', inputs.mode, inputs.expected_sha || inputs.source_sha || github.sha, inputs.selector_key || '-', inputs.request_id || format('ui-{0}', github.run_id)) || format('PR {0} | validate | {1} | automatic', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request:
    branches:
      - alpha
      - stable
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate PRs, check release APKs, generate screenshots, or run runtime tests'
        type: choice
        required: true
        default: validate
        options:
          - validate
          - unit
          - instrumentation
          - screenshots
          - host-native
          - update-screenshots
          - runtime-smoke
          - release-check
      pr_number:
        description: 'Open same-repository PR (required with source_sha and for candidates)'
        type: string
        default: ''
      test_selector:
        description: 'One unit class/method or instrumentation Class#method (focused modes only)'
        type: string
        default: ''
      selector_key:
        description: 'Optional SHA256 selector key (first 16 hex); controller sets this for deduplication'
        type: string
        default: ''
      expected_sha:
        description: 'Exact expected source revision; stale requests fail before Android setup'
        type: string
        default: ''
      source_sha:
        description: 'Exact same-repo PR HEAD to checkout with the selected workflow definition'
        type: string
        default: ''
      request_id:
        description: 'Traceable request ID; defaults to ui-RUN_ID'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Only automatic validation cancels older revisions. Manual investigations are independent.
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'validate' }}-${{ github.event_name == 'workflow_dispatch' && (inputs.request_id || github.run_id) || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Verify requested source
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pr_head: ${{ steps.source.outputs.pr_head }}
      pr_base: ${{ steps.source.outputs.pr_base }}
      pr_number: ${{ steps.source.outputs.pr_number }}
      request_id: ${{ steps.source.outputs.request_id }}
    steps:
      # Inline code is part of the workflow definition. No PR code or checkout in this job.
      - name: Resolve and verify exact revision before setup
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SELECTOR_KEY: ${{ inputs.selector_key }}
          TEST_SELECTOR: ${{ inputs.test_selector }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          REQUEST_ID: ${{ inputs.request_id || format('ui-{0}', github.run_id) }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, re, subprocess
          env = os.environ
          source, expected = env['SOURCE_SHA'], env['EXPECTED_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source) or (expected and source != expected):
              raise SystemExit('Stale request: expected SHA differs from selected source')
          if not re.fullmatch('[A-Za-z0-9_-]{1,80}', env['REQUEST_ID']):
              raise SystemExit('Invalid request ID')
          key = hashlib.sha256(env['TEST_SELECTOR'].encode()).hexdigest()[:16] if env['TEST_SELECTOR'] else '-'
          if env['SELECTOR_KEY'] and env['SELECTOR_KEY'] != key:
              raise SystemExit('Selector key does not match requested test')
          number = env['PR_NUMBER']
          head, base = env['EVENT_PR_HEAD'], env['EVENT_PR_BASE']
          if env['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and number:
              if not re.fullmatch('[1-9][0-9]{0,9}', number):
                  raise SystemExit('Invalid PR number')
              pr = json.loads(subprocess.check_output([
                  'gh', 'api', '-H', 'X-GitHub-Api-Version: 2026-03-10',
                  'repos/' + env['GITHUB_REPOSITORY'] + '/pulls/' + number], text=True))
              if pr['state'] != 'open' or pr['head']['repo']['full_name'] != env['GITHUB_REPOSITORY']:
                  raise SystemExit('Dispatch requires an open same-repository PR')
              head, base = pr['head']['sha'], pr['base']['sha']
              if source != head:
                  raise SystemExit('Stale request: PR HEAD moved; submit a new request for its current SHA')
          elif env['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and source != env['GITHUB_SHA']:
              raise SystemExit('An explicit source revision requires a PR number')
          values = dict(sha=source, pr_head=head, pr_base=base, pr_number=number, request_id=env['REQUEST_ID'])
          with open(env['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  output.write(key + '=' + value + '\n')
          print(json.dumps(dict(schema_version=1, workflow_revision=env['GITHUB_SHA'], **values), indent=2))
          PYTHON

  helpers:
    needs: source
    uses: ./.github/workflows/workflow-checks.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [source, helpers]
    env:
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      PR_HEAD_SHA: ${{ needs.source.outputs.pr_head }}
      PR_BASE_SHA: ${{ needs.source.outputs.pr_base }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      CI_REQUEST_ID: ${{ needs.source.outputs.request_id }}
      CI_PROFILE: ${{ inputs.mode || 'validate' }}
      CI_SELECTOR: ${{ inputs.test_selector }}
    permissions:
      contents: read
      pull-requests: read
    if: ${{ !contains(fromJSON('["release-check","screenshots","host-native"]'), inputs.mode) }}
    # Maintenance runs must not report the same check name as PR validation.
    name: ${{ inputs.mode == 'update-screenshots' && 'screenshot-candidates' || inputs.mode == 'runtime-smoke' && 'runtime-smoke' || inputs.mode == 'unit' && 'focused-unit' || inputs.mode == 'instrumentation' && 'focused-instrumentation' || 'Build and tests' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Restore shared debug keystore
        if: github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate'
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY_NAME" ]]; then
              echo 'Shared debug keystore secret is unavailable to fork pull requests; using the runner debug key.'
              exit 0
            fi
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Internal PRs may persist supported Gradle User Home / Build Cache state.
          # Fork PRs stay read-only; Configuration Cache persistence needs the optional encryption secret.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Ubuntu 26.04 has cmdline-tools 20.0 preinstalled; avoid fetching 22.0.
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Provision NDK r30 for native-producing modes
        if: ${{ !contains(fromJSON('["unit","update-screenshots"]'), inputs.mode) }}
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null

      - name: Prepare build identity
        id: prepare
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'validate' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            validate|unit|instrumentation|update-screenshots|runtime-smoke) ;;
            *) echo "Unsupported CI mode: $MODE" >&2; exit 1 ;;
          esac
          chmod +x gradlew
          echo "JLMOD_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run focused JVM tests
        id: focused_unit
        if: inputs.mode == 'unit'
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        run: python3 -B scripts/ci-profile.py unit --test "$TEST_SELECTOR"

      - name: Assemble arm64 debug APK
        id: assemble
        if: github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail :app:assembleEmulatorDebug

      - name: Stage APK for early device testing
        id: stage_apk
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          mkdir -p ci-apk
          cp app/build/outputs/apk/emulator/debug/app-emulator-arm64-v8a-debug.apk ci-apk/
          {
            echo 'Assembly succeeded. Validation is still pending; this is an unverified debug APK.'
            echo "Built source commit: $JLMOD_BUILD_COMMIT"
            echo "PR head commit: ${PR_HEAD_SHA:-not a PR run}"
            echo "Final results: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'The final build check requires Build and tests, Screenshot validation, and Lint to succeed.'
            echo 'Inspect the CI, screenshot, and lint diagnostic artifacts for reports.'
          } > ci-apk/BUILD-INFO.txt

      - name: Upload APK before validation completes
        if: ${{ !cancelled() && steps.stage_apk.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-emulator-debug-arm64-v8a
          path: ci-apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Tests and instrumentation compilation
        id: validation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.mode || 'validate') == 'validate') }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=(:app:testEmulatorDebugUnitTest)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            rm -rf app/build/test-results/testEmulatorDebugUnitTest dexlib/build/test-results/testDebugUnitTest
            tasks+=(--rerun)
          fi
          tasks+=(:dexlib:testDebugUnitTest)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tasks+=(--rerun); fi
          tasks+=(:app:assembleEmulatorDebugAndroidTest)
          ./gradlew --daemon --stacktrace --profile --continue --configuration-cache --configuration-cache-problems=fail "${tasks[@]}"

      - name: Generate screenshot candidates on manual request
        id: update_candidates
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update-screenshots' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python3 scripts/ci-screenshot-candidates.py --prepare-update "$PR_NUMBER"
          ./gradlew --daemon --stacktrace --profile -PjlmodNativeBuild=false :app:updateEmulatorDebugScreenshotTestDefaultTestSuite
          python3 scripts/ci-screenshot-candidates.py --updated

      - name: Upload manually generated screenshot candidates for review
        if: ${{ !cancelled() && steps.update_candidates.outcome == 'success' && steps.update_candidates.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-candidates
          path: screenshot-candidates/
          if-no-files-found: error
          retention-days: 7

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'runtime-smoke' || inputs.mode == 'instrumentation') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run selected Android runtime contracts
        id: runtime
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'runtime-smoke' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/runtime-smoke.sh

      - name: Run focused instrumentation on API 35
        id: focused_instrumentation
        if: ${{ success() && inputs.mode == 'instrumentation' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 -B scripts/ci-profile.py instrumentation --test "$TEST_SELECTOR"

      - name: Record validation results
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'validate' }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
          UPDATE_RESULT: ${{ steps.update_candidates.outcome }}
          RUNTIME_RESULT: ${{ steps.runtime.outcome }}
          FOCUSED_UNIT_RESULT: ${{ steps.focused_unit.outcome }}
          FOCUSED_INSTRUMENTATION_RESULT: ${{ steps.focused_instrumentation.outcome }}
        run: |
          mkdir -p ci-artifacts
          {
            echo "Mode: $MODE"
            echo "Built source commit: ${JLMOD_BUILD_COMMIT:-unavailable}"
            echo "PR head commit: ${PR_HEAD_SHA:-not a PR run}"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "APK assembly: $ASSEMBLE_RESULT"
            echo "Tests and instrumentation compilation: $VALIDATION_RESULT"
            echo "Manual screenshot generation: $UPDATE_RESULT"
            echo "Selected runtime tests: $RUNTIME_RESULT"
            echo "Focused unit tests: $FOCUSED_UNIT_RESULT"
            echo "Focused instrumentation: $FOCUSED_INSTRUMENTATION_RESULT"
            echo 'Screenshot validation and lint run in separate jobs. The final build check requires all validation jobs to succeed.'
            echo 'An APK artifact is not evidence that validation passed. Inspect the task reports.'
          } | tee ci-artifacts/validation.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize required unit test results
        if: ${{ always() && (inputs.mode || 'validate') == 'validate' }}
        run: >-
          python3 scripts/ci-results.py
          --tests 'app=app/build/test-results/testEmulatorDebugUnitTest/TEST-*.xml'
          --tests 'dexlib=dexlib/build/test-results/testDebugUnitTest/TEST-*.xml'
          --task :app:testEmulatorDebugUnitTest --task :dexlib:testDebugUnitTest
          --scope 'validate unit results; instrumentation compile-only; lint/screenshots in separate jobs'
          --output ci-artifacts/unit-results.json

      - name: Summarize runtime or candidate operation
        if: ${{ always() && (inputs.mode == 'runtime-smoke' || inputs.mode == 'update-screenshots') }}
        env:
          OPERATION_RESULT: ${{ inputs.mode == 'runtime-smoke' && steps.runtime.outcome || steps.update_candidates.outcome }}
        shell: bash
        run: |
          case "$OPERATION_RESULT" in
            success) outcome=passed ;;
            failure) outcome=failed ;;
            cancelled) outcome=cancelled ;;
            *) outcome=not-run ;;
          esac
          python3 scripts/ci-results.py --operation-result "$outcome" \
            --scope 'Selected runtime contracts or candidate generation only; see detailed logs; no baseline acceptance' \
            --output ci-artifacts/operation-results.json

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-ci-diagnostics
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            dexlib/build/reports/tests/**
            dexlib/build/test-results/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build/reports/problems/**
            build/reports/profile/**
            ci-artifacts/validation.txt
            ci-artifacts/*-results.*
            ci-artifacts/*-timing.json
            ci-artifacts/runtime-smoke/**
            runtime-logcat.txt
            ci-artifacts/instrumentation-*.txt
          if-no-files-found: warn
          retention-days: 7


  screenshots:
    needs: [source, helpers]
    env:
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      PR_HEAD_SHA: ${{ needs.source.outputs.pr_head }}
      PR_BASE_SHA: ${{ needs.source.outputs.pr_base }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      CI_REQUEST_ID: ${{ needs.source.outputs.request_id }}
      CI_PROFILE: ${{ inputs.mode || 'validate' }}
      CI_SELECTOR: ${{ inputs.test_selector }}
    name: Screenshot validation
    if: (inputs.mode || 'validate') == 'validate' || inputs.mode == 'screenshots'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Ubuntu 26.04 has cmdline-tools 20.0 preinstalled; avoid fetching 22.0.
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate screenshot references
        id: screenshots
        shell: bash
        run: |
          set -euo pipefail
          task=(:app:testEmulatorDebugScreenshotTestDefaultTestSuite)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            rm -rf app/build/intermediates/emulatorDebug/testEmulatorDebugScreenshotTestDefaultTestSuite/results
            task+=(--rerun)
          fi
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail -PjlmodNativeBuild=false "${task[@]}"

      - name: Package existing screenshot renders after comparison failure
        id: candidates
        if: ${{ !cancelled() && steps.screenshots.outcome == 'failure' }}
        run: python3 scripts/ci-screenshot-candidates.py

      - name: Upload screenshot candidates for review
        if: ${{ !cancelled() && steps.candidates.outcome == 'success' && steps.candidates.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-candidates
          path: screenshot-candidates/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize required screenshot results
        if: always()
        run: >-
          python3 scripts/ci-results.py --no-skips
          --tests 'screenshots=app/build/intermediates/emulatorDebug/testEmulatorDebugScreenshotTestDefaultTestSuite/results/TEST-*.xml'
          --task :app:testEmulatorDebugScreenshotTestDefaultTestSuite
          --output ci-artifacts/screenshot-results.json

      - name: Upload screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-screenshot-diagnostics
          path: |
            ci-artifacts/screenshot-results.*
            app/build/reports/tests/testEmulatorDebugScreenshotTestDefaultTestSuite/**
            app/build/intermediates/emulatorDebug/testEmulatorDebugScreenshotTestDefaultTestSuite/results/**
            build/reports/problems/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7

  lint:
    needs: [source, helpers]
    env:
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      PR_HEAD_SHA: ${{ needs.source.outputs.pr_head }}
      PR_BASE_SHA: ${{ needs.source.outputs.pr_base }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      CI_REQUEST_ID: ${{ needs.source.outputs.request_id }}
      CI_PROFILE: ${{ inputs.mode || 'validate' }}
      CI_SELECTOR: ${{ inputs.test_selector }}
    name: Lint
    if: (inputs.mode || 'validate') == 'validate'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Ubuntu 26.04 has cmdline-tools 20.0 preinstalled; avoid fetching 22.0.
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Lint app and dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --daemon --stacktrace --profile --continue --configuration-cache --configuration-cache-problems=fail :app:lintEmulatorDebug

      - name: Summarize required lint results
        if: always()
        run: >-
          python3 scripts/ci-results.py
          --lint 'app-and-dependencies=app/build/reports/lint-results-emulatorDebug.xml'
          --task :app:lintEmulatorDebug
          --output ci-artifacts/lint-results.json

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-lint-diagnostics
          path: |
            ci-artifacts/lint-results.*
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            dexlib/build/reports/lint-results-*.html
            dexlib/build/reports/lint-results-*.xml
            dexlib/build/reports/lint-results-*.sarif
            build/reports/problems/**
            build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7



  release-check:
    needs: [source, helpers]
    env:
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      PR_HEAD_SHA: ${{ needs.source.outputs.pr_head }}
      PR_BASE_SHA: ${{ needs.source.outputs.pr_base }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      CI_REQUEST_ID: ${{ needs.source.outputs.request_id }}
      CI_PROFILE: ${{ inputs.mode || 'validate' }}
      CI_SELECTOR: ${{ inputs.test_selector }}
    name: Release packaging and startup
    if: inputs.mode == 'release-check'
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Build and stage unsigned release APKs
        id: release_assembly
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          JLMOD_BUILD_COMMIT="$(git rev-parse HEAD)"
          export JLMOD_BUILD_COMMIT
          python3 -B -m unittest discover -s scripts/tests -p 'test_*release*.py' -v
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail \
            -Pjlmod.versionName=0.0.0-ci -Pjlmod.versionCode=1 :app:assembleEmulatorRelease
          MIN_SDK="$(sed -nE 's/^androidMinSdk = "([0-9]+)"$/\1/p' gradle/libs.versions.toml)"
          python3 scripts/prepare-release.py \
            --version 0.0.0-ci --version-code 1 --commit "$JLMOD_BUILD_COMMIT" \
            --min-sdk "$MIN_SDK" --repository "$GITHUB_REPOSITORY" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo 'Unsigned release-check APKs. These are not published releases or signed updates.'
            echo "Source commit: $JLMOD_BUILD_COMMIT"
            echo 'Download links in release-notes.md are a preview only.'
          } > dist/BUILD-INFO.txt
          python3 scripts/check-elf-alignment.py dist/*.apk

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-release-check-unsigned
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch release APKs with 16 KB pages
        id: release_startup
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          disable-animations: true
          script: bash scripts/release-smoke.sh

      - name: Summarize release qualification operation
        if: always()
        env:
          ASSEMBLY_RESULT: ${{ steps.release_assembly.outcome }}
          STARTUP_RESULT: ${{ steps.release_startup.outcome }}
        shell: bash
        run: |
          outcome=not-run
          if [[ "$ASSEMBLY_RESULT" == failure || "$STARTUP_RESULT" == failure ]]; then
            outcome=failed
          elif [[ "$ASSEMBLY_RESULT" == cancelled || "$STARTUP_RESULT" == cancelled ]]; then
            outcome=cancelled
          elif [[ "$ASSEMBLY_RESULT" == success && "$STARTUP_RESULT" == success ]]; then
            outcome=passed
          fi
          python3 scripts/ci-results.py --operation-result "$outcome" \
            --scope 'Unsigned release assembly; all packaged 64-bit ELF LOAD checks; x86_64/universal startup on 16 KB emulator' \
            --output ci-artifacts/release-smoke/operation-results.json

      - name: Upload release check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-release-check-diagnostics
          path: |
            build/reports/profile/**
            build/reports/problems/**
            ci-artifacts/release-smoke/**
          if-no-files-found: warn
          retention-days: 7

  host-native:
    name: Host native regressions
    needs: [source, helpers]
    if: inputs.mode == 'host-native'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      CI_PROFILE: host-native
      CI_REQUEST_ID: ${{ needs.source.outputs.request_id }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      PR_HEAD_SHA: ${{ needs.source.outputs.pr_head }}
      PR_BASE_SHA: ${{ needs.source.outputs.pr_base }}
    steps:
      - name: Check out exact sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Verify source and host tool availability
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          command -v pwsh
          command -v gcc
          command -v g++
      - name: Run allocation and RMID regressions
        id: native
        run: |
          pwsh -NoProfile -File app/src/test/native/run-sonivox-allocation.ps1 -Compiler gcc
          pwsh -NoProfile -File app/src/test/native/run-sonivox-rmid.ps1 -Compiler g++

      - name: Summarize host regression operation
        if: always()
        env:
          NATIVE_RESULT: ${{ steps.native.outcome }}
        run: |
          case "$NATIVE_RESULT" in
            success) outcome=passed ;;
            failure) outcome=failed ;;
            cancelled) outcome=cancelled ;;
            *) outcome=not-run ;;
          esac
          python3 scripts/ci-results.py --operation-result "$outcome" \
            --scope 'Host allocation/RMID executable regressions; no DLS bank fixture, Android/device execution, or JUnit counts' \
            --output ci-artifacts/native-results.json
      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-host-native-diagnostics
          path: ci-artifacts/native-results.*
          if-no-files-found: warn
          retention-days: 7

  ci:
    # Preserve the required PR check name; maintenance cannot satisfy it.
    name: ${{ (inputs.mode || 'validate') == 'validate' && 'build' || 'maintenance-status' }}
    needs: [build, screenshots, lint]
    if: ${{ always() && (inputs.mode || 'validate') == 'validate' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all validation jobs to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCREENSHOT_RESULT: ${{ needs.screenshots.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          {
            echo "Build and tests: $BUILD_RESULT"
            echo "Screenshot validation: $SCREENSHOT_RESULT"
            echo "Lint: $LINT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$BUILD_RESULT" == 'success' && "$SCREENSHOT_RESULT" == 'success' && "$LINT_RESULT" == 'success' ]]
