name: MIDP Stage C emulator (temporary)

on:
  pull_request:
    branches: [alpha]
    paths:
      - 'app/src/main/java/javax/microedition/**'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/installer/**'
      - 'app/src/androidTest/java/javax/microedition/lcdui/MidpStageCTextInputDeviceTest.java'
      - 'app/src/androidTest/java/javax/microedition/shell/PlatformPackageChoiceDialogDeviceTest.kt'
      - '.github/workflows/midp-stage-c-emulator.yml'

permissions:
  contents: read

concurrency:
  group: midp-stage-c-emulator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Stage C Android input instrumentation
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Provision NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Stage C device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew -PjlmodRuntimeTestAbi=x86_64 :app:connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.lcdui.MidpStageCTextInputDeviceTest,javax.microedition.shell.PlatformPackageChoiceDialogDeviceTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midp-stage-c-virtual-android-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 5
