name: Patch Memory Editor device feedback

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/patch-memory-editor-device-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545
      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          "$sdkmanager_path" 'platforms;android-37.0'
      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
      - name: Apply device feedback polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"matcher not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # AIDL: let lightweight clients distinguish search progress/completion from other work.
          path = 'app/src/main/aidl/ru/playsoftware/j2meloader/memory/IMemoryEngineCallback.aidl'
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              '    void onOperationProgress(long operationId, long scannedBytes, long totalBytes);\n\n'
              '    void onOperationFinished(long operationId, int resultCode, long resultCount, String message,\n'
              '            boolean passiveRefresh);',
              '    void onOperationProgress(long operationId, long scannedBytes, long totalBytes,\n'
              '            boolean searchOperation);\n\n'
              '    void onOperationFinished(long operationId, int resultCode, long resultCount, String message,\n'
              '            boolean passiveRefresh, boolean searchOperation);'
          )
          p.write_text(text)

          # Service: mark scan/refine operations explicitly and forward that bit to callbacks.
          path = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java'
          p = Path(path)
          text = p.read_text()
          if text.count('return enqueue(token, true, scope, () -> runNewSearchWithGcGuard(') != 3:
              raise SystemExit('unexpected new-search enqueue count')
          text = text.replace(
              'return enqueue(token, true, scope, () -> runNewSearchWithGcGuard(',
              'return enqueueSearch(token, true, scope, () -> runNewSearchWithGcGuard('
          )
          text = text.replace(
              '''\t\tpublic long startNearbySearch(long token, long anchorCandidateId, int radius,\n\t\t                              int type, int predicate, String first, String second) {\n\t\t\treturn enqueue(token, false, 0, () -> {''',
              '''\t\tpublic long startNearbySearch(long token, long anchorCandidateId, int radius,\n\t\t                              int type, int predicate, String first, String second) {\n\t\t\treturn enqueueSearch(token, false, 0, () -> {'''
          )
          text = text.replace(
              '''\t\tpublic long refineKnown(long token, int predicate, String first, String second) {\n\t\t\treturn enqueue(token, false, 0,\n\t\t\t\t\t() -> refineKnownGcAware(token, predicate, first, second));\n\t\t}''',
              '''\t\tpublic long refineKnown(long token, int predicate, String first, String second) {\n\t\t\treturn enqueueSearch(token, false, 0,\n\t\t\t\t\t() -> refineKnownGcAware(token, predicate, first, second));\n\t\t}'''
          )
          text = text.replace(
              '''\t\tpublic long refineRelative(long token, int predicate, int compareTarget,\n\t\t                           String first, String second) {\n\t\t\treturn enqueue(token, false, 0,\n\t\t\t\t\t() -> refineRelativeGcAware(token, predicate, compareTarget, first, second));\n\t\t}''',
              '''\t\tpublic long refineRelative(long token, int predicate, int compareTarget,\n\t\t                           String first, String second) {\n\t\t\treturn enqueueSearch(token, false, 0,\n\t\t\t\t\t() -> refineRelativeGcAware(token, predicate, compareTarget, first, second));\n\t\t}'''
          )
          old = '''\tprivate long enqueue(long token, boolean configure, int scope, NativeOperation operation) {\n\t\treturn enqueue(token, configure, scope, false, operation);\n\t}\n\n\tprivate long enqueue(long token, boolean configure, int scope, boolean passiveRefresh,\n\t                     NativeOperation operation) {'''
          new = '''\tprivate long enqueue(long token, boolean configure, int scope, NativeOperation operation) {\n\t\treturn enqueue(token, configure, scope, false, false, operation);\n\t}\n\n\tprivate long enqueue(long token, boolean configure, int scope, boolean passiveRefresh,\n\t                     NativeOperation operation) {\n\t\treturn enqueue(token, configure, scope, passiveRefresh, false, operation);\n\t}\n\n\tprivate long enqueueSearch(long token, boolean configure, int scope, NativeOperation operation) {\n\t\treturn enqueue(token, configure, scope, false, true, operation);\n\t}\n\n\tprivate long enqueue(long token, boolean configure, int scope, boolean passiveRefresh,\n\t                     boolean searchOperation, NativeOperation operation) {'''
          if old not in text:
              raise SystemExit('enqueue overload matcher not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '() -> notifyProgress(operationId, progressBaseline),',
              '() -> notifyProgress(operationId, progressBaseline, searchOperation),',
              1,
          )
          text = text.replace(
              'notifyFinished(operationId, result, serviceMessage, passiveRefresh);',
              'notifyFinished(operationId, result, serviceMessage, passiveRefresh, searchOperation);',
              1,
          )
          text = text.replace(
              '''\tprivate void notifyFinished(long operationId, int result, @Nullable String serviceMessage,\n\t                            boolean passiveRefresh) {''',
              '''\tprivate void notifyFinished(long operationId, int result, @Nullable String serviceMessage,\n\t                            boolean passiveRefresh, boolean searchOperation) {''',
              1,
          )
          text = text.replace(
              '''\t\t\t\t\tcallbacks.getBroadcastItem(index)\n\t\t\t\t\t\t\t.onOperationFinished(operationId, result, count, message,\n\t\t\t\t\t\t\t\t\tpassiveRefresh);''',
              '''\t\t\t\t\tcallbacks.getBroadcastItem(index)\n\t\t\t\t\t\t\t.onOperationFinished(operationId, result, count, message,\n\t\t\t\t\t\t\t\t\tpassiveRefresh, searchOperation);''',
              1,
          )
          text = text.replace(
              '\tprivate void notifyProgress(long operationId, long[] baseline) {',
              '\tprivate void notifyProgress(long operationId, long[] baseline, boolean searchOperation) {',
              1,
          )
          text = text.replace(
              '.onOperationProgress(operationId, scannedBytes, progress[1]);',
              '.onOperationProgress(operationId, scannedBytes, progress[1], searchOperation);',
              1,
          )
          p.write_text(text)

          # Controller: search toast + lightweight visible-page live refresh.
          path = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorController.kt'
          p = Path(path)
          text = p.read_text()
          text = text.replace('import android.view.View\n', 'import android.view.View\nimport android.widget.Toast\n', 1)
          text = text.replace(
              '    private var pendingOperationFeedback: PendingOperationFeedback? = null\n',
              '    private var pendingOperationFeedback: PendingOperationFeedback? = null\n'
              '    private var liveRefreshPending = false\n'
              '    private val liveRefreshRunnable = Runnable(::runLiveRefreshTick)\n',
              1,
          )
          text = text.replace(
              '''        override fun onOperationProgress(operationId: Long, scannedBytes: Long, totalBytes: Long) {''',
              '''        override fun onOperationProgress(\n            operationId: Long,\n            scannedBytes: Long,\n            totalBytes: Long,\n            searchOperation: Boolean,\n        ) {''',
              1,
          )
          text = text.replace(
              '''            passiveRefresh: Boolean,\n        ) {\n            post {\n                // Binder can finish a tiny refine before the main-thread operation-id post.''',
              '''            passiveRefresh: Boolean,\n            searchOperation: Boolean,\n        ) {\n            post {\n                if (passiveRefresh && liveRefreshPending && !state.busy) {\n                    liveRefreshPending = false\n                    if (resultCode == MemoryEngineContract.RESULT_TARGET_LOST ||\n                        resultCode == MemoryEngineContract.RESULT_NO_SESSION\n                    ) {\n                        close()\n                    } else if (resultCode == MemoryEngineContract.RESULT_OK && state.visible) {\n                        reloadState()\n                    }\n                    return@post\n                }\n\n                // Binder can finish a tiny refine before the main-thread operation-id post.''',
              1,
          )
          text = text.replace(
              '''                val succeeded = resultCode == MemoryEngineContract.RESULT_OK\n                val editFollowUp''',
              '''                val succeeded = resultCode == MemoryEngineContract.RESULT_OK\n                if (succeeded && searchOperation) showSearchCompleteToast(resultCount)\n                val editFollowUp''',
              1,
          )
          text = text.replace(
              '''        if (service == null) connectEngine() else reloadState()\n    }''',
              '''        if (service == null) connectEngine() else reloadState()\n        composeView.removeCallbacks(liveRefreshRunnable)\n        composeView.postDelayed(liveRefreshRunnable, LIVE_REFRESH_INITIAL_DELAY_MS)\n    }''',
              1,
          )
          text = text.replace(
              '''        state = state.copy(visible = false, selected = emptySet())\n        composeView.visibility = View.GONE''',
              '''        composeView.removeCallbacks(liveRefreshRunnable)\n        liveRefreshPending = false\n        state = state.copy(visible = false, selected = emptySet())\n        composeView.visibility = View.GONE''',
              1,
          )
          text = text.replace(
              '''        destroyed = true\n        connectionGeneration++\n        composeView.visibility = View.GONE''',
              '''        destroyed = true\n        connectionGeneration++\n        composeView.removeCallbacks(liveRefreshRunnable)\n        liveRefreshPending = false\n        composeView.visibility = View.GONE''',
              1,
          )
          text = text.replace(
              '''            pendingInspectorRefresh = null\n            if (!runtimeStillActive()) {''',
              '''            pendingInspectorRefresh = null\n            liveRefreshPending = false\n            if (!runtimeStillActive()) {''',
              1,
          )
          insert_before = '''    private fun operationMessage(result: Int, engineMessage: String?): String = when (result) {'''
          live_code = '''    private fun runLiveRefreshTick() {\n        if (destroyed || !state.visible) return\n        if (!state.busy && !liveRefreshPending && state.inspector == null) {\n            val ids = if (state.watchTab) {\n                state.watches.map(MemoryWatchRow::id)\n            } else {\n                state.results.map(MemoryResultRow::id)\n            }.toLongArray()\n            val token = state.runtimeToken\n            val engine = service\n            if (ids.isNotEmpty() && token != 0L && engine != null) {\n                liveRefreshPending = true\n                runIpc {\n                    val operationId = engine.refreshCandidates(token, ids)\n                    if (operationId <= 0L) post { liveRefreshPending = false }\n                }\n            }\n        }\n        if (!destroyed && state.visible) {\n            composeView.postDelayed(liveRefreshRunnable, LIVE_REFRESH_INTERVAL_MS)\n        }\n    }\n\n    private fun showSearchCompleteToast(resultCount: Long) {\n        val count = resultCount.coerceIn(0L, Int.MAX_VALUE.toLong()).toInt()\n        Toast.makeText(\n            context,\n            context.resources.getQuantityString(\n                R.plurals.memory_editor_search_complete,\n                count,\n                resultCount,\n            ),\n            Toast.LENGTH_SHORT,\n        ).show()\n    }\n\n'''
          if insert_before not in text:
              raise SystemExit('controller insertion point not found')
          text = text.replace(insert_before, live_code + insert_before, 1)
          text = text.replace(
              '''        private const val ENGINE_RECONNECT_DELAY_MS = 250L\n        private val CAPABILITY_RETRY_DELAYS_MS''',
              '''        private const val ENGINE_RECONNECT_DELAY_MS = 250L\n        private const val LIVE_REFRESH_INITIAL_DELAY_MS = 250L\n        private const val LIVE_REFRESH_INTERVAL_MS = 1_000L\n        private val CAPABILITY_RETRY_DELAYS_MS''',
              1,
          )
          p.write_text(text)

          # Dedicated editor Activity stays immersive; it must not make Android bars appear.
          Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorActivity.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\nimport android.content.Context\nimport android.content.Intent\nimport android.graphics.drawable.ColorDrawable\nimport android.os.Bundle\nimport android.view.ViewGroup\nimport android.view.WindowManager\nimport androidx.activity.OnBackPressedCallback\nimport androidx.appcompat.app.AppCompatActivity\nimport androidx.compose.ui.platform.ComposeView\nimport androidx.core.view.WindowInsetsCompat\nimport androidx.core.view.WindowInsetsControllerCompat\nimport ru.playsoftware.j2meloader.util.EdgeToEdgeCompat\n\n/** Translucent app Activity containing the production Memory Editor UI in :memory_engine. */\nclass MemoryEditorActivity : AppCompatActivity() {\n    private var controller: MemoryEditorComposeController? = null\n    private var listenerRegistered = false\n\n    private val runtimeListener = MemoryEngineService.LocalRuntimeListener {\n        runOnUiThread {\n            if (!isFinishing && !isDestroyed) finish()\n        }\n    }\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        val token = intent.getLongExtra(EXTRA_RUNTIME_TOKEN, 0L)\n        if (token == 0L) {\n            finish()\n            return\n        }\n\n        window.setBackgroundDrawable(ColorDrawable(android.graphics.Color.TRANSPARENT))\n        window.clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)\n        EdgeToEdgeCompat.enableIfSupported(this)\n        hideSystemBars()\n\n        MemoryEngineService.addLocalRuntimeListener(runtimeListener)\n        listenerRegistered = true\n\n        val composeView = ComposeView(this)\n        setContentView(\n            composeView,\n            ViewGroup.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT,\n                ViewGroup.LayoutParams.MATCH_PARENT,\n            ),\n        )\n        hideSystemBars()\n        controller = MemoryEditorComposeController(\n            composeView = composeView,\n            ownedRuntimeToken = token,\n            closeHost = ::finish,\n        ).also(MemoryEditorComposeController::open)\n\n        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {\n            override fun handleOnBackPressed() {\n                controller?.close() ?: finish()\n            }\n        })\n    }\n\n    override fun onWindowFocusChanged(hasFocus: Boolean) {\n        super.onWindowFocusChanged(hasFocus)\n        if (hasFocus) hideSystemBars()\n    }\n\n    private fun hideSystemBars() {\n        WindowInsetsControllerCompat(window, window.decorView).apply {\n            hide(WindowInsetsCompat.Type.systemBars())\n            systemBarsBehavior =\n                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE\n        }\n    }\n\n    override fun onDestroy() {\n        controller?.destroy()\n        controller = null\n        if (listenerRegistered) {\n            MemoryEngineService.removeLocalRuntimeListener(runtimeListener)\n            listenerRegistered = false\n        }\n        super.onDestroy()\n    }\n\n    companion object {\n        private const val EXTRA_RUNTIME_TOKEN =\n            "ru.playsoftware.j2meloader.memory.extra.RUNTIME_TOKEN"\n\n        fun createIntent(context: Context, runtimeToken: Long): Intent =\n            Intent(context, MemoryEditorActivity::class.java)\n                .putExtra(EXTRA_RUNTIME_TOKEN, runtimeToken)\n    }\n}\n''')

          # Bubble becomes a tiny plain View container with an icon or percentage label.
          path = 'app/src/main/java/javax/microedition/shell/RuntimeHostView.java'
          p = Path(path)
          text = p.read_text()
          text = text.replace('import android.widget.LinearLayout;\n', 'import android.widget.LinearLayout;\nimport android.widget.TextView;\n', 1)
          text = text.replace('import androidx.appcompat.widget.AppCompatImageButton;\n', 'import androidx.appcompat.widget.AppCompatImageView;\n', 1)
          text = text.replace(
              '''\tpublic final View memoryEditorBubble;\n\tpublic final ComposeView notices;''',
              '''\tpublic final View memoryEditorBubble;\n\tpublic final View memoryEditorBubbleIcon;\n\tpublic final TextView memoryEditorBubbleProgress;\n\tpublic final ComposeView notices;''',
              1,
          )
          old = '''\t\t// The bubble deliberately stays a plain Android View. A second Compose tree would be wasteful\n\t\t// for one icon and would add avoidable allocations in the MIDlet process.\n\t\tAppCompatImageButton bubble = new AppCompatImageButton(context);\n\t\tbubble.setImageResource(R.drawable.ic_memory_editor_search);\n\t\tbubble.setContentDescription(context.getString(R.string.memory_editor_bubble));\n\t\tbubble.setImageTintList(ColorStateList.valueOf(\n\t\t\t\tresolveThemeColor(context, android.R.attr.textColorPrimaryInverse, Color.WHITE)));\n\t\tbubble.setPadding(dp(context, 13), dp(context, 13), dp(context, 13), dp(context, 13));\n\t\tbubble.setAlpha(0.90f);\n\t\tbubble.setElevation(dp(context, 6));\n\t\tbubble.setVisibility(View.GONE);\n\t\tGradientDrawable bubbleBackground = new GradientDrawable();\n\t\tbubbleBackground.setShape(GradientDrawable.OVAL);\n\t\tbubbleBackground.setColor(LegacyThemeColors.accent(context));\n\t\tbubble.setBackground(bubbleBackground);\n\t\tFrameLayout.LayoutParams bubbleParams = new FrameLayout.LayoutParams(\n\t\t\t\tdp(context, 52), dp(context, 52), Gravity.END | Gravity.CENTER_VERTICAL);\n\t\tbubbleParams.setMarginEnd(dp(context, 12));\n\t\troot.addView(bubble, bubbleParams);\n\t\tmemoryEditorBubble = bubble;'''
          new = '''\t\t// The bubble deliberately stays a plain Android View. A second Compose tree would be wasteful\n\t\t// for one icon and would add avoidable allocations in the MIDlet process.\n\t\tFrameLayout bubble = new FrameLayout(context);\n\t\tbubble.setContentDescription(context.getString(R.string.memory_editor_bubble));\n\t\tbubble.setAlpha(0.90f);\n\t\tbubble.setElevation(dp(context, 6));\n\t\tbubble.setVisibility(View.GONE);\n\t\tGradientDrawable bubbleBackground = new GradientDrawable();\n\t\tbubbleBackground.setShape(GradientDrawable.OVAL);\n\t\tbubbleBackground.setColor(LegacyThemeColors.accent(context));\n\t\tbubble.setBackground(bubbleBackground);\n\n\t\tAppCompatImageView bubbleIcon = new AppCompatImageView(context);\n\t\tbubbleIcon.setImageResource(R.drawable.ic_memory_editor_search);\n\t\tbubbleIcon.setImageTintList(ColorStateList.valueOf(\n\t\t\t\tresolveThemeColor(context, android.R.attr.textColorPrimaryInverse, Color.WHITE)));\n\t\tbubbleIcon.setPadding(dp(context, 14), dp(context, 14), dp(context, 14), dp(context, 14));\n\t\tbubble.addView(bubbleIcon, new FrameLayout.LayoutParams(\n\t\t\t\tViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n\n\t\tTextView bubbleProgress = new TextView(context);\n\t\tbubbleProgress.setGravity(Gravity.CENTER);\n\t\tbubbleProgress.setTextColor(resolveThemeColor(\n\t\t\t\tcontext, android.R.attr.textColorPrimaryInverse, Color.WHITE));\n\t\tbubbleProgress.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);\n\t\tbubbleProgress.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);\n\t\tbubbleProgress.setIncludeFontPadding(false);\n\t\tbubbleProgress.setVisibility(View.GONE);\n\t\tbubble.addView(bubbleProgress, new FrameLayout.LayoutParams(\n\t\t\t\tViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n\n\t\tFrameLayout.LayoutParams bubbleParams = new FrameLayout.LayoutParams(\n\t\t\t\tdp(context, 56), dp(context, 56), Gravity.END | Gravity.CENTER_VERTICAL);\n\t\tbubbleParams.setMarginEnd(dp(context, 12));\n\t\troot.addView(bubble, bubbleParams);\n\t\tmemoryEditorBubble = bubble;\n\t\tmemoryEditorBubbleIcon = bubbleIcon;\n\t\tmemoryEditorBubbleProgress = bubbleProgress;'''
          if old not in text:
              raise SystemExit('RuntimeHostView bubble matcher not found')
          p.write_text(text.replace(old, new, 1))

          # MIDlet-side bubble owns a tiny binding so scans survive closing the editor Activity.
          Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorBubbleController.kt').write_text('''/*\n * Licensed under the Apache License, Version 2.0 (the "License");\n * you may not use this file except in compliance with the License.\n */\npackage ru.playsoftware.j2meloader.memory\n\nimport android.app.Activity\nimport android.content.ComponentName\nimport android.content.Context\nimport android.content.Intent\nimport android.content.ServiceConnection\nimport android.os.IBinder\nimport android.os.RemoteException\nimport android.view.View\nimport android.widget.TextView\nimport android.widget.Toast\nimport ru.playsoftware.j2meloader.R\n\n/**\n * MIDlet-process owner of the tiny in-game bubble only. The editor Activity and Compose tree live\n * in :memory_engine. This small Binder client also keeps an active scan alive while the editor\n * Activity is closed and mirrors only search progress/completion back to the game.\n */\nclass MemoryEditorBubbleController(\n    private val activity: Activity,\n    private val bubbleView: View,\n    private val iconView: View,\n    private val progressView: TextView,\n) {\n    private var enabled = false\n    private var hostResumed = true\n    private var destroyed = false\n    private var bound = false\n    private var service: IMemoryEngineService? = null\n\n    private val callback = object : IMemoryEngineCallback.Stub() {\n        override fun onOperationProgress(\n            operationId: Long,\n            scannedBytes: Long,\n            totalBytes: Long,\n            searchOperation: Boolean,\n        ) {\n            if (!searchOperation || totalBytes <= 0L) return\n            val percent = ((scannedBytes.coerceIn(0L, totalBytes) * 100L) / totalBytes)\n                .toInt().coerceIn(0, 100)\n            activity.runOnUiThread {\n                if (!destroyed && enabled) setProgress(percent)\n            }\n        }\n\n        override fun onOperationFinished(\n            operationId: Long,\n            resultCode: Int,\n            resultCount: Long,\n            message: String?,\n            passiveRefresh: Boolean,\n            searchOperation: Boolean,\n        ) {\n            if (!searchOperation) return\n            activity.runOnUiThread {\n                if (destroyed) return@runOnUiThread\n                setProgress(null)\n                if (enabled && hostResumed && resultCode == MemoryEngineContract.RESULT_OK) {\n                    val count = resultCount.coerceIn(0L, Int.MAX_VALUE.toLong()).toInt()\n                    Toast.makeText(\n                        activity,\n                        activity.resources.getQuantityString(\n                            R.plurals.memory_editor_search_complete,\n                            count,\n                            resultCount,\n                        ),\n                        Toast.LENGTH_SHORT,\n                    ).show()\n                }\n            }\n        }\n    }\n\n    private val connection = object : ServiceConnection {\n        override fun onServiceConnected(name: ComponentName, binder: IBinder) {\n            service = IMemoryEngineService.Stub.asInterface(binder)\n            try {\n                service?.registerCallback(callback)\n            } catch (_: RemoteException) {\n                disconnected()\n            }\n        }\n\n        override fun onServiceDisconnected(name: ComponentName) = disconnected()\n        override fun onBindingDied(name: ComponentName) = disconnected()\n        override fun onNullBinding(name: ComponentName) = disconnected()\n    }\n\n    private val runtimeListener = MemoryRuntimeSession.Listener {\n        activity.runOnUiThread {\n            enabled = false\n            setProgress(null)\n            disconnectEngine()\n            syncVisibility()\n        }\n    }\n\n    init {\n        bubbleView.visibility = View.GONE\n        progressView.visibility = View.GONE\n        bubbleView.setOnClickListener { openEditor() }\n        MemoryRuntimeSession.addListener(runtimeListener)\n    }\n\n    fun toggleBubble(): Boolean {\n        if (destroyed || MemoryRuntimeSession.currentToken() == 0L) return false\n        enabled = !enabled\n        if (enabled) connectEngine() else {\n            setProgress(null)\n            disconnectEngine()\n        }\n        syncVisibility()\n        return enabled\n    }\n\n    fun isBubbleEnabled(): Boolean = enabled\n\n    fun onHostResumed() {\n        hostResumed = true\n        if (enabled) connectEngine()\n        syncVisibility()\n    }\n\n    fun onHostPaused() {\n        hostResumed = false\n        bubbleView.visibility = View.GONE\n    }\n\n    fun destroy() {\n        if (destroyed) return\n        destroyed = true\n        MemoryRuntimeSession.removeListener(runtimeListener)\n        bubbleView.setOnClickListener(null)\n        setProgress(null)\n        disconnectEngine()\n        bubbleView.visibility = View.GONE\n    }\n\n    private fun openEditor() {\n        if (destroyed) return\n        val token = MemoryRuntimeSession.currentToken()\n        if (token == 0L) {\n            enabled = false\n            disconnectEngine()\n            syncVisibility()\n            return\n        }\n        bubbleView.visibility = View.GONE\n        try {\n            activity.startActivity(MemoryEditorActivity.createIntent(activity, token))\n        } catch (_: RuntimeException) {\n            syncVisibility()\n        }\n    }\n\n    private fun connectEngine() {\n        if (destroyed || !enabled || bound || MemoryRuntimeSession.currentToken() == 0L) return\n        bound = activity.bindService(\n            Intent(activity, MemoryEngineService::class.java),\n            connection,\n            Context.BIND_AUTO_CREATE,\n        )\n    }\n\n    private fun disconnectEngine() {\n        try {\n            service?.unregisterCallback(callback)\n        } catch (_: RemoteException) {\n            // The engine may already be shutting down with the MID