name: Temporary update acceptance PR 214

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/temp-update-acceptance.yml'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/updates/TemporaryUpdateAcceptanceTest.kt'

permissions:
  contents: read

jobs:
  pages-artifact:
    name: Real release index, HTTP and Pages upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate real release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 scripts/generate-update-manifest.py --releases releases.json --output _site/updates.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("_site")
          assert (root / "index.html").is_file()
          manifest = json.loads((root / "updates.json").read_text())
          assert manifest["schema"] == 1 and manifest["applicationId"] == "io.github.h3nb.jlmodplus"
          assert manifest["releases"], "No eligible published releases"
          print("Validated published releases:", len(manifest["releases"]))
          PY
      - name: HTTP smoke of generated site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory _site >/tmp/pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/index.html | grep -F 'href="updates.json"'
          curl --fail --silent --show-error http://127.0.0.1:8765/updates.json | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j["releases"]; print("HTTP JSON valid")'
      - name: Upload with the official Pages artifact action
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  android-update:
    name: Android modal and external-intent smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-35'
      - name: Make ephemeral debug-only acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/io/github/h3nb/jlmodplus/applist/LibraryComposeBridge.kt")
          source = path.read_text()
          previous = 'if (BuildConfig.DEBUG || !hostResumed || !repository.automaticChecks)'
          assert source.count(previous) == 1
          source = source.replace(previous, 'if (false || !hostResumed || !repository.automaticChecks)')
          previous = 'if (BuildConfig.DEBUG || repository == null || !repository.automaticChecks ||'
          assert source.count(previous) == 1
          source = source.replace(previous, 'if (false || repository == null || !repository.automaticChecks ||')
          path.write_text(source)
          repo = Path("app/src/main/java/io/github/h3nb/jlmodplus/updates/UpdateRepository.kt")
          source = repo.read_text()
          old = '"https://h3nb.github.io/JL-Mod-Plus/updates.json"'
          assert source.count(old) == 1
          repo.write_text(source.replace(old, '"http://10.0.2.2:8765/updates.json"'))
          print("Temporary test-only changes made in runner checkout, not committed.")
          PY
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run focused test on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            chmod +x gradlew
            cat > /tmp/update-metadata-service.py <<'PY'
            import json
            import threading
            from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
            gate = threading.Event()
            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == "/unlock":
                        gate.set()
                        self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
                    if self.path == "/health":
                        self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
                    if self.path != "/updates.json":
                        self.send_error(404); return
                    if not gate.wait(80):
                        self.send_error(503); return
                    data = {"schema": 1, "applicationId": "io.github.h3nb.jlmodplus", "releases": [
                        {"versionName": "99.0.0-beta", "versionCode": 2099999999, "prerelease": True,
                         "minSdk": 23, "assets": [{
                             "abi": "x86_64",
                             "url": "https://github.com/H3nb/JL-Mod-Plus/releases/download/v99.0.0-beta/JL-Mod-Plus-v99.0.0-beta-x86_64.apk"
                         }]}
                    ]}
                    body = json.dumps(data).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
            ThreadingHTTPServer(("0.0.0.0", 8765), Handler).serve_forever()
            PY
            python3 /tmp/update-metadata-service.py >/tmp/update-http.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/update-http.log' EXIT
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/health
            adb shell appops set io.github.h3nb.jlmodplus.debug MANAGE_EXTERNAL_STORAGE allow || true
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 \
              -Pjlmod.versionName=0.2.5-beta -Pjlmod.versionCode=25 \
              -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.updates.TemporaryUpdateAcceptanceTest \
              :app:connectedEmulatorDebugAndroidTest
      - name: Upload test results if needed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-update-acceptance-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 3
