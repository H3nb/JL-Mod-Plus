name: Normalize config visible casing

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
      - name: Normalize visible Config and key-mapper labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'app/src/main/res/values-in/strings.xml': {
                  '<string name="PREF_LAYOUT">Tata Letak</string>': '<string name="PREF_LAYOUT">Tata letak</string>',
                  '<string name="pref_screen_scale_type_none">Ukuran Asli</string>': '<string name="pref_screen_scale_type_none">Ukuran asli</string>',
                  '<string name="PREF_VK_ALPHA">Opasitas: </string>': '<string name="PREF_VK_ALPHA">Opasitas</string>',
                  '<string name="mapping_dialog_title">Tekan Tombol</string>': '<string name="mapping_dialog_title">Tekan tombol</string>',
              },
              'app/src/main/res/values/strings.xml': {
                  '<string name="mapping_dialog_title">Press a Key</string>': '<string name="mapping_dialog_title">Press a key</string>',
              },
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: expected one match for {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/normalize-config-visible-casing.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize remaining config casing"
          git push origin HEAD:ui/redesign-config
