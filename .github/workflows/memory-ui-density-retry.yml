name: Memory UI density migration retry

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/memory-ui-density-retry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - name: Apply robust data-first migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          INPUT = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt')
          COMPOSE = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt')
          INSPECTOR = Path('app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt')

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 marker, got {count}')
              return text.replace(old, new, 1)

          def block(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0 or b <= a:
                  raise SystemExit(f'{label}: block markers missing')
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          # Shared keypad can be forced vertical inside dialogs.
          text = INPUT.read_text()
          text = one(text,
              'internal fun MemoryInputArea(\n    modifier: Modifier = Modifier,\n    content: @Composable () -> Unit,\n) {',
              'internal fun MemoryInputArea(\n    modifier: Modifier = Modifier,\n    sideDockInLandscape: Boolean = true,\n    content: @Composable () -> Unit,\n) {',
              'MemoryInputArea signature')
          text = one(text,
              '    val landscape = LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE',
              '    val landscape = sideDockInLandscape &&\n        LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE',
              'MemoryInputArea landscape')
          INPUT.write_text(text)

          text = COMPOSE.read_text()
          text = one(text,
              '            MemoryEditorContent(state, actions)',
              '            MemoryInputArea(modifier = Modifier.fillMaxSize()) {\n                MemoryEditorContent(state, actions)\n            }',
              'root keypad host')
          text = one(text,
              '    var searchControlsExpanded by remember(landscape) { mutableStateOf(!landscape) }',
              '    var searchControlsExpanded by remember(landscape) { mutableStateOf(true) }',
              'search control default')
          text = one(text,
              '    LaunchedEffect(landscape, state.sessionStage, state.resultCount) {\n        if (landscape && state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {\n            searchControlsExpanded = false\n        }\n        if (state.sessionStage != MemorySessionStage.CANDIDATES) searchControlsExpanded = true\n    }',
              '    LaunchedEffect(landscape, state.sessionStage, state.resultCount) {\n        if (state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {\n            searchControlsExpanded = false\n        } else if (state.sessionStage != MemorySessionStage.CANDIDATES) {\n            searchControlsExpanded = true\n        }\n    }',
              'auto-collapse results')

          new_search_block = dedent('''
              if (!state.watchTab) {
                  if (state.sessionStage == MemorySessionStage.CANDIDATES && !searchControlsExpanded) {
                      CompactRefineStrip(
                          resultCount = state.resultCount,
                          value = value,
                          onValue = { value = it },
                          secondValue = secondValue,
                          onSecondValue = { secondValue = it },
                          type = type,
                          predicate = predicate,
                          onPredicate = { predicate = it },
                          compare = compare,
                          busy = state.busy,
                          onExpand = { searchControlsExpanded = true },
                          actions = actions,
                      )
                  } else {
                      if (state.sessionStage == MemorySessionStage.CANDIDATES && state.resultCount > 0L) {
                          TextButton(
                              onClick = { searchControlsExpanded = false },
                              modifier = Modifier.padding(horizontal = 8.dp),
                          ) {
                              Text(stringResource(R.string.memory_editor_hide_search))
                          }
                      }
                      SearchWorkspace(
                          state = state,
                          searchMode = searchMode,
                          onSearchMode = { searchMode = it },
                          value = value,
                          onValue = { value = it },
                          secondValue = secondValue,
                          onSecondValue = { secondValue = it },
                          type = type,
                          onType = { type = it },
                          predicate = predicate,
                          onPredicate = { predicate = it },
                          compare = compare,
                          onCompare = { compare = it },
                          scope = scope,
                          onScope = { scope = it },
                          advanced = advanced,
                          onAdvanced = { advanced = !advanced },
                          actions = actions,
                      )
                  }
              }
          ''').rstrip()
          text = block(text, '        if (!state.watchTab) {', '        state.message?.let {', new_search_block, 'results search block')

          text = one(text,
              '            MemorySessionStage.UNKNOWN_BASELINE -> UnknownBaselinePane(\n                predicate = predicate,',
              '            MemorySessionStage.UNKNOWN_BASELINE -> UnknownBaselinePane(\n                type = type,\n                predicate = predicate,',
              'unknown type propagation')
          text = one(text,
              '            MemorySessionStage.CANDIDATES -> RefinePane(\n                resultCount = state.resultCount,\n                predicate = predicate,',
              '            MemorySessionStage.CANDIDATES -> RefinePane(\n                resultCount = state.resultCount,\n                type = type,\n                predicate = predicate,',
              'refine type propagation')

          known = dedent('''
          @Composable
          private fun KnownSearchPane(
              value: String,
              onValue: (String) -> Unit,
              secondValue: String,
              onSecondValue: (String) -> Unit,
              type: Int,
              onType: (Int) -> Unit,
              predicate: Int,
              onPredicate: (Int) -> Unit,
              scope: Int,
              onScope: (Int) -> Unit,
              advanced: Boolean,
              onAdvanced: () -> Unit,
              busy: Boolean,
              actions: MemoryEditorActions,
          ) {
              val spec = MemoryInputSpec.forType(type)
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                  MemoryValueInput(
                      value = value,
                      onValueChange = onValue,
                      spec = spec,
                      label = stringResource(R.string.memory_editor_search_hint),
                      modifier = Modifier.weight(1f),
                  )
                  ChoiceMenu(type, VALUE_TYPES, { typeName(it) }, onType)
              }
              QuickKnownPredicates(predicate, onPredicate)
              if (advanced) {
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      ChoiceMenu(predicate, KNOWN_PREDICATES, { predicateName(it) }, onPredicate)
                      ScopeMenu(scope, onScope)
                  }
              }
              if (predicate == MemoryEngineContract.PREDICATE_BETWEEN) {
                  MemoryValueInput(
                      value = secondValue,
                      onValueChange = onSecondValue,
                      spec = spec,
                      label = stringResource(R.string.memory_editor_max_value),
                      modifier = Modifier.fillMaxWidth(),
                  )
              }
              TextButton(onClick = onAdvanced) {
                  Text(stringResource(R.string.memory_editor_advanced))
              }
              Button(
                  onClick = {
                      actions.startSearch(value, secondValue, type, newSearchPredicate(predicate), false, scope)
                  },
                  enabled = !busy && spec.isComplete(value) &&
                      (predicate != MemoryEngineContract.PREDICATE_BETWEEN || spec.isComplete(secondValue)),
                  modifier = Modifier.fillMaxWidth().sizeIn(minHeight = 48.dp),
              ) {
                  Text(stringResource(R.string.memory_editor_search_action))
              }
          }
          ''')
          text = block(text, '@Composable\nprivate fun KnownSearchPane(', '@Composable\nprivate fun UnknownSearchPane(', known, 'KnownSearchPane')

          group = dedent('''
