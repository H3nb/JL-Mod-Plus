      - name: Compile and unit test migrated UI
        run: ./gradlew --no-daemon --stacktrace :app:testEmulatorDebugUnitTest :app:assembleEmulatorDebug
      - name: Record Memory Editor screenshot references
        run: ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest
      - name: Guard screenshot scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep 'screenshotTestEmulatorDebug/reference' | grep -v 'MemoryEditorScreenshotTestKt' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected screenshot references changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit data-first workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/memory-ui-density.yml
          git rm .github/workflows/memory-ui-density-retry.yml
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInputCompose.kt
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEditorCompose.kt
          git add app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryInspectorCompose.kt
          git add app/src/screenshotTestEmulatorDebug/reference/ru.playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt || true
          git diff --cached --check
          git commit -m 'Make Memory Editor a data-first workspace'
          git push origin HEAD:ci/memory-editor-stack-f914594
