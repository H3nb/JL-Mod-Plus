                  },
                  enabled = !busy && valid,
                  modifier = Modifier.fillMaxWidth().sizeIn(minHeight = 48.dp),
              ) {
                  Text(stringResource(R.string.memory_editor_group_search))
              }
          }
          ''')
          text = block(text, '@Composable\nprivate fun GroupSearchPane(', '@Composable\nprivate fun UnknownBaselinePane(', group, 'GroupSearchPane')

          unknown_baseline = dedent('''
