name: Java ME LCDUI contracts

on:
  pull_request:
    branches: [alpha, main]
    paths:
      - 'app/src/main/java/javax/microedition/lcdui/Gauge.java'
      - 'app/src/main/java/javax/microedition/lcdui/List.java'
      - 'app/src/main/java/javax/microedition/lcdui/ChoiceGroup.java'
      - 'app/src/main/java/javax/microedition/lcdui/list/**'
      - 'app/src/androidTest/java/javax/microedition/lcdui/MidpStageBDeviceTest.java'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/midp/**'
      - '.github/workflows/java-me-lcdui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-me-lcdui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lcd-ui:
    name: LCDUI API ${{ matrix.api }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew

      - name: Execute LCDUI contract suite on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.midp.MidpStageBTestSuite :app:connectedEmulatorDebugAndroidTest

      - name: Upload actual device test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Java-ME-LCDUI-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
