name: Refresh reviewed screenshot baselines

on:
  pull_request:
    branches: [alpha]
    types: [synchronize]

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/localization-contract' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true
          submodules: recursive

      - name: Verify one-time source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "aaeeee027b4f8efa457d53053ef27237fcd5290f" ]]
          [[ "$(git diff --name-only HEAD^ HEAD)" == ".github/workflows/refresh-reviewed-screenshot-baselines.yml" ]]

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Generate and verify reviewed references
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --daemon --stacktrace :app:updateEmulatorDebugScreenshotTest
          cat > "${RUNNER_TEMP}/expected.txt" <<'EOF'
