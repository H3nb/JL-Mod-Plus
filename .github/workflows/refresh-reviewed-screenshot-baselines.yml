          git diff --name-only -- app/src/screenshotTestEmulatorDebug/reference | LC_ALL=C sort > "${RUNNER_TEMP}/actual.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/actual.txt"
          [[ "$(wc -l < "${RUNNER_TEMP}/actual.txt")" -eq 24 ]]

      - name: Commit reviewed references and remove one-time workflow
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -- ".github/workflows/refresh-reviewed-screenshot-baselines.yml"
          git add -- app/src/screenshotTestEmulatorDebug/reference ".github/workflows/refresh-reviewed-screenshot-baselines.yml"
          cat > "${RUNNER_TEMP}/expected-staged.txt" <<'EOF'
