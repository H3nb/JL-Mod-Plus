name: Profile Redundancy Cleanup (one-off)

on:
  push:
    branches:
      - fix/profile-manager

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-manager
          persist-credentials: true
          submodules: recursive
          fetch-depth: 1

      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Align tests and remove unused label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('app/src/androidTest/java/ru/playsoftware/j2meloader/config/ConfigComposeTest.kt')
          text = test.read_text()
          old = 'composeRule.onNodeWithText("Choose or manage templates").performClick()'
          replacements = [
              'composeRule.onNodeWithText("Built-In Settings").performClick()',
              'composeRule.onAllNodesWithText("Nokia Classic")[0].performClick()',
              None,
              'composeRule.onNodeWithText("Custom").performClick()',
          ]
          for replacement in replacements:
              index = text.find(old)
              if index < 0:
                  raise SystemExit('Expected profile manager test entry point not found')
              if replacement is None:
                  text = text[:index] + 'composeRule.onNodeWithText("Choose or manage templates").assertDoesNotExist()' + text[index + len(old):]
              else:
                  text = text[:index] + replacement + text[index + len(old):]
          test.write_text(text)

          strings = Path('app/src/main/res/values/strings_config_redesign.xml')
          text = strings.read_text()
          line = '    <string name="profile_choose_or_manage">Choose or manage templates</string>\n'
          if line not in text:
              raise SystemExit('Expected redundant profile string not found')
          strings.write_text(text.replace(line, ''))
          PY

      - name: Record final Quick screenshots
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Commit intended cleanup only
        shell: bash
        run: |
          set -euo pipefail
          dark='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/config/ConfigScreenshotTestKt/ConfigQuickDarkScreenshot_Config quick dark_758f3757_0.png'
          light='app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/config/ConfigScreenshotTestKt/ConfigQuickScreenshot_Config quick light_dc46fefc_0.png'
          git add -- \
            app/src/androidTest/java/ru/playsoftware/j2meloader/config/ConfigComposeTest.kt \
            app/src/main/res/values/strings_config_redesign.xml \
            "$dark" "$light"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(profile): align streamlined profile flow [skip ci] [redundancy-bot]'
          git push origin HEAD:fix/profile-manager
