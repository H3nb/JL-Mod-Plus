name: Enhanced Icon Quality Benchmark

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/icon-quality-benchmark.yml'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/LibraryComposeBridge.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/LibraryIconPresentation.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/applist/LibraryIconBenchmarkProbeTest.kt'
      - 'scripts/icon-quality/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit or branch in this repository'
        required: true
        default: 'alpha'
        type: string
      parity_mode:
        description: 'strict fails on pixel/presentation differences; review reports them'
        required: true
        default: strict
        type: choice
        options: [strict, review]

permissions:
  contents: read

concurrency:
  group: icon-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Icon CPU, allocations and visual parity
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      HEAD_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ICON_PARITY_MODE: ${{ github.event_name == 'pull_request' && 'strict' || inputs.parity_mode }}
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REVISION }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_REVISION }}
          path: baseline
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Install NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify probe and reporting scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n candidate/scripts/icon-quality/run.sh
          python3 -m py_compile candidate/scripts/icon-quality/compare.py
          python3 -B -m unittest discover -s candidate/scripts/tests -p 'test_icon_quality_*.py' -v

      - name: Run source-identical probe on both revisions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash candidate/scripts/icon-quality/run.sh

      - name: Upload visual gallery and benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enhanced-icon-quality
          path: ci-artifacts/icon-quality/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
