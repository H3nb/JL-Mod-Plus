name: LCDUI lifecycle runtime validation (temporary)

on:
  push:
    branches:
      - fix/lcdui-presentation-lifecycle
    paths:
      - '.github/workflows/lcdui-runtime-validation.yml'
      - 'app/src/main/java/javax/microedition/lcdui/**'

permissions:
  contents: read

jobs:
  lifecycle-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Provision native toolchain and KVM
        run: |
          chmod +x gradlew
          sdkmanager 'ndk;30.0.16248370' >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute lifecycle fixtures on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/lcdui-runtime-contracts.sh

      - name: Collect Android evidence
        if: always()
        run: mkdir -p ci-artifacts/lcdui && timeout 20s adb logcat -d -v threadtime > ci-artifacts/lcdui/logcat.txt 2>&1 || true

      - name: Upload focused Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcdui-lifecycle-runtime-evidence
          path: ci-artifacts/lcdui/
          if-no-files-found: warn
          retention-days: 7
