name: Profile UI Backend Cleanup (one-off)

on:
  push:
    branches:
      - fix/profile-manager

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-manager
          persist-credentials: true
          fetch-depth: 1

      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Remove obsolete profile presentation events
        run: |
          python3 - <<'PY'
          from pathlib import Path

          events = Path('app/src/main/java/ru/playsoftware/j2meloader/config/ConfigFormEvents.java')
          text = events.read_text()
          blocks = [
              '''\n\t/** Opens the existing profile-load flow from the General destination. */\n\tdefault void onUseProfile() {\n\t}\n''',
              '''\n\t/** Opens profile template management from the General destination. */\n\tdefault void onManageProfiles() {\n\t}\n''',
              '''\n\tdefault void onSaveTemplate(@NonNull String name) {\n\t}\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit(f'Expected exactly one ConfigFormEvents block: {block!r}')
              text = text.replace(block, '\n')
          events.write_text(text)

          activity = Path('app/src/main/java/ru/playsoftware/j2meloader/config/ConfigActivity.java')
          text = activity.read_text()
          blocks = [
              '''\n\t\t@Override\n\t\tpublic void onUseProfile() {\n\t\t\tshowLoadProfile();\n\t\t}\n''',
              '''\n\t\t@Override\n\t\tpublic void onManageProfiles() {\n\t\t\tstartActivity(new Intent(ConfigActivity.this, ProfilesActivity.class));\n\t\t}\n''',
              '''\n\t\t@Override\n\t\tpublic void onSaveTemplate(@NonNull String name) {\n\t\t\tsaveTemplate(name);\n\t\t}\n''',
              '''\n\tprivate void saveTemplate(@NonNull String rawName) {\n\t\tString name = rawName.trim();\n\t\tif (name.isEmpty() || findProfile(name) != null) {\n\t\t\tThemedToast.show(this, R.string.profile_name_exists, Toast.LENGTH_SHORT);\n\t\t\treturn;\n\t\t}\n\t\ttry {\n\t\t\tsaveParams();\n\t\t\tProfile profile = new Profile(name);\n\t\t\tProfilesManager.saveSnapshot(profile, configDir.getPath());\n\t\t\tProfilesManager.load(profile, configDir.getPath(), true, true);\n\t\t\tsetProfileOrigin(null);\n\t\t\tloadParams(true);\n\t\t} catch (IOException e) {\n\t\t\tLog.e(TAG, "saveTemplate: " + name, e);\n\t\t\tThemedToast.show(this, R.string.profile_template_operation_failed, Toast.LENGTH_SHORT);\n\t\t}\n\t}\n''',
              '''\n\tprivate void showLoadProfile() {\n\t\tif (keylayoutFile == null) {\n\t\t\treturn;\n\t\t}\n\t\tLoadProfileAlert.newInstance(keylayoutFile.getParent())\n\t\t\t\t.show(getSupportFragmentManager(), "load_profile");\n\t}\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit(f'Expected exactly one ConfigActivity block: {block[:80]!r}')
              text = text.replace(block, '\n')
          activity.write_text(text)
          PY

      - name: Compile main sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileEmulatorDebugKotlin :app:compileEmulatorDebugJavaWithJavac

      - name: Commit backend cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/profile-ui-backend-cleanup-once.yml
          git add \
            app/src/main/java/ru/playsoftware/j2meloader/config/ConfigFormEvents.java \
            app/src/main/java/ru/playsoftware/j2meloader/config/ConfigActivity.java
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(profile): remove obsolete presentation events [skip ci]'
          git push origin HEAD:fix/profile-manager
