name: Workflow and helper checks

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Source revision selected by the trusted caller'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Workflow and helper checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out selected sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Check workflows and helpers before Android setup
        run: bash scripts/check-workflows.sh
