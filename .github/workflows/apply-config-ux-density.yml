name: Apply config UX density

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
          submodules: recursive

      - name: Apply compact config redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              text = p.read_text()
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {pattern[:100]!r}, found {count}")
              p.write_text(out)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Remove the separate global Profiles entry. Keep the host callback for compatibility,
          # but make Config the visible entry point for template management.
          settings = "app/src/main/java/ru/playsoftware/j2meloader/settings/SettingsComposeBridge.kt"
          sub_once(
              settings,
              r'''\n                if \(state\.showProfiles\) \{\n                    item \{\n                        SettingsActionRow\(\n                            title = stringResource\(R\.string\.profiles\),\n                            onClick = actions::onOpenProfiles,\n                        \)\n                    \}\n                \}\n''',
              "\n",
          )

          # Let Config open the existing profile manager directly.
          events = "app/src/main/java/ru/playsoftware/j2meloader/config/ConfigFormEvents.java"
          replace_once(
              events,
              '''\t/** Opens the existing profile-save flow from the Quick destination. */\n\tdefault void onSaveAsProfile() {\n\t}\n''',
              '''\t/** Opens the existing profile-save flow from the General destination. */\n\tdefault void onSaveAsProfile() {\n\t}\n\n\t/** Opens profile template management from the General destination. */\n\tdefault void onManageProfiles() {\n\t}\n''',
          )
          replace_once(
              events,
              'Opens the existing profile-load flow from the Quick destination.',
              'Opens the existing profile-load flow from the General destination.',
          )

          activity = "app/src/main/java/ru/playsoftware/j2meloader/config/ConfigActivity.java"
          replace_once(
              activity,
              '''\t\t@Override\n\t\tpublic void onSaveAsProfile() {\n\t\t\tshowSaveProfile();\n\t\t}\n\n\t};\n''',
              '''\t\t@Override\n\t\tpublic void onSaveAsProfile() {\n\t\t\tshowSaveProfile();\n\t\t}\n\n\t\t@Override\n\t\tpublic void onManageProfiles() {\n\t\t\tstartActivity(new Intent(ConfigActivity.this, ProfilesActivity.class));\n\t\t}\n\n\t};\n''',
          )

          # Add an explicit built-in profile row to the profile manager. This separates
          # immutable app defaults from the user-selected default template policy.
          profiles = "app/src/main/java/ru/playsoftware/j2meloader/config/ProfilesComposeBridge.kt"
          replace_once(
              profiles,
              '''data class ProfileUiItem(\n    val name: String,\n    val isDefault: Boolean,\n    val canEdit: Boolean,\n)\n''',
              '''data class ProfileUiItem(\n    val name: String,\n    val isDefault: Boolean,\n    val canEdit: Boolean,\n    val isBuiltIn: Boolean = false,\n)\n''',
          )
          replace_once(
              profiles,
              '''interface ProfilesActions {\n    fun onBack()\n    fun onCreate(name: String)\n    fun onSetDefault(name: String)\n''',
              '''interface ProfilesActions {\n    fun onBack()\n    fun onCreate(name: String)\n    fun onSetBuiltInDefault()\n    fun onSetDefault(name: String)\n''',
          )
          replace_once(
              profiles,
              '''        state = ProfilesUiState(\n            profiles = profiles.sorted().map { profile ->\n                ProfileUiItem(\n                    name = profile.name,\n                    isDefault = profile.name == defaultName,\n                    canEdit = profile.hasConfig() || profile.hasOldConfig(),\n                )\n            },\n        )\n''',
              '''        state = ProfilesUiState(\n            profiles = listOf(\n                ProfileUiItem(\n                    name = "",\n                    isDefault = defaultName == null,\n                    canEdit = false,\n                    isBuiltIn = true,\n                ),\n            ) + profiles.sorted().map { profile ->\n                ProfileUiItem(\n                    name = profile.name,\n                    isDefault = profile.name == defaultName,\n                    canEdit = profile.hasConfig() || profile.hasOldConfig(),\n                )\n            },\n        )\n''',
          )
          replace_once(
              profiles,
              '''            onDefault = { actions.onSetDefault(profile.name) },\n''',
              '''            onDefault = {\n                if (profile.isBuiltIn) actions.onSetBuiltInDefault() else actions.onSetDefault(profile.name)\n            },\n''',
          )
          sub_once(
              profiles,
              r'''@Composable\nprivate fun ProfileRow\(profile: ProfileUiItem, onClick: \(\) -> Unit\) \{.*?\n\}\n\n@Composable\ninternal fun ProfileActionsDialog''',
              '''@Composable\nprivate fun ProfileRow(profile: ProfileUiItem, onClick: () -> Unit) {\n    val displayName = if (profile.isBuiltIn) {\n        stringResource(R.string.profile_builtin_settings)\n    } else {\n        profile.name\n    }\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .clickable(onClick = onClick)\n            .padding(horizontal = 16.dp, vertical = 10.dp),\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        Column(modifier = Modifier.weight(1f)) {\n            Text(\n                text = displayName,\n                fontWeight = if (profile.isDefault) FontWeight.SemiBold else FontWeight.Normal,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )\n            if (profile.isBuiltIn || profile.isDefault) {\n                Text(\n                    text = stringResource(\n                        if (profile.isBuiltIn) R.string.profile_builtin_settings_summary\n                        else R.string.profile_default_template_summary,\n                    ),\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis,\n                )\n            }\n        }\n        if (profile.isDefault) {\n            Text(\n                text = stringResource(R.string.profile_default_badge_short),\n                style = MaterialTheme.typography.labelMedium,\n                color = MaterialTheme.colorScheme.primary,\n                modifier = Modifier.padding(horizontal = 8.dp),\n            )\n        }\n        Icon(\n            painter = painterResource(R.drawable.ic_more_vert),\n            contentDescription = stringResource(R.string.more),\n            tint = MaterialTheme.colorScheme.onSurfaceVariant,\n        )\n    }\n}\n\n@Composable\ninternal fun ProfileActionsDialog''',
              flags=re.S,
          )
          sub_once(
              profiles,
              r'''internal fun ProfileActionsDialog\(\n    profile: ProfileUiItem,\n    onDismiss: \(\) -> Unit,\n    onDefault: \(\) -> Unit,\n    onEdit: \(\) -> Unit,\n    onRename: \(\) -> Unit,\n    onDelete: \(\) -> Unit,\n\) \{.*?\n\}\n\n@Composable\nprivate fun ProfileDialogAction''',
              '''internal fun ProfileActionsDialog(\n    profile: ProfileUiItem,\n    onDismiss: () -> Unit,\n    onDefault: () -> Unit,\n    onEdit: () -> Unit,\n    onRename: () -> Unit,\n    onDelete: () -> Unit,\n) {\n    val displayName = if (profile.isBuiltIn) {\n        stringResource(R.string.profile_builtin_settings)\n    } else {\n        profile.name\n    }\n    AlertDialog(\n        onDismissRequest = onDismiss,\n        title = { Text(displayName, maxLines = 1, overflow = TextOverflow.Ellipsis) },\n        text = {\n            Column {\n                if (!profile.isDefault) {\n                    ProfileDialogAction(R.string.set_as_default, onDismiss, onDefault)\n                }\n                if (!profile.isBuiltIn && profile.canEdit) {\n                    ProfileDialogAction(R.string.edit, onDismiss, onEdit)\n                }\n                if (!profile.isBuiltIn) {\n                    ProfileDialogAction(R.string.action_context_rename, onDismiss, onRename)\n                    ProfileDialogAction(R.string.action_context_delete, onDismiss, onDelete)\n                }\n            }\n        },\n        confirmButton = {},\n    )\n}\n\n@Composable\nprivate fun ProfileDialogAction''',
              flags=re.S,
          )

          profiles_activity = "app/src/main/java/ru/playsoftware/j2meloader/config/ProfilesActivity.java"
          replace_once(
              profiles_activity,
              '''\t\t\t@Override\n\t\t\tpublic void onSetDefault(@NonNull String name) {\n''',
              '''\t\t\t@Override\n\t\t\tpublic void onSetBuiltInDefault() {\n\t\t\t\tpreferences.edit().remove(PREF_DEFAULT_PROFILE).apply();\n\t\t\t\trefreshProfiles();\n\t\t\t}\n\n\t\t\t@Override\n\t\t\tpublic void onSetDefault(@NonNull String name) {\n''',
          )

          compose = "app/src/main/java/ru/playsoftware/j2meloader/config/ConfigComposeBridge.kt"
          replace_once(
              compose,
              '''                    .verticalScroll(scrollState)\n                    .padding(horizontal = 12.dp, vertical = 12.dp),\n                verticalArrangement = Arrangement.spacedBy(12.dp),\n''',
              '''                    .verticalScroll(scrollState)\n                    .padding(horizontal = 12.dp, vertical = 8.dp),\n                verticalArrangement = Arrangement.spacedBy(8.dp),\n''',
          )
          replace_once(
              compose,
              '''    Column(modifier = modifier, verticalArrangement = Arrangement.spacedBy(12.dp)) {\n''',
              '''    Column(modifier = modifier, verticalArrangement = Arrangement.spacedBy(10.dp)) {\n''',
          )

          # Compact profile summary: one tappable row plus concise actions, no oversized card/button stack.
          sub_once(
              compose,
              r'''@Composable\nprivate fun ProfileStatusCard\(status: ConfigUiState\.ProfileStatus, events: ConfigFormEvents\) \{.*?\n\}\n\n@Composable\nprivate fun MediaDestination''',
              '''@Composable\nprivate fun ProfileStatusCard(status: ConfigUiState.ProfileStatus, events: ConfigFormEvents) {\n    val active = status.activeProfile\n    val matched = active != null || status.builtInDefault\n    val title = when {\n        active != null -> active\n        status.builtInDefault -> stringResource(R.string.profile_builtin_settings)\n        else -> stringResource(R.string.profile_custom)\n    }\n    val summary = when {\n        active != null -> stringResource(R.string.profile_active_summary)\n        status.builtInDefault -> stringResource(R.string.profile_builtin_settings_summary)\n        else -> stringResource(R.string.profile_custom_summary)\n    }\n\n    Surface(\n        modifier = Modifier.fillMaxWidth(),\n        shape = MaterialTheme.shapes.large,\n        color = MaterialTheme.colorScheme.surfaceContainerLow,\n    ) {\n        Column {\n            Row(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .clickable(onClick = events::onUseProfile)\n                    .padding(horizontal = 14.dp, vertical = 10.dp),\n                verticalAlignment = Alignment.CenterVertically,\n            ) {\n                Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(1.dp)) {\n                    Text(\n                        text = stringResource(R.string.profiles),\n                        style = MaterialTheme.typography.labelMedium,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    )\n                    Text(\n                        text = title,\n                        style = MaterialTheme.typography.titleMedium,\n                        color = MaterialTheme.colorScheme.onSurface,\n                    )\n                    Text(\n                        text = summary,\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    )\n                }\n                Text(\n                    text = stringResource(if (matched) R.string.profile_change else R.string.profile_use),\n                    color = MaterialTheme.colorScheme.primary,\n                    style = MaterialTheme.typography.labelLarge,\n                )\n            }\n            Row(\n                modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp, vertical = 2.dp),\n                horizontalArrangement = Arrangement.End,\n            ) {\n                if (!matched) {\n                    TextButton(onClick = events::onSaveAsProfile) {\n                        Text(stringResource(R.string.profile_save_as))\n                    }\n                }\n                TextButton(onClick = events::onManageProfiles) {\n                    Text(stringResource(R.string.profile_manage_templates))\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun MediaDestination''',
              flags=re.S,
          )

          # Replace legacy form-like group/card chrome with compact grouped settings.
          sub_once(
              compose,
              r'''@Composable\nprivate fun ConfigCard\(\n    title: String,\n    content: @Composable ColumnScope\.\(\) -> Unit,\n\) \{.*?\n\}\n\n@Composable\nprivate fun ConfigRow''',
              '''@Composable\nprivate fun ConfigCard(\n    title: String,\n    content: @Composable ColumnScope.() -> Unit,\n) {\n    Column(verticalArrangement = Arrangement.spacedBy(5.dp)) {\n        Text(\n            text = title,\n            style = MaterialTheme.typography.titleSmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n            modifier = Modifier.padding(horizontal = 4.dp),\n        )\n        Surface(\n            modifier = Modifier.fillMaxWidth(),\n            shape = MaterialTheme.shapes.large,\n            color = MaterialTheme.colorScheme.surfaceContainerLow,\n        ) {\n            Column(content = content)\n        }\n    }\n}\n\n@Composable\nprivate fun ConfigRow''',
              flags=re.S,
          )
          sub_once(
              compose,
              r'''@Composable\nprivate fun ConfigRow\(\n    label: String,\n    content: @Composable \(\) -> Unit,\n\) \{.*?\n\}\n\n@Composable\nprivate fun CompactTextField''',
              '''@Composable\nprivate fun ConfigRow(\n    label: String,\n    content: @Composable () -> Unit,\n) {\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .heightIn(min = 52.dp)\n            .padding(horizontal = 14.dp, vertical = 5.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        Text(\n            text = label,\n            modifier = Modifier.weight(1f),\n            color = MaterialTheme.colorScheme.onSurface,\n            style = MaterialTheme.typography.bodyLarge,\n        )\n        Box(modifier = Modifier.weight(0.9f), contentAlignment = Alignment.CenterEnd) {\n            content()\n        }\n    }\n}\n\n@Composable\nprivate fun CompactTextField''',
              flags=re.S,
          )

          # Main-screen numeric values become simple trailing values; keyboard fields only appear in dialogs.
          sub_once(
              compose,
              r'''@Composable\nprivate fun CompactTextField\(.*?\n\}\n\n@Composable\ninternal fun ConfigNumberDialog''',
              '''@Composable\nprivate fun CompactTextField(\n    value: String,\n    label: String,\n    keyboardType: KeyboardType,\n    modifier: Modifier = Modifier,\n    dialogTitle: String = label,\n    showLabel: Boolean = true,\n    valueSuffix: String? = null,\n    onValueChange: (String) -> Unit,\n) {\n    var dialogVisible by remember(value) { mutableStateOf(false) }\n    val shownValue = buildString {\n        append(value.ifEmpty { label })\n        if (value.isNotEmpty() && valueSuffix != null) append(" ").append(valueSuffix)\n    }\n\n    Column(\n        modifier = modifier\n            .fillMaxWidth()\n            .heightIn(min = 36.dp)\n            .clickable { dialogVisible = true },\n        horizontalAlignment = Alignment.End,\n        verticalArrangement = Arrangement.Center,\n    ) {\n        if (showLabel) {\n            Text(\n                text = label,\n                style = MaterialTheme.typography.labelSmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )\n        }\n        Text(\n            text = shownValue,\n            style = MaterialTheme.typography.bodyMedium,\n            color = MaterialTheme.colorScheme.primary,\n            maxLines = 1,\n            overflow = TextOverflow.Ellipsis,\n        )\n    }\n\n    if (dialogVisible) {\n        ConfigNumberDialog(\n            title = dialogTitle,\n            initialValue = value,\n            label = label.takeIf { showLabel },\n            keyboardType = keyboardType,\n            valueSuffix = valueSuffix,\n            onDismissRequest = { dialogVisible = false },\n            onConfirm = { nextValue ->\n                dialogVisible = false\n                onValueChange(nextValue)\n            },\n        )\n    }\n}\n\n@Composable\ninternal fun ConfigNumberDialog''',
              flags=re.S,
          )

          sub_once(
              compose,
              r'''@Composable\nprivate fun SliderField\(.*?\n\}\n\n@Composable\n@OptIn\(ExperimentalMaterial3Api::class\)\ninternal fun ConfigSliderDialog''',
              '''@Composable\nprivate fun SliderField(\n    value: Int,\n    valueRange: IntRange,\n    onSelected: (Int) -> Unit,\n) {\n    var dialogVisible by remember(value) { mutableStateOf(false) }\n    Box(\n        modifier = Modifier\n            .fillMaxWidth()\n            .heightIn(min = 36.dp)\n            .clickable { dialogVisible = true },\n        contentAlignment = Alignment.CenterEnd,\n    ) {\n        Text(\n            text = value.toString(),\n            style = MaterialTheme.typography.bodyMedium,\n            color = MaterialTheme.colorScheme.primary,\n        )\n    }\n    if (dialogVisible) {\n        ConfigSliderDialog(\n            title = stringResource(R.string.PREF_VK_ALPHA),\n            initialValue = value,\n            valueRange = valueRange,\n            onDismissRequest = { dialogVisible = false },\n            onConfirm = { nextValue ->\n                dialogVisible = false\n                onSelected(nextValue)\n            },\n        )\n    }\n}\n\n@Composable\n@OptIn(ExperimentalMaterial3Api::class)\ninternal fun ConfigSliderDialog''',
              flags=re.S,
          )

          sub_once(
              compose,
              r'''@Composable\nprivate fun ChoiceField\(.*?\n\}\n\n@Composable\ninternal fun ConfigChoiceDialog''',
              '''@Composable\nprivate fun ChoiceField(\n    selected: String,\n    options: List<String>,\n    dialogTitle: String,\n    onSelected: (Int) -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    var dialogVisible by remember(selected, options) { mutableStateOf(false) }\n    val enabled = options.isNotEmpty()\n    Box(\n        modifier = modifier\n            .fillMaxWidth()\n            .heightIn(min = 36.dp)\n            .clickable(enabled = enabled) { dialogVisible = true },\n        contentAlignment = Alignment.CenterEnd,\n    ) {\n        Text(\n            text = selected,\n            maxLines = 2,\n            overflow = TextOverflow.Ellipsis,\n            color = if (enabled) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant,\n            style = MaterialTheme.typography.bodyMedium,\n        )\n    }\n    if (dialogVisible) {\n        ConfigChoiceDialog(\n            title = dialogTitle,\n            selected = selected,\n            options = options,\n            onDismissRequest = { dialogVisible = false },\n            onSelected = { index ->\n                dialogVisible = false\n                onSelected(index)\n            },\n        )\n    }\n}\n\n@Composable\ninternal fun ConfigChoiceDialog''',
              flags=re.S,
          )

          sub_once(
              compose,
              r'''@Composable\nprivate fun SwitchRow\(.*?\n\}\n\n@Composable\nprivate fun ColorRow''',
              '''@Composable\nprivate fun SwitchRow(\n    title: String,\n    checked: Boolean,\n    onCheckedChange: (Boolean) -> Unit,\n) {\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .heightIn(min = 52.dp)\n            .clickable { onCheckedChange(!checked) }\n            .padding(horizontal = 14.dp, vertical = 4.dp),\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        Text(\n            text = title,\n            modifier = Modifier.weight(1f),\n            style = MaterialTheme.typography.bodyLarge,\n        )\n        Switch(checked = checked, onCheckedChange = onCheckedChange)\n    }\n}\n\n@Composable\nprivate fun ColorRow''',
              flags=re.S,
          )

          sub_once(
              compose,
              r'''@Composable\nprivate fun ColorRow\(.*?\n\}\n\nprivate fun normalizeScaleRatio''',
              '''@Composable\nprivate fun ColorRow(\n    label: String,\n    value: String,\n    onPick: () -> Unit,\n) {\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .heightIn(min = 54.dp)\n            .clickable(role = Role.Button, onClick = onPick)\n            .padding(horizontal = 14.dp, vertical = 5.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        Text(\n            text = label,\n            modifier = Modifier.weight(1f),\n            style = MaterialTheme.typography.bodyLarge,\n        )\n        Text(\n            text = value.ifEmpty { "—" },\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n        )\n        Box(\n            modifier = Modifier\n                .size(28.dp)\n                .clip(RoundedCornerShape(7.dp))\n                .background(parseColor(value)),\n        )\n    }\n}\n\nprivate fun normalizeScaleRatio''',
              flags=re.S,
          )

          sub_once(
              compose,
              r'''@Composable\nprivate fun AdvancedSettingsRow\(.*?\n\}\n\n@Composable\nprivate fun ConfigCard''',
              '''@Composable\nprivate fun AdvancedSettingsRow(\n    expanded: Boolean,\n    onExpandedChange: (Boolean) -> Unit,\n) {\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .heightIn(min = 48.dp)\n            .clickable { onExpandedChange(!expanded) }\n            .padding(horizontal = 14.dp, vertical = 4.dp),\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        Text(\n            text = stringResource(R.string.config_advanced_settings),\n            modifier = Modifier.weight(1f),\n            color = MaterialTheme.colorScheme.primary,\n            style = MaterialTheme.typography.bodyMedium,\n        )\n        Text(\n            text = if (expanded) "−" else "+",\n            style = MaterialTheme.typography.titleMedium,\n            color = MaterialTheme.colorScheme.primary,\n        )\n    }\n}\n\n@Composable\nprivate fun ConfigCard''',
              flags=re.S,
          )

          # Give the three-font-size editor breathing room inside the group, but much less than before.
          replace_once(
              compose,
              '''        Row(horizontalArrangement = Arrangement.spacedBy(4.dp), modifier = Modifier.fillMaxWidth()) {\n''',
              '''        Row(\n            horizontalArrangement = Arrangement.spacedBy(8.dp),\n            modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 6.dp),\n        ) {\n''',
          )

          # Compact System Properties baseline while preserving the requested inline editor.
          replace_once(
              compose,
              '''            modifier = Modifier.fillMaxWidth(),\n            minLines = 8,\n            maxLines = 12,\n''',
              '''            modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),\n            minLines = 5,\n            maxLines = 8,\n''',
          )

          # Convert large outlined/full-width buttons into list-like actions.
          replace_once(
              compose,
              '''        OutlinedButton(\n            onClick = events::onKeyMappings,\n            modifier = Modifier.fillMaxWidth(),\n            shape = MaterialTheme.shapes.medium,\n        ) {\n            Text(stringResource(R.string.pref_map_keys))\n        }\n''',
              '''        SettingActionRow(\n            title = stringResource(R.string.pref_map_keys),\n            onClick = events::onKeyMappings,\n        )\n''',
          )
          replace_once(
              compose,
              '''        OutlinedButton(\n            onClick = { onRequestAction(ConfigAction.ResetLayout) },\n            modifier = Modifier.fillMaxWidth(),\n            shape = MaterialTheme.shapes.medium,\n        ) {\n            Text(stringResource(R.string.RESET_LAYOUT_CMD))\n        }\n''',
              '''        SettingActionRow(\n            title = stringResource(R.string.RESET_LAYOUT_CMD),\n            destructive = true,\n            onClick = { onRequestAction(ConfigAction.ResetLayout) },\n        )\n''',
          )
          replace_once(
              compose,
              '''        OutlinedButton(\n            onClick = events::onEncodingPicker,\n            modifier = Modifier.fillMaxWidth(),\n            shape = MaterialTheme.shapes.medium,\n        ) {\n            Text(stringResource(R.string.pref_encoding_title))\n        }\n''',
              '''        SettingActionRow(\n            title = stringResource(R.string.pref_encoding_title),\n            onClick = events::onEncodingPicker,\n        )\n''',
          )
          sub_once(
              compose,
              r'''        OutlinedButton\(\n            onClick = \{ onRequestAction\(ConfigAction\.ResetSettings\) \},.*?\n        \}\n        if \(showClearData\) \{\n            Button\(\n                onClick = \{ onRequestAction\(ConfigAction\.ClearData\) \},.*?\n            \}\n        \}\n''',
              '''        SettingActionRow(\n            title = stringResource(R.string.config_reset_all_settings),\n            summary = stringResource(R.string.config_reset_all_settings_summary),\n            destructive = true,\n            onClick = { onRequestAction(ConfigAction.ResetSettings) },\n        )\n        if (showClearData) {\n            SettingActionRow(\n                title = stringResource(R.string.config_delete_game_data),\n                summary = stringResource(R.string.config_delete_game_data_summary),\n                destructive = true,\n                emphasized = true,\n                onClick = { onRequestAction(ConfigAction.ClearData) },\n            )\n        }\n''',
              flags=re.S,
          )

          # Insert reusable compact action row before confirmation dialog.
          marker = '''@Composable\nprivate fun ConfigActionConfirmationDialog(\n'''
          p = Path(compose)
          text = p.read_text()
          if marker not in text:
              raise SystemExit("confirmation marker not found")
          action_row = '''@Composable\nprivate fun SettingActionRow(\n    title: String,\n    summary: String? = null,\n    destructive: Boolean = false,\n    emphasized: Boolean = false,\n    onClick: () -> Unit,\n) {\n    Surface(\n        modifier = Modifier.fillMaxWidth(),\n        color = if (emphasized) MaterialTheme.colorScheme.errorContainer else Color.Transparent,\n        shape = MaterialTheme.shapes.medium,\n    ) {\n        Column(\n            modifier = Modifier\n                .fillMaxWidth()\n                .heightIn(min = 52.dp)\n                .clickable(onClick = onClick)\n                .padding(horizontal = 14.dp, vertical = 8.dp),\n            verticalArrangement = Arrangement.Center,\n        ) {\n            Text(\n                text = title,\n                style = MaterialTheme.typography.bodyLarge,\n                color = when {\n                    emphasized -> MaterialTheme.colorScheme.onErrorContainer\n                    destructive -> MaterialTheme.colorScheme.error\n                    else -> MaterialTheme.colorScheme.onSurface\n                },\n            )\n            if (summary != null) {\n                Text(\n                    text = summary,\n                    style = MaterialTheme.typography.bodySmall,\n                    color = if (emphasized) {\n                        MaterialTheme.colorScheme.onErrorContainer\n                    } else {\n                        MaterialTheme.colorScheme.onSurfaceVariant\n                    },\n                )\n            }\n        }\n    }\n}\n\n'''
          p.write_text(text.replace(marker, action_row + marker, 1))

          # Strings: avoid calling the immutable baseline just "Default"; reserve Default for policy.
          en = Path("app/src/main/res/values/strings_config_redesign.xml")
          text = en.read_text().replace(
              '</resources>',
              '''    <string name="profile_manage_templates">Manage templates</string>\n    <string name="profile_builtin_settings">Built-in settings</string>\n    <string name="profile_builtin_settings_summary">JL-Mod Plus factory configuration</string>\n    <string name="profile_default_template_summary">Default template for new games</string>\n    <string name="profile_default_badge_short">Default</string>\n</resources>''',
          )
          en.write_text(text)
          ind = Path("app/src/main/res/values-in/strings_config_redesign.xml")
          text = ind.read_text().replace(
              '</resources>',
              '''    <string name="profile_manage_templates">Kelola templat</string>\n    <string name="profile_builtin_settings">Pengaturan bawaan</string>\n    <string name="profile_builtin_settings_summary">Konfigurasi pabrik JL-Mod Plus</string>\n    <string name="profile_default_template_summary">Templat default untuk game baru</string>\n    <string name="profile_default_badge_short">Default</string>\n</resources>''',
          )
          ind.write_text(text)

          # Tests: Profiles disappear from Global Settings and built-in defaults can become policy default.
          settings_test = "app/src/androidTest/java/ru/playsoftware/j2meloader/settings/SettingsComposeTest.kt"
          replace_once(
              settings_test,
              '''        composeRule.onNodeWithText("Keep screen on").performClick()\n        composeRule.onNodeWithText("Profiles").performClick()\n        composeRule.onNodeWithText("Working directory").performClick()\n\n        assertEquals(listOf("light", "en", "pref_wakelock_switch"), actions.changes)\n        assertEquals(1, actions.profileClicks)\n''',
              '''        composeRule.onNodeWithText("Keep screen on").performClick()\n        composeRule.onNodeWithText("Profiles").assertDoesNotExist()\n        composeRule.onNodeWithText("Working directory").performClick()\n\n        assertEquals(listOf("light", "en", "pref_wakelock_switch"), actions.changes)\n        assertEquals(0, actions.profileClicks)\n''',
          )

          profiles_test = "app/src/androidTest/java/ru/playsoftware/j2meloader/config/ProfilesComposeTest.kt"
          replace_once(
              profiles_test,
              '''                            ProfileUiItem("Playable", isDefault = false, canEdit = true),\n                            ProfileUiItem("Empty", isDefault = false, canEdit = false),\n''',
              '''                            ProfileUiItem("", isDefault = false, canEdit = false, isBuiltIn = true),\n                            ProfileUiItem("Playable", isDefault = false, canEdit = true),\n                            ProfileUiItem("Empty", isDefault = false, canEdit = false),\n''',
          )
          replace_once(
              profiles_test,
              '''        var defaulted: String? = null\n''',
              '''        var builtInDefaultCalls = 0\n        var defaulted: String? = null\n''',
          )
          replace_once(
              profiles_test,
              '''        override fun onCreate(name: String) { created = name }\n        override fun onSetDefault(name: String) { defaulted = name }\n''',
              '''        override fun onCreate(name: String) { created = name }\n        override fun onSetBuiltInDefault() { builtInDefaultCalls++ }\n        override fun onSetDefault(name: String) { defaulted = name }\n''',
          )
          # Add coverage for built-in/default semantics.
          insert = '''\n    @Test\n    fun builtInSettingsAreDistinctFromDefaultTemplatePolicy() {\n        val actions = RecordingProfilesActions()\n        setProfilesContent(actions)\n\n        composeRule.onNodeWithText("Built-in settings").performClick()\n        composeRule.onNodeWithText("Set As Default").performClick()\n        assertEquals(1, actions.builtInDefaultCalls)\n\n        composeRule.onNodeWithText("Built-in settings").performClick()\n        composeRule.onNodeWithText("Rename").assertDoesNotExist()\n        composeRule.onNodeWithText("Delete").assertDoesNotExist()\n    }\n'''
          p = Path(profiles_test)
          text = p.read_text()
          needle = '\n    private fun setProfilesContent(actions: RecordingProfilesActions) {'
          if needle not in text:
              raise SystemExit("profiles test insertion point missing")
          p.write_text(text.replace(needle, insert + needle, 1))

          # Config UI test: management is visible in General.
          config_test = "app/src/androidTest/java/ru/playsoftware/j2meloader/config/ConfigComposeTest.kt"
          replace_once(
              config_test,
              '''        composeRule.onNodeWithText("Use profile").performClick()\n        composeRule.onNodeWithText("Save as profile").performClick()\n        composeRule.onNodeWithText("Manage profiles").assertDoesNotExist()\n''',
              '''        composeRule.onNodeWithText("Use profile").performClick()\n        composeRule.onNodeWithText("Save as profile").performClick()\n        composeRule.onNodeWithText("Manage templates").assertExists()\n''',
          )

          # Screenshot reference comments/names still say Quick; leave filenames stable to avoid churn.
          PY

          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Update screenshot references and validate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug :dexlib:lintDebug :app:testEmulatorDebugUnitTest :app:validateEmulatorDebugScreenshotTest :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest

      - name: Commit redesign and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-config-ux-density.yml
          git add app/src/main app/src/androidTest app/src/screenshotTest app/src/screenshotTestEmulatorDebug/reference
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine config profile management and density'
          git push origin HEAD:ui/redesign-config
