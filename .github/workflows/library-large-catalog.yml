name: Library Large Catalog Runtime

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/library-large-catalog.yml'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/LibraryComposeBridge.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/LibraryControllerNavigation.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/LibrarySelectionState.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/applist/LibraryComposeTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library-scale:
    name: Virtualized 20k list/grid
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Install NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise 20k real Library items in list and grid
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew --daemon --stacktrace --profile \
              -PjlmodRuntimeTestAbi=x86_64 \
              :app:installEmulatorDebug :app:assembleEmulatorDebugAndroidTest
            mkdir -p ci-artifacts/library-scale
            mapfile -t apks < <(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print)
            test "${#apks[@]}" -eq 1
            adb install -r -t "${apks[0]}"
            runner="$(adb shell pm list instrumentation | tr -d '\r' | \
              sed -n 's/^instrumentation:\([^ ]*\) (target=io\.github\.h3nb\.jlmodplus\.debug)$/\1/p')"
            test -n "$runner"
            selector='io.github.h3nb.jlmodplus.applist.LibraryComposeTest#twentyThousandAppsRemainVirtualizedInListAndGrid'
            adb shell am instrument -w -r -e class "$selector" "$runner" \
              > ci-artifacts/library-scale/instrumentation.txt 2>&1 || {
                cat ci-artifacts/library-scale/instrumentation.txt
                exit 1
              }
            cat ci-artifacts/library-scale/instrumentation.txt
            python3 scripts/runtime-smoke-results.py \
              --log ci-artifacts/library-scale/instrumentation.txt \
              --output ci-artifacts/library-scale/verified.txt "$selector"

      - name: Save runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-scale-runtime
          path: ci-artifacts/library-scale/
          if-no-files-found: warn
          retention-days: 7
