name: Apply M3G warning-zero patch

on:
  push:
    branches:
      - agent/m3g-arm64-warning-zero-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m3g-arm64-warning-zero-v2
          fetch-depth: 0
      - name: Apply deterministic source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('.github/apply_m3g_warning_zero.py')
          text = script.read_text()
          ambiguous = '    ("m3gClassName((M3GClass) obj->classID), (unsigned) obj);", "m3gClassName((M3GClass) obj->classID), (void *) obj);"),\n'
          if text.count(ambiguous) != 1:
              raise SystemExit('temporary edit script: ambiguous tuple not found exactly once')
          script.write_text(text.replace(ambiguous, ''))
          PY
          python3 .github/apply_m3g_warning_zero.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/m3g/src/m3g_object.c')
          text = p.read_text()
          old = '''    M3G_LOG2(M3G_LOG_STAGES,
                     "Animating %s 0x%08X\\n",
                     m3gClassName((M3GClass) obj->classID), (unsigned) obj);'''
          new = '''    M3G_LOG2(M3G_LOG_STAGES,
                     "Animating %s %p\\n",
                     m3gClassName((M3GClass) obj->classID), (void *) obj);'''
          if text.count(old) != 1:
              raise SystemExit(f'm3g_object.c: expected one animate log, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/m3g
          git commit -m "Harden remaining M3G ARM64 handle and UB sites"
          git push origin HEAD:agent/m3g-arm64-warning-zero-v2
