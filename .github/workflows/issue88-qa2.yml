# Temporary runner for the second physical-device QA refinement; removed from the validated tree.
name: Issue 88 QA2 refinement

on:
  push:
    branches:
      - ui/harmonize-app-wide
    paths:
      - .github/workflows/issue88-qa2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for this workflow.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: true

      - name: Prepare branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin alpha
          if ! git merge-base --is-ancestor origin/alpha HEAD; then
            echo 'PR branch is behind alpha; integrate alpha before applying this refinement.' >&2
            exit 1
          fi

      - name: Apply physical-device QA refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/issue88_qa2.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt')
          text = path.read_text(encoding='utf-8')
          malformed = "append('\n')"
          corrected = "append('\\n')"
          count = text.count(malformed)
          if count != 2:
              raise SystemExit(f'expected two malformed generated newline literals, found {count}')
          path.write_text(text.replace(malformed, corrected), encoding='utf-8')
          PY

      - name: Refresh screenshot references
        run: ./gradlew --no-daemon --stacktrace :app:updateEmulatorDebugScreenshotTest

      - name: Validate refined UI and runtime policy
        env:
          JLMOD_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug
          :dexlib:lintDebug
          :app:testEmulatorDebugUnitTest
          :app:validateEmulatorDebugScreenshotTest
          :app:assembleEmulatorDebug
          :app:assembleEmulatorDebugAndroidTest

      - name: Final diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -R "skinLayerAvailable, statusBarEnabled, actionBarEnabled, displayCutoutEnabled" \
              app/src/main/java/javax/microedition/shell/MicroActivity.java; then
            echo 'SkinLayer still gates display cutout.' >&2
            exit 1
          fi
          grep -q 'alwaysShowLabel = false' app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt
          grep -q 'library_options_diagnostics_title' app/src/main/java/ru/playsoftware/j2meloader/applist/LibraryComposeBridge.kt
          grep -q 'LibraryInfoDialog.More' app/src/screenshotTest/kotlin/ru/playsoftware/j2meloader/applist/LibraryProfilesScreenshotTest.kt

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/issue88_qa2.py .github/workflows/issue88-qa2.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.' >&2
            exit 1
          fi
          git commit -m "refine Material 3 navigation and cutout QA"
          git push origin HEAD:ui/harmonize-app-wide
