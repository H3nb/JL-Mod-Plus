           */

          package io.github.h3nb.jlmodplus.input

          import android.view.InputDevice
          import java.util.Locale

          /**
           * Caches the stable calibration identity for one Android controller capability set.
           *
           * MotionEvent.source is deliberately excluded from the persistent identity: Android may report
           * HAT, stick, and trigger ranges under different compatible sources for the same physical device.
           * Device id remains only an in-process cache key and is invalidated by InputDevice callbacks.
           */
          class ControllerCapabilityCache {
              private val signatures = HashMap<Int, String>()

              fun signature(device: InputDevice, _source: Int): String = signature(device)

              fun signature(device: InputDevice): String {
                  return signatures[device.id] ?: buildSignature(device).also { signatures[device.id] = it }
              }

              fun invalidate(deviceId: Int) {
                  signatures.remove(deviceId)
              }

              fun clear() = signatures.clear()

              companion object {
                  /** Compatibility overload for existing Java/Kotlin call sites; source is non-identifying. */
                  @JvmStatic
                  fun buildSignature(device: InputDevice, _source: Int): String = buildSignature(device)

                  @JvmStatic
                  fun buildSignature(device: InputDevice): String = buildString {
                      append("descriptor=")
                      append(device.descriptor.orEmpty().ifBlank { "unknown" }.replace("|", "%7C"))
                      device.motionRanges
                          .sortedWith(
                              compareBy<InputDevice.MotionRange>(
                                  { it.axis },
                                  { it.source },
                                  { it.min },
                                  { it.max },
                                  { it.flat },
                                  { it.fuzz },
                                  { it.resolution },
                              ),
                          )
                          .forEach { range ->
                              append(";axis=")
                              append(range.axis)
                              append(',')
                              append(range.source)
                              append(',')
                              append(number(range.min))
                              append(',')
                              append(number(range.max))
                              append(',')
                              append(number(range.flat))
                              append(',')
                              append(number(range.fuzz))
                              append(',')
                              append(number(range.resolution))
                          }
                  }

                  private fun number(value: Float): String =
                      if (value.isFinite()) String.format(Locale.US, "%.6f", value) else "nan"
              }
          }
          ''')

          calibration = "app/src/main/java/io/github/h3nb/jlmodplus/input/GamepadCalibrationSession.kt"
          replace_exact(calibration, '''        if (requiredChannels.any {
                          it.isStick &&
                              ((ranges[it]?.min ?: 0.0f) >= 0.0f ||
                                  (ranges[it]?.max ?: 0.0f) <= 0.0f)
                      }) {
                      return invalidStep(StickProcessor.CalibrationIssue.INVALID_RANGE)
                  }
          ''', '''''')

          calibration_test = "app/src/test/java/io/github/h3nb/jlmodplus/input/GamepadCalibrationSessionTest.kt"
          replace_exact(calibration_test, '''    @Test
              fun invalidCandidateAndCancelDoNotOverwritePreviousProfile() {
          ''', '''    @Test
              fun offsetCenteredStickCalibrationDoesNotRequireZeroCrossing() {
                  val session = GamepadCalibrationSession(
                      neutralDurationMillis = 1L,
                      minimumSamples = 1,
                      requiredChannels = setOf(
                          CalibrationChannel.LEFT_X,
                          CalibrationChannel.LEFT_Y,
                      ),
                  )
                  val neutral = mapOf(
                      CalibrationChannel.LEFT_X to 127.0f,
                      CalibrationChannel.LEFT_Y to 127.0f,
                  )
                  assertEquals(CalibrationEvent.NEUTRAL_STARTED, session.observeNeutral(0L, neutral, true).event)
                  assertEquals(CalibrationEvent.NEUTRAL_READY, session.observeNeutral(1L, neutral, true).event)
                  session.observeRange(
                      mapOf(
                          CalibrationChannel.LEFT_X to 0.0f,
                          CalibrationChannel.LEFT_Y to 0.0f,
                      ),
                  )
                  session.observeRange(
                      mapOf(
                          CalibrationChannel.LEFT_X to 255.0f,
                          CalibrationChannel.LEFT_Y to 255.0f,
                      ),
                  )
                  assertEquals(CalibrationEvent.RANGE_ACCEPTED, session.finishSticks().event)
                  val review = session.finishTriggers()
                  assertEquals(CalibrationEvent.REVIEW_READY, review.event)
                  assertEquals(CalibrationPhase.REVIEW, review.phase)
                  assertNotNull(session.candidateProfile)
              }

              @Test
              fun invalidCandidateAndCancelDoNotOverwritePreviousProfile() {
          ''')

          ledger_adapter = "app/src/main/java/io/github/h3nb/jlmodplus/input/GuestKeyLedgerAdapter.kt"
          replace_exact(ledger_adapter, '''    /** Ends the current visibility generation and releases all outputs before the next one. */
              fun endVisibility() {
          ''', '''    /** True only while this exact producer currently owns a delivered/requested output set. */
              fun isActive(deviceId: String, sessionId: Long, kind: String, channel: String): Boolean =
                  ledger.isActive(SourceToken(deviceId, sessionId, kind, channel))

              /** Ends the current visibility generation and releases all outputs before the next one. */
              fun endVisibility() {
          ''')

          canvas = "app/src/main/java/javax/microedition/lcdui/Canvas.java"
          replace_exact(canvas, '''\t/** Optional controller-owned virtual pointer arbiter; null preserves the legacy touch path. */
          \tprivate volatile ControllerPointerConsumer controllerPointerConsumer;
          \t/** All host/keyboard/virtual-keypad key producers share this per-Canvas ledger. */
          ''', '''\t/** Optional controller-owned virtual pointer arbiter; null preserves the legacy touch path. */
          \tprivate volatile ControllerPointerConsumer controllerPointerConsumer;
          \t/** Callback state survives surface reuse, so lifecycle boundaries must be able to cancel it. */
          \tprivate ViewCallbacks viewCallbacks;
          \t/** All host/keyboard/virtual-keypad key producers share this per-Canvas ledger. */
          ''')

          replace_exact(canvas, '''\t\t\tViewCallbacks callback = new ViewCallbacks(innerView);
          \t\t\tinnerView.getHolder().addCallback(callback);
          \t\t\tinnerView.setOnTouchListener(callback);
