          ''', '''\t\t\tviewCallbacks = new ViewCallbacks(innerView);
          \t\t\tinnerView.getHolder().addCallback(viewCallbacks);
          \t\t\tinnerView.setOnTouchListener(viewCallbacks);
          \t\t\tinnerView.setOnKeyListener(viewCallbacks);
          ''')

          replace_exact(canvas, '''\t\tlayout = null;
          \t\tinnerView = null;
          \t}
          ''', '''\t\tlayout = null;
          \t\tinnerView = null;
          \t\tviewCallbacks = null;
          \t}
          ''')

          replace_exact(canvas, '''\tprivate void resetControllerBoundaryState() {
          \t\tskipLeftSoft = false;
          \t\tskipRightSoft = false;
          \t\tif (overlay != null) {
          ''', '''\tprivate void resetControllerBoundaryState() {
          \t\tskipLeftSoft = false;
          \t\tskipRightSoft = false;
          \t\tViewCallbacks callbacks = viewCallbacks;
          \t\tif (callbacks != null) callbacks.cancelPointerOwnership();
          \t\tif (overlay != null) {
          ''')

          replace_exact(canvas, '''\t\tpublic ViewCallbacks(View view) {
          \t\t\tmView = view;
          \t\t\toverlayView = ContextHolder.getActivity().findViewById(R.id.overlay);
          \t\t}

          \t\t@Override
          ''', '''\t\tpublic ViewCallbacks(View view) {
          \t\t\tmView = view;
          \t\t\toverlayView = ContextHolder.getActivity().findViewById(R.id.overlay);
          \t\t}

          \t\tprivate void cancelPointerOwnership() {
          \t\t\tControllerPointerConsumer pointerConsumer = controllerPointerConsumer;
          \t\t\tif (pointerConsumer != null) pointerConsumer.onPhysicalPointerCancelled();
          \t\t\toverlayPointers.clear();
          \t\t\tcontrollerPointers.clear();
          \t\t}

          \t\t@Override
          ''')

          replace_exact(canvas, '''\t\t\t} else {
          \t\t\t\t// Physical keyboard repeat is owned by Android. Do not replace its timing with the
          \t\t\t\t// virtual/analog ledger schedule; deliver the native repeat edge directly.
          \t\t\t\tif (overlay != null) overlay.keyRepeated(keyCode);
          \t\t\t\tpostKeyRepeated(keyCode);
          \t\t\t}
          ''', '''\t\t\t} else {
          \t\t\t\t// Android owns physical-key timing, but a repeat is valid only while the same
          \t\t\t\t// source still owns a guest DOWN. Host/modal boundaries may have released it.
          \t\t\t\tboolean overlayConsumed = overlay != null && overlay.keyRepeated(keyCode);
          \t\t\t\tif (!overlayConsumed && guestKeyLedger.isActive(
          \t\t\t\t\t\tInteger.toString(event.getDeviceId()), inputGeneration(),
