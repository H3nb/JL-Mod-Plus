# Temporary test workflow for H3nb/JL-Mod-Plus#179.
# Delete this file and .github/ci/pr179-audio-emulator.sh before merging.
name: PR 179 Audio Emulator (temporary)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [alpha]

permissions:
  contents: read

concurrency:
  group: pr179-audio-emulator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audio-emulator:
    if: >-
      github.event.pull_request.number == 179 &&
      github.event.pull_request.head.ref == 'fix/scalable-audio-resources' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Audio contracts (API ${{ matrix.api }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]

    steps:
      - name: Check out PR sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Provision NDK r30
        run: sdkmanager 'ndk;30.0.16248370' >/dev/null

      - name: Assemble native-enabled x86_64 app and test APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "JLMOD_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          ./gradlew --daemon --stacktrace --profile --configuration-cache --configuration-cache-problems=fail \
            -I scripts/audio-qualification.init.gradle \
            -PjlmodRuntimeTestAbi=x86_64 \
            :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute real Android audio instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/ci/pr179-audio-emulator.sh && if [ "${{ matrix.api }}" = "35" ]; then bash .github/ci/pr179-native-emulator.sh; fi

      - name: Upload audio emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr179-audio-emulator-api-${{ matrix.api }}
          path: ci-artifacts/pr179-audio/
          if-no-files-found: warn
          retention-days: 7
