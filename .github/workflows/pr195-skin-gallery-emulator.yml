name: PR195 Skin Gallery Emulator (temporary)

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/pr195-skin-gallery-emulator.yml'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/ControlSkinManagerComposeTest.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/ControlSkinManagerActivity.kt'

permissions:
  contents: read

jobs:
  gallery-ui:
    if: ${{ github.event.pull_request.number == 195 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute portrait and landscape editor UI test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.config.ControlSkinManagerComposeTest :app:connectedEmulatorDebugAndroidTest
      - name: Report executed UI tests and failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          print('XML reports:', len(paths))
          for path in paths:
              root = ET.parse(path).getroot()
              print('Report:', path, root.attrib)
              for case in root.iter('testcase'):
                  print('Case:', case.attrib)
                  for kind in ('failure', 'error', 'skipped'):
                      bad = case.find(kind)
                      if bad is not None:
                          print(kind, bad.attrib, (bad.text or '')[:12000])
          PY
      - name: Confirm UI test executed successfully
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          matching = [
              case for path in paths for case in ET.parse(path).getroot().iter('testcase')
              if case.attrib.get('name') == 'portraitGalleryAndLandscapeDetailStayUsable'
          ]
          if len(matching) != 1 or any(case.find(tag) is not None for case in matching for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('Responsive skin UI device test not executed or failed')
          print('Responsive skin UI Android device test passed')
          PY
