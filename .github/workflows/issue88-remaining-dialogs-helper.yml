name: Issue 88 remaining dialogs helper

on:
  push:
    branches:
      - ui/harmonize-app-wide

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue88-remaining-dialogs-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ui/harmonize-app-wide
          fetch-depth: 0

      - name: Normalize installer marker in temporary patcher
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/issue88_remaining_dialogs.py')
          text = path.read_text()
          old = '''            int maxWidth = (int) TypedValue.applyDimension(
                    TypedValue.COMPLEX_UNIT_DIP, 480, getResources().getDisplayMetrics());
            int width = Math.min(maxWidth, getResources().getDisplayMetrics().widthPixels - margin);'''
          new = '''\t\t\tint maxWidth = (int) TypedValue.applyDimension(
\t\t\t\t\tTypedValue.COMPLEX_UNIT_DIP, 480, getResources().getDisplayMetrics());
\t\t\tint width = Math.min(maxWidth, getResources().getDisplayMetrics().widthPixels - margin);'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one temporary installer marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Harmonize remaining dialogs
        run: python .github/scripts/issue88_remaining_dialogs.py

      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/ru/playsoftware/j2meloader/MainActivityComposeBridge.kt app/src/main/java/ru/playsoftware/j2meloader/filepicker/FilePickerCompose.kt app/src/main/java/ru/woesss/j2me/installer/InstallerDialog.java app/src/main/java/ru/woesss/j2me/installer/InstallerComposeBridge.kt; then
            echo "No source changes produced" >&2
            exit 1
          fi
          git config user.name "H3nb"
          git config user.email "93023716+H3nb@users.noreply.github.com"
          git add app/src/main/java/ru/playsoftware/j2meloader/MainActivityComposeBridge.kt app/src/main/java/ru/playsoftware/j2meloader/filepicker/FilePickerCompose.kt app/src/main/java/ru/woesss/j2me/installer/InstallerDialog.java app/src/main/java/ru/woesss/j2me/installer/InstallerComposeBridge.kt
          git commit -m "Harmonize remaining adaptive dialogs [issue88-remaining-dialogs-applied] [skip ci]"
          git push origin HEAD:ui/harmonize-app-wide
