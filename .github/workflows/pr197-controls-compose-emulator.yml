# Temporary, PR-scoped emulator validation. Remove after reviewing executed reports.
name: PR 197 Controls Compose emulator validation

on:
  pull_request:
    branches: [alpha]
    paths:
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/ConfigComposeBridge.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/ConfigComposeTest.kt'
      - '.github/workflows/pr197-controls-compose-emulator.yml'

permissions:
  contents: read

jobs:
  controls-compose:
    if: github.event.pull_request.number == 197
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run affected Compose tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 \
              '-Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.config.ConfigComposeTest#controlsColorsStayInlineAndEachSwatchOpensTheExpectedPicker,io.github.h3nb.jlmodplus.config.ConfigComposeTest#controlDescriptionsAndColorsRemainAvailableWhileVirtualControlsAreOff,io.github.h3nb.jlmodplus.config.ConfigComposeTest#keypadShapePrecedesSkinSelection,io.github.h3nb.jlmodplus.config.ConfigComposeTest#sliderValuesCommitFromTheirDialogs,io.github.h3nb.jlmodplus.config.ConfigComposeTest#acceptingRoundedOpacityWithoutEditingPreservesStoredValue' \
              :app:connectedEmulatorDebugAndroidTest
      - name: Upload executed Android test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr197-controls-emulator-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
