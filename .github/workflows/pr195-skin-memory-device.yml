name: PR195 Skin Memory Device Tests (temporary)

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/pr195-skin-memory-device.yml'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/ControlSkinStoreTest.java'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/ControlSkinRuntime.java'

permissions:
  contents: read

jobs:
  bitmap-budget-regression:
    if: ${{ github.event.pull_request.number == 195 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute complete control skin budget tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.config.ControlSkinStoreTest :app:connectedEmulatorDebugAndroidTest
      - name: Confirm both bitmap budget tests executed
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          expected = {'completeSkinDoesNotDropLateSlotsWhenImagesExceedBudget', 'sparseSkinKeepsFullDetailUntilDisplayNeedsLess'}
          found = set()
          failures = 0
          for path in reports:
              root = ET.parse(path).getroot()
              failures += sum(1 for failure in root.iter('failure'))
              found.update(case.attrib.get('name') for case in root.iter('testcase'))
          missing = expected - found
          if missing or failures:
              raise SystemExit(f'Missing tests: {sorted(missing)}, failed test cases: {failures}')
          print('Confirmed both skin memory regressions ran successfully.')
          PY
