name: Library UI contracts

on:
  pull_request:
    branches: [alpha, main]
    paths:
      - 'app/src/main/java/io/github/h3nb/jlmodplus/applist/Library*.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/applist/Library*.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/ConfigComposeBridge.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/ConfigTabNavigationTest.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/ui/PagerTabNavigation.kt'
      - '.github/workflows/library-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-ui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    name: Library navigation and icons
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew

      - name: Exercise real pager, restoration, collection actions, and icon refresh
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The reversed-drag contract needs a real in-progress pager gesture.
          disable-animations: false
          script: ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.applist.LibraryUiContractSuite :app:connectedEmulatorDebugAndroidTest

      - name: Verify every UI contract class executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              f"io.github.h3nb.jlmodplus.applist.{name}"
              for name in ("LibraryViewportNavigationTest", "LibraryIconRefreshTest",
                           "LibraryCollectionsNavigationTest", "LibraryComposeTest")
          }
          expected.add("io.github.h3nb.jlmodplus.config.ConfigTabNavigationTest")
          reports = list(Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No UI contract XML reports were produced")
          executed = {case.get("classname") for report in reports
                      for case in ET.parse(report).iter("testcase")
                      if case.find("skipped") is None}
          missing = expected - executed
          if missing:
              raise SystemExit(f"UI contract classes did not execute: {sorted(missing)}")
          print(f"Verified all {len(expected)} UI contract classes executed")
          PY

      - name: Upload UI contract reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JL-Mod-Plus-library-ui-contracts
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
