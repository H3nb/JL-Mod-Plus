name: Publish update manifest

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jlmod-plus-update-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest generator
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_update_manifest.py'
      - name: Read published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
      - name: Build update index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate-update-manifest.py --releases releases.json --output _site/updates.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
