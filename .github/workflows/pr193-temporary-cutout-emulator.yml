name: PR 193 temporary Android cutout qualification

on:
  pull_request:
    branches: [alpha]
    paths:
      - .github/workflows/pr193-temporary-cutout-emulator.yml
      - scripts/pr193-temporary-cutout-emulator.sh
      - app/src/androidTest/java/io/github/h3nb/jlmodplus/config/TemporaryCutoutQualificationTest.kt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr193-temporary-cutout-qualification
  cancel-in-progress: true

jobs:
  emulator-cutout-qualification:
    name: API 35 real-window cutout qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Prepare emulator and build tooling
        shell: bash
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real cutout/no-cutout and rotation probes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/pr193-temporary-cutout-emulator.sh
      - name: Upload executed emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PR193-temporary-real-cutout-evidence
          path: |
            ci-artifacts/pr193-cutout/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
