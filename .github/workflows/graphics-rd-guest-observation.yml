name: Graphics R&D Guest Image Observation

on:
  push:
    branches: [research/graphics-architecture]
    paths:
      - '.github/workflows/graphics-rd-guest-observation.yml'

permissions:
  contents: read

jobs:
  guest-source-observation:
    name: Real Guest Graphics Android ${{ matrix.api }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    env:
      GRAPHICS_ARCH_CASE: guest
      GRAPHICS_ARCH_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Java ME calls and preserve observations
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash scripts/graphics-rd-next.sh
            adb logcat -d -v threadtime -s GraphicsRD_GuestDual:I > "ci-artifacts/graphics-rd-next/api${GRAPHICS_ARCH_API}/guest/guest-observations.txt"
      - name: Upload full guest observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphics-rd-guest-observation-api${{ matrix.api }}
          path: ci-artifacts/graphics-rd-next/api${{ matrix.api }}/guest/
          if-no-files-found: warn
          retention-days: 7
