name: Profile UX Test Alignment (one-off)

on:
  push:
    branches:
      - fix/profile-manager

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-manager
          persist-credentials: true
          fetch-depth: 1

      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545

      - name: Align profile Compose tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/androidTest/java/ru/playsoftware/j2meloader/config/ConfigComposeTest.kt')
          text = path.read_text()
          text = text.replace('composeRule.onNodeWithText("Save As New Template").assertDoesNotExist()', 'composeRule.onNodeWithText("Save as Profile").assertDoesNotExist()')

          old = '''        composeRule.onNodeWithText("Built-In Settings").performClick()\n        composeRule.onNodeWithText("Configuration Templates").assertExists()\n        composeRule.onNodeWithText("Built-In Settings").performClick()\n'''
          new = '''        composeRule.onNodeWithText("Change Profile").performClick()\n        composeRule.onNodeWithText("Profiles").assertExists()\n        composeRule.onNodeWithText("Built-In Settings").performClick()\n'''
          if text.count(old) != 1:
              raise SystemExit('general profile flow block not found')
          text = text.replace(old, new)

          old = '''        composeRule.onAllNodesWithText("Nokia Classic").fetchSemanticsNodes().also {\n            assertTrue(it.size >= 2)\n        }\n        composeRule.onAllNodesWithText("Nokia Classic")[0].performClick()\n        composeRule.onNodeWithText("Configuration Templates").assertExists()\n        composeRule.onNodeWithText("Default").assertExists()\n'''
          new = '''        composeRule.onNodeWithText("Nokia Classic").assertExists()\n        composeRule.onNodeWithText("Change Profile").performClick()\n        composeRule.onNodeWithText("Profiles").assertExists()\n        composeRule.onNodeWithText("Default").assertExists()\n'''
          if text.count(old) != 1:
              raise SystemExit('active profile flow block not found')
          text = text.replace(old, new)

          text = text.replace('composeRule.onNodeWithText("Save As New Template").assertExists()', 'composeRule.onNodeWithText("Save as Profile").assertExists()')

          old = '''        composeRule.onNodeWithText("Modified").assertExists()\n        composeRule.onNodeWithText("Update Template").performClick()\n        composeRule.onNodeWithText("Update “Nokia Settings”?").assertExists()\n'''
          new = '''        composeRule.onNodeWithText("Modified").assertExists()\n        composeRule.onNodeWithContentDescription("More").performClick()\n        composeRule.onNodeWithText("Update Profile").performClick()\n        composeRule.onNodeWithText("Update “Nokia Settings”?").assertExists()\n'''
          if text.count(old) != 1:
              raise SystemExit('modified update flow block not found')
          text = text.replace(old, new)
          text = text.replace('composeRule.onAllNodesWithText("Update Template")[1].performClick()', 'composeRule.onNodeWithText("Update Profile").performClick()')

          old = '''        composeRule.onNodeWithText("Save As New Template").performClick()\n        assertEquals(1, events.saveAsProfileCalls)\n\n        composeRule.onNodeWithText("Custom").performClick()\n        composeRule.onNodeWithContentDescription("More").performClick()\n'''
          new = '''        composeRule.onNodeWithText("Save as Profile").performClick()\n        assertEquals(1, events.saveAsProfileCalls)\n\n        composeRule.onNodeWithText("Change Profile").performClick()\n        composeRule.onNodeWithContentDescription("More").performClick()\n'''
          if text.count(old) != 1:
              raise SystemExit('combined profile flow block not found')
          text = text.replace(old, new)

          text = text.replace('        var useProfileCalls = 0\n', '')
          dead = '''\n        override fun onUseProfile() {\n            useProfileCalls++\n        }\n'''
          if text.count(dead) != 1:
              raise SystemExit('obsolete onUseProfile test override not found')
          text = text.replace(dead, '\n')
          path.write_text(text)
          PY

          cat > app/src/androidTest/java/ru/playsoftware/j2meloader/config/ProfileManagerComposeTest.kt <<'KOTLIN'
          /*
           * Licensed under the Apache License, Version 2.0 (the "License");
           */
          package ru.playsoftware.j2meloader.config

          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.test.onAllNodesWithContentDescription
          import androidx.compose.ui.test.onNodeWithContentDescription
          import androidx.compose.ui.test.onNodeWithText
          import androidx.compose.ui.test.performClick
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Assert.assertEquals
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import ru.playsoftware.j2meloader.config.model.Size
          import ru.playsoftware.j2meloader.ui.JLModPlusTheme

          @RunWith(AndroidJUnit4::class)
          class ProfileManagerComposeTest {
              @get:Rule
              val composeRule = createComposeRule()

              @Test
              fun mixedModifiedSourcesKeepRareActionsBehindComponentMenus() {
                  val events = RecordingEvents()
                  val status = ConfigUiState.ProfileStatus.components(
                      "Nokia S40",
                      true,
                      "Touch Landscape",
                      true,
                      false,
                      null,
                  )

                  composeRule.setContent {
                      JLModPlusTheme {
                          ConfigProfilePanel(
                              status = status,
                              templates = listOf(
                                  ConfigUiState.ProfileTemplate("Nokia S40", false, true, false),
                                  ConfigUiState.ProfileTemplate("Touch Landscape", false, false, true),
                              ),
                              events = events,
                          )
                      }
                  }

                  composeRule.onNodeWithText("Nokia S40").assertExists()
                  composeRule.onNodeWithText("Touch Landscape").assertExists()
                  composeRule.onNodeWithText("Keep Settings for This App").assertDoesNotExist()
                  composeRule.onNodeWithText("Keep Keyboard for This App").assertDoesNotExist()

                  composeRule.onAllNodesWithContentDescription("More")[0].performClick()
                  composeRule.onNodeWithText("Keep Settings for This App").performClick()
                  composeRule.onAllNodesWithContentDescription("More")[1].performClick()
                  composeRule.onNodeWithText("Keep Keyboard for This App").performClick()

                  assertEquals(1, events.keepSettingsCalls)
                  assertEquals(1, events.keepKeyboardCalls)
              }

              @Test
              fun modifiedBuiltInRemainsVisibleWithoutExposingGlobalUpdate() {
                  val events = RecordingEvents()
                  val status = ConfigUiState.ProfileStatus.components(
                      null,
                      true,
                      null,
                      false,
                      true,
                      null,
                  )

                  composeRule.setContent {
                      JLModPlusTheme {
                          ConfigProfilePanel(
                              status = status,
                              templates = emptyList(),
                              events = events,
                          )
                      }
                  }

                  composeRule.onNodeWithText("Built-In Settings").assertExists()
                  composeRule.onNodeWithText("Modified").assertExists()
                  composeRule.onNodeWithContentDescription("More").performClick()
                  composeRule.onNodeWithText("Update Profile").assertDoesNotExist()
                  composeRule.onNodeWithText("Keep Settings for This App").performClick()

                  assertEquals(1, events.keepSettingsCalls)
                  assertEquals(0, events.updateCalls)
              }

              @Test
              fun updatingModifiedProfileRequiresGlobalConfirmation() {
                  val events = RecordingEvents()
                  val status = ConfigUiState.ProfileStatus.components(
                      "Nokia S40",
                      true,
                      null,
                      false,
                      false,
                      null,
                  )

                  composeRule.setContent {
                      JLModPlusTheme {
                          ConfigProfilePanel(
                              status = status,
                              templates = listOf(
                                  ConfigUiState.ProfileTemplate("Nokia S40", false, true, false),
                              ),
                              events = events,
                          )
                      }
                  }

                  composeRule.onNodeWithContentDescription("More").performClick()
                  composeRule.onNodeWithText("Update Profile").performClick()
                  composeRule.onNodeWithText("Update “Nokia S40”?").assertExists()
                  assertEquals(0, events.updateCalls)

                  composeRule.onNodeWithText("Update Profile").performClick()
                  assertEquals(1, events.updateCalls)
              }

              @Test
              fun sourceRowsAreStatusAndChangeProfileIsTheSingleManagerEntry() {
                  val events = RecordingEvents()
                  composeRule.setContent {
                      JLModPlusTheme {
                          ConfigProfilePanel(
                              status = ConfigUiState.ProfileStatus.active("Nokia S40", null),
                              templates = listOf(
                                  ConfigUiState.ProfileTemplate("Nokia S40", false, true, true),
                              ),
                              events = events,
                          )
                      }
                  }

                  composeRule.onNodeWithText("Nokia S40").performClick()
                  composeRule.onNodeWithText("Profiles").assertDoesNotExist()
                  composeRule.onNodeWithText("Change Profile").performClick()
                  composeRule.onNodeWithText("Profiles").assertExists()
              }

              private class RecordingEvents : ConfigFormEvents {
                  var keepSettingsCalls = 0
                  var keepKeyboardCalls = 0
                  var updateCalls = 0

                  override fun onFormChanged(state: ConfigFormState) = Unit
                  override fun onAddResolutionPreset(size: Size) = Unit
                  override fun onRemoveResolutionPreset(size: Size) = Unit
                  override fun onColorPicker(field: ConfigFormEvents.ColorField) = Unit
                  override fun onColorPicked(field: ConfigFormEvents.ColorField, value: String) = Unit
                  override fun onKeyMappings() = Unit
                  override fun onEncodingPicker() = Unit
                  override fun onShaderTuning() = Unit

                  override fun onKeepSettingsForApp() {
                      keepSettingsCalls++
                  }

                  override fun onKeepKeyboardForApp() {
                      keepKeyboardCalls++
                  }

                  override fun onUpdateTemplate(name: String) {
                      updateCalls++
                  }
              }
          }
          KOTLIN

      - name: Compile production and instrumentation sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:compileEmulatorDebugKotlin \
            :app:compileEmulatorDebugJavaWithJavac \
            :app:compileEmulatorDebugAndroidTestKotlin

      - name: Commit test alignment
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/profile-ui-tests-once.yml
          git add \
            app/src/androidTest/java/ru/playsoftware/j2meloader/config/ConfigComposeTest.kt \
            app/src/androidTest/java/ru/playsoftware/j2meloader/config/ProfileManagerComposeTest.kt
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(profile): lock down cleaner profile UX [skip ci]'
          git push origin HEAD:fix/profile-manager
