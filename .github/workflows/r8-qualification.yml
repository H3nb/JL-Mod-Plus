name: R8 qualification

on:
  pull_request:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: r8-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyzer:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Run R8 Configuration Analyzer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain \
            --configuration-cache --configuration-cache-problems=fail \
            :app:analyzeEmulatorReleaseR8Config | tee r8-analyzer.log

          mapfile -t reports < <(find app/build/reports/r8 -maxdepth 1 -type f -name '*.html' -print | sort)
          if [[ ${#reports[@]} -ne 1 ]]; then
            printf 'Expected exactly one R8 analyzer HTML report, found %d\n' "${#reports[@]}" >&2
            printf '%s\n' "${reports[@]}" >&2
            exit 1
          fi
          printf 'R8 analyzer report: %s\n' "${reports[0]}"
          python3 - "${reports[0]}" <<'PY'
          import html
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = html.unescape(re.sub(r"<[^>]+>", "\n", raw))
          lines = [re.sub(r"\s+", " ", line).strip() for line in text.splitlines()]
          for line in lines:
              if line and re.search(r"(shrinking|optimization|obfuscation|score|keep rule)", line, re.I):
                  print(line)
          PY

      - name: Upload R8 analyzer report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-configuration-analyzer
          path: |
            app/build/reports/r8/*.html
            r8-analyzer.log
          if-no-files-found: error
          retention-days: 7

  api23-audio:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK, platform 37, and NDK r30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;30.0.16248370'

      - name: Enable emulator acceleration
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 23 native audio smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --daemon --stacktrace --profile
            -PjlmodRuntimeTestAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=javax.microedition.media.MediaBoundaryRuntimeTest#generatedSynthesisSampledAndVideoShareOutputAndSeekDrainsVideo
            :app:connectedEmulatorDebugAndroidTest
