name: PR195 Control Skin Android Tests

on:
  pull_request:
    branches: [alpha]
    paths:
      - '.github/workflows/pr195-control-skin-android.yml'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/**'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/**'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/filepicker/**'

permissions:
  contents: read

jobs:
  control-skin-emulator:
    if: ${{ github.event.pull_request.number == 195 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out the PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run skin, picker and legacy input contracts on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.config.ControlSkinStoreTest,io.github.h3nb.jlmodplus.filepicker.FilePickerIntentContractTest,io.github.h3nb.jlmodplus.filepicker.FilePickerComposeTest,javax.microedition.lcdui.keyboard.VirtualKeyboardLegendRenderingTest,javax.microedition.lcdui.keyboard.LegacyVirtualKeyboardTouchTest :app:connectedEmulatorDebugAndroidTest

      - name: Verify executed Android test reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/build/outputs/androidTest-results/connected')
          reports = list(root.rglob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No executed Android instrumentation XML reports found')
          expected = {
              'io.github.h3nb.jlmodplus.config.ControlSkinStoreTest',
              'io.github.h3nb.jlmodplus.filepicker.FilePickerIntentContractTest',
              'io.github.h3nb.jlmodplus.filepicker.FilePickerComposeTest',
              'javax.microedition.lcdui.keyboard.VirtualKeyboardLegendRenderingTest',
              'javax.microedition.lcdui.keyboard.LegacyVirtualKeyboardTouchTest',
          }
          counts = dict(passed=0, failed=0, skipped=0)
          seen = set()
          for path in reports:
              for case in ET.parse(path).getroot().iter('testcase'):
                  name = case.attrib.get('classname', '')
                  if name not in expected:
                      continue
                  seen.add(name)
                  if case.find('failure') is not None or case.find('error') is not None:
                      counts['failed'] += 1
                  elif case.find('skipped') is not None:
                      counts['skipped'] += 1
                  else:
                      counts['passed'] += 1
          print(f'Executed Android tests: {counts}, classes: {sorted(seen)}')
          missing = expected - seen
          if missing or counts['failed'] or counts['skipped'] or counts['passed'] == 0:
              raise SystemExit(f'Incomplete Android instrumentation evidence; missing={sorted(missing)}')
          PY

      - name: Upload temporary instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr195-control-skin-android-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 7
