# Copyright 2026 H3NB

name: Release Readiness

on:
  push:
    branches: [alpha, main]
  pull_request:
    branches: [alpha, main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "app/build.gradle.kts"
      - "app/dictionary.pro"
      - "app/src/main/**"
      - "app/src/debug/**"
      - "app/src/test/**"
      - "app/src/**/keepRules/**"
      - "app/src/**/AndroidManifest.xml"
      - "dexlib/build.gradle.kts"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Emulator release lint, R8, and artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # This intentionally uses no production keystore. The result is a
      # validation artifact only; signing is tested separately by release.yml.
      - name: Run release lint and R8 assembly
        env:
          DISABLE_RELEASE_SIGNING: "true"
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain --non-interactive
          --warning-mode=all --build-cache
          --configuration-cache --configuration-cache-problems=fail
          :app:lintEmulatorRelease
          :app:assembleEmulatorRelease

      - name: Verify release artifact, ABI, R8, and crash observability
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find app/build/outputs/apk/emulator/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mapping="app/build/outputs/mapping/emulatorRelease/mapping.txt"
          test -s "$mapping"

          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          badging="$("$aapt2" dump badging "$apk")"

          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          grep -F "package: name='io.github.h3nb.jlmodplus' versionCode='$version_code' versionName='$version_name'" <<<"$badging"
          grep -F "minSdkVersion:'23'" <<<"$badging"
          grep -F "targetSdkVersion:'36'" <<<"$badging"
          if grep -q "application-debuggable" <<<"$badging"; then
            echo "Release artifact must not be debuggable" >&2
            exit 1
          fi

          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          test "$abis" = "arm64-v8a"

          apkanalyzer="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -x "$apkanalyzer"
          manifest="$RUNNER_TEMP/emulator-release-manifest.xml"
          "$apkanalyzer" manifest print "$apk" > "$manifest"
          python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          application = root.find("application")
          if application is None:
              raise SystemExit("APK manifest has no <application>")

          activities = {item.get(android + "name"): item for item in application.findall("activity")}
          expected_processes = {
              "javax.microedition.shell.MicroActivity": ":midlet",
              "io.github.h3nb.jlmodplus.crashes.dialog.CrashReportDialog": ":acra",
          }
          for target, expected in expected_processes.items():
              activity = activities.get(target)
              if activity is None:
                  raise SystemExit(f"{target} is missing from APK manifest")
              process = activity.get(android + "process")
              if process != expected:
                  raise SystemExit(
                      f"Process isolation lost for {target}: expected {expected!r}, got {process!r}"
                  )

          report_activity = activities.get(
              "io.github.h3nb.jlmodplus.crashes.dialog.ProcessDeathReportActivity"
          )
          if report_activity is None or report_activity.get(android + "exported") != "false":
              raise SystemExit("ProcessDeathReportActivity must exist and remain non-exported")

          receivers = {item.get(android + "name"): item for item in application.findall("receiver")}
          if "io.github.h3nb.jlmodplus.crashes.debug.DebugCrashReceiver" in receivers:
              raise SystemExit("DebugCrashReceiver leaked into release APK")

          providers = {item.get(android + "name"): item for item in application.findall("provider")}
          provider = providers.get("androidx.core.content.FileProvider")
          if provider is None:
              raise SystemExit("Crash trace FileProvider is missing")
          if provider.get(android + "authorities") != "io.github.h3nb.jlmodplus.crash-reports":
              raise SystemExit("Unexpected release crash trace FileProvider authority")
          if provider.get(android + "exported") != "false":
              raise SystemExit("Crash trace FileProvider must remain non-exported")
          if provider.get(android + "grantUriPermissions") != "true":
              raise SystemExit("Crash trace FileProvider must grant per-URI read permission")

          print("Verified release crash process isolation, report UI, trace provider, and no debug injector")
          PY

          service_path="META-INF/services/org.acra.interaction.ReportInteraction"
          provider="io.github.h3nb.jlmodplus.crashes.dialog.DialogInteraction"
          unzip -Z1 "$apk" | grep -Fx "$service_path"
          unzip -p "$apk" "$service_path" | tr -d '\r' | sed 's/[[:space:]]*$//' | grep -Fx "$provider"
          grep -F "$provider ->" "$mapping"

          # Helper classes are intentionally not asserted individually in mapping.txt:
          # R8 may legally inline or merge them. The packaged manifest/service contracts
          # above are the stable release boundary that must survive shrinking.
          printf 'Verified unsigned release artifact: %s\nABI: %s\nMapping: %s\nACRA interaction: %s\n' \
            "$apk" "$abis" "$mapping" "$provider"

      - name: Upload release-readiness artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-release-readiness-${{ github.run_number }}
          path: |
            app/build/outputs/apk/emulator/release/*.apk
            app/build/outputs/mapping/emulatorRelease/**
            app/build/reports/lint-results-emulatorRelease.html
            app/build/reports/lint-results-emulatorRelease.xml
            app/build/reports/lint-results-emulatorRelease.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle diagnostic reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-release-readiness-diagnostics-${{ github.run_number }}
          path: |
            build/reports/problems/**
            build/reports/dependency-verification/**
            build/reports/configuration-cache/**
            app/build/reports/problems/**
            app/build/reports/configuration-cache/**
          if-no-files-found: warn
          retention-days: 7
