name: Apply config feedback round 3

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
          submodules: recursive

      - name: Apply feedback
        run: |
          python3 .github/scripts/apply_config_feedback_round3.py
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v5.0.0
        with:
          cache-read-only: true

      - name: Update screenshots and validate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace :app:lintEmulatorDebug :dexlib:lintDebug :app:testEmulatorDebugUnitTest :app:validateEmulatorDebugScreenshotTest :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest

      - name: Commit product changes
        run: |
          rm .github/workflows/apply-config-feedback-round3.yml
          rm .github/scripts/apply_config_feedback_round3.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine config navigation and copy"
          git push origin HEAD:ui/redesign-config
