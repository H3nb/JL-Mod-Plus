name: Stage 2 Memory Engine Patch

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Apply bounded Inspector and Nearby Search engine patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          aidl = 'app/src/main/aidl/ru/playsoftware/j2meloader/memory/IMemoryEngineService.aidl'
          replace_once(
              aidl,
              '''    long startGroupSearch(long runtimeToken, int scope, in int[] valueTypes,\n            in String[] values, int maxDistance);\n    long refineKnown(long runtimeToken, int predicate, String firstValue, String secondValue);\n''',
              '''    long startGroupSearch(long runtimeToken, int scope, in int[] valueTypes,\n            in String[] values, int maxDistance);\n    long startNearbySearch(long runtimeToken, long anchorCandidateId, int radius,\n            int valueType, int predicate, String firstValue, String secondValue);\n    long refineKnown(long runtimeToken, int predicate, String firstValue, String secondValue);\n''')
          replace_once(
              aidl,
              '''    long[] getResultPage(long runtimeToken, int offset, int limit);\n    Bundle getWatchPage(long runtimeToken);\n''',
              '''    long[] getResultPage(long runtimeToken, int offset, int limit);\n    Bundle inspectCandidate(long runtimeToken, long candidateId, int radius);\n    Bundle getWatchPage(long runtimeToken);\n''')

          contract = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineContract.java'
          replace_once(
              contract,
              '''\tpublic static final int MAX_GROUP_VALUES = 8;\n\n\t/** [count, id, address, previousAddress, type, state, relocations, initial, previous, current, ...]. */\n''',
              '''\tpublic static final int MAX_GROUP_VALUES = 8;\n\tpublic static final int DEFAULT_INSPECT_RADIUS = 128;\n\tpublic static final int MAX_INSPECT_RADIUS = 256;\n\tpublic static final int DEFAULT_NEARBY_RADIUS = 256;\n\tpublic static final int MAX_NEARBY_RADIUS = 4096;\n\tpublic static final int MAX_INSPECT_BYTES = MAX_INSPECT_RADIUS * 2 + 8;\n\n\t/** [count, id, address, previousAddress, type, state, relocations, initial, previous, current, ...]. */\n''')
          replace_once(
              contract,
              '''\tpublic static final String KEY_MESSAGE = "message";\n\tpublic static final String KEY_WATCH_ROWS = "watchRows";\n''',
              '''\tpublic static final String KEY_MESSAGE = "message";\n\tpublic static final String KEY_INSPECT_RESULT = "inspectResult";\n\tpublic static final String KEY_INSPECT_START = "inspectStart";\n\tpublic static final String KEY_INSPECT_ANCHOR = "inspectAnchor";\n\tpublic static final String KEY_INSPECT_BYTES = "inspectBytes";\n\tpublic static final String KEY_WATCH_ROWS = "watchRows";\n''')
          replace_once(
              contract,
              '''\tpublic static boolean isCandidateType(int type) {\n\t\treturn type >= TYPE_BYTE && type <= TYPE_DOUBLE;\n\t}\n\n\tstatic boolean isCompleteRunList(long[] runs) {\n''',
              '''\tpublic static boolean isCandidateType(int type) {\n\t\treturn type >= TYPE_BYTE && type <= TYPE_DOUBLE;\n\t}\n\n\tpublic static boolean isInspectRadius(int radius) {\n\t\treturn radius > 0 && radius <= MAX_INSPECT_RADIUS;\n\t}\n\n\tpublic static boolean isNearbyRadius(int radius) {\n\t\treturn radius > 0 && radius <= MAX_NEARBY_RADIUS;\n\t}\n\n\tstatic boolean isCompleteRunList(long[] runs) {\n''')

          native_java = 'app/src/main/java/ru/playsoftware/j2meloader/memory/NativeMemoryEngine.java'
          replace_once(
              native_java,
              '''\tstatic native int startGroup(int[] valueTypes, String[] values, int maxDistance);\n\n\tstatic native int refineKnown(int predicate, String first, String second);\n''',
              '''\tstatic native int startGroup(int[] valueTypes, String[] values, int maxDistance);\n\n\tstatic native int startNearby(long anchorCandidateId, int radius, int valueType,\n\t                              int predicate, String first, String second);\n\n\tstatic native int refineKnown(int predicate, String first, String second);\n''')
          replace_once(
              native_java,
              '''\tstatic native long[] resultPage(int offset, int limit);\n\n\tstatic native void clearSearch();\n''',
              '''\tstatic native long[] resultPage(int offset, int limit);\n\n\tstatic native long[] inspect(long candidateId, int radius);\n\n\tstatic native void clearSearch();\n''')

          cpp = 'app/src/main/cpp/memory/memory_engine.cpp'
          replace_once(
              cpp,
              '''constexpr size_t kAddressCheckpointStride = 256;\n''',
              '''constexpr size_t kAddressCheckpointStride = 256;\nconstexpr jint kMaxInspectRadius = 256;\nconstexpr jint kMaxNearbyRadius = 4096;\n''')
          replace_once(
              cpp,
              '''struct OperationContext {\n    Target target;\n    std::shared_ptr<const SearchState> state;\n    std::unordered_map<uint64_t, Candidate> liveCandidates;\n    uint64_t nextId;\n};\n\nbool beginOperation(OperationContext &context) {\n''',
              '''struct OperationContext {\n    Target target;\n    std::shared_ptr<const SearchState> state;\n    std::unordered_map<uint64_t, Candidate> liveCandidates;\n    uint64_t nextId;\n};\n\nbool resolveCandidateById(const OperationContext &context, uint64_t id,\n                          Candidate &resolved);\nbool verifyCandidateBinding(const Target &target, const Candidate &candidate);\nbool candidateWindow(const Target &target, const Candidate &candidate,\n                     size_t radius, Range &window);\n\nbool beginOperation(OperationContext &context) {\n''')
          replace_once(
              cpp,
              '''jint scanKnown(const OperationContext &context, jint requestedType,\n               jint predicate, const std::string &first,\n               const std::string &second) {\n    if (context.nextId >\n        std::numeric_limits<uint64_t>::max() - kCandidateLimit) {\n        setMessage("Candidate identifier space is exhausted for this runtime");\n        return kResourceLimit;\n    }\n    std::shared_ptr<SearchState> next;\n    const jint scanResult = collectKnown(context, requestedType, predicate,\n                                         first, second, next);\n    if (scanResult != kOk) {\n        return scanResult;\n    }\n    OperationContext committed = context;\n    committed.nextId += next->candidates.size();\n    return commitOperation(committed, std::move(next), -1);\n}\n\nstruct GroupMatch {\n''',
              '''jint scanKnown(const OperationContext &context, jint requestedType,\n               jint predicate, const std::string &first,\n               const std::string &second) {\n    if (context.nextId >\n        std::numeric_limits<uint64_t>::max() - kCandidateLimit) {\n        setMessage("Candidate identifier space is exhausted for this runtime");\n        return kResourceLimit;\n    }\n    std::shared_ptr<SearchState> next;\n    const jint scanResult = collectKnown(context, requestedType, predicate,\n                                         first, second, next);\n    if (scanResult != kOk) {\n        return scanResult;\n    }\n    OperationContext committed = context;\n    committed.nextId += next->candidates.size();\n    return commitOperation(committed, std::move(next), -1);\n}\n\njint scanNearby(const OperationContext &context, uint64_t anchorId, jint radius,\n                jint requestedType, jint predicate, const std::string &first,\n                const std::string &second) {\n    if (anchorId == 0 || radius <= 0 || radius > kMaxNearbyRadius) {\n        setMessage("Nearby Search requires a valid candidate and a bounded radius");\n        return kInvalidRequest;\n    }\n    Candidate anchor{};\n    if (!resolveCandidateById(context, anchorId, anchor)) {\n        setMessage("Nearby Search anchor is no longer available");\n        return kInvalidRequest;\n    }\n    if (!verifyCandidateBinding(context.target, anchor)) {\n        return kIdentityUnsafe;\n    }\n    Range window{};\n    if (!candidateWindow(context.target, anchor, static_cast<size_t>(radius),\n                         window)) {\n        setMessage("Nearby Search anchor is outside the current resident ranges");\n        return kTargetLost;\n    }\n\n    OperationContext nearby = context;\n    nearby.target.ranges.clear();\n    nearby.target.ranges.push_back(window);\n    std::shared_ptr<SearchState> next;\n    const jint scanResult = collectKnown(nearby, requestedType, predicate, first,\n                                         second, next);\n    if (scanResult != kOk) {\n        return scanResult;\n    }\n    // The scan window is intentionally narrow, but relocation fingerprints may extend just\n    // outside it. Fill those boundary identities against the full configured resident set.\n    fillMissingIdentities(context.target, next->candidates);\n    const size_t resultCount = next->candidates.size();\n    OperationContext committed = context;\n    committed.nextId += resultCount;\n    const jint result = commitOperation(committed, std::move(next), -1);\n    if (result == kOk) {\n        setMessage(("Nearby Search found " + std::to_string(resultCount) +\n                    " typed candidates in the bounded window")\n                           .c_str());\n    }\n    return result;\n}\n\nstruct GroupMatch {\n''')
          replace_once(
              cpp,
              '''bool readCandidate(const Target &target, const Candidate &candidate,\n                   uint64_t &bits) {\n    const size_t width = widthOf(candidate.type);\n    return width != 0 && readExact(target.pid, candidate.address, &bits, width);\n}\n\nclass CandidateValueReader {\n''',
              '''bool readCandidate(const Target &target, const Candidate &candidate,\n                   uint64_t &bits) {\n    const size_t width = widthOf(candidate.type);\n    return width != 0 && readExact(target.pid, candidate.address, &bits, width);\n}\n\nbool resolveCandidateById(const OperationContext &context, uint64_t id,\n                          Candidate &resolved) {\n    if (id == 0) {\n        return false;\n    }\n    const auto live = context.liveCandidates.find(id);\n    if (live != context.liveCandidates.end()) {\n        resolved = live->second;\n        return true;\n    }\n    const auto findIn = [&](const std::vector<Candidate> &items) {\n        const auto found = std::find_if(items.begin(), items.end(),\n                                        [&](const Candidate &candidate) {\n                                            return candidate.id == id;\n                                        });\n        if (found == items.end()) {\n            return false;\n        }\n        resolved = liveCandidate(*found, context.liveCandidates);\n        return true;\n    };\n    return findIn(context.state->candidates) || findIn(context.state->watches);\n}\n\nbool verifyCandidateBinding(const Target &target, const Candidate &candidate) {\n    if (candidate.state != kStable || !candidate.identityValid) {\n        setMessage("Candidate identity is not stable enough for a bounded read");\n        return false;\n    }\n    uint64_t current = 0;\n    uint64_t hash = 0;\n    if (!readCandidate(target, candidate, current) ||\n        current != candidate.currentBits ||\n        !readIdentity(target, candidate.address, candidate.type, hash) ||\n        hash != candidate.identityHash) {\n        setMessage("Candidate binding changed before the bounded read");\n        return false;\n    }\n    return true;\n}\n\nbool candidateWindow(const Target &target, const Candidate &candidate,\n                     size_t radius, Range &window) {\n    const size_t width = widthOf(candidate.type);\n    if (width == 0 || radius == 0 ||\n        candidate.address > std::numeric_limits<uintptr_t>::max() - width) {\n        return false;\n    }\n    const uintptr_t valueEnd = candidate.address + width;\n    const auto containing = std::find_if(\n            target.ranges.begin(), target.ranges.end(), [&](const Range &range) {\n                return range.start <= candidate.address && range.end >= valueEnd;\n            });\n    if (containing == target.ranges.end()) {\n        return false;\n    }\n    const uintptr_t requestedStart =\n            candidate.address < radius ? 0 : candidate.address - radius;\n    const uintptr_t requestedEnd =\n            valueEnd > std::numeric_limits<uintptr_t>::max() - radius\n                    ? std::numeric_limits<uintptr_t>::max()\n                    : valueEnd + radius;\n    window.start = std::max(containing->start, requestedStart);\n    window.end = std::min(containing->end, requestedEnd);\n    return window.end > window.start;\n}\n\njlongArray inspectionResult(JNIEnv *env, jint code, uintptr_t start = 0,\n                            uintptr_t anchor = 0,\n                            const std::vector<uint8_t> *bytes = nullptr) {\n    const size_t byteCount = bytes == nullptr ? 0 : bytes->size();\n    if (byteCount > static_cast<size_t>(std::numeric_limits<jsize>::max()) - 4U) {\n        return nullptr;\n    }\n    std::vector<jlong> output(4U + byteCount);\n    output[0] = code;\n    output[1] = static_cast<jlong>(start);\n    output[2] = static_cast<jlong>(anchor);\n    output[3] = static_cast<jlong>(byteCount);\n    for (size_t index = 0; index < byteCount; ++index) {\n        output[4U + index] = static_cast<jlong>((*bytes)[index]);\n    }\n    jlongArray result = env->NewLongArray(static_cast<jsize>(output.size()));\n    if (result != nullptr) {\n        env->SetLongArrayRegion(result, 0, static_cast<jsize>(output.size()),\n                                output.data());\n    }\n    return result;\n}\n\njlongArray inspectCandidateSnapshot(JNIEnv *env, const OperationContext &context,\n                                    uint64_t candidateId, jint radius) {\n    if (candidateId == 0 || radius <= 0 || radius > kMaxInspectRadius) {\n        setMessage("Inspector radius or candidate is invalid");\n        return inspectionResult(env, kInvalidRequest);\n    }\n    Candidate candidate{};\n    if (!resolveCandidateById(context, candidateId, candidate)) {\n        setMessage("Inspector candidate is no longer available");\n        return inspectionResult(env, kInvalidRequest);\n    }\n    if (!verifyCandidateBinding(context.target, candidate)) {\n        return inspectionResult(env, kIdentityUnsafe);\n    }\n    Range window{};\n    if (!candidateWindow(context.target, candidate, static_cast<size_t>(radius),\n                         window)) {\n        setMessage("Inspector candidate is outside the current resident ranges");\n        return inspectionResult(env, kTargetLost);\n    }\n    std::vector<uint8_t> bytes(static_cast<size_t>(window.end - window.start));\n    if (!readExact(context.target.pid, window.start, bytes.data(), bytes.size())) {\n        setMessage("Inspector window changed while it was being read");\n        return inspectionResult(env, kTargetLost);\n    }\n    if (gCancelled.load(std::memory_order_acquire)) {\n        setMessage("Inspector read was cancelled");\n        return inspectionResult(env, kCancelled);\n    }\n    {\n        std::lock_guard<std::mutex> lock(gMutex);\n        if (gTarget.generation != context.target.generation ||\n            gTarget.token != context.target.token || gState != context.state) {\n            gLastMessage = "MIDlet runtime or search changed during Inspector read";\n            return inspectionResult(env, kTargetLost);\n        }\n        gLastMessage = "";\n    }\n    return inspectionResult(env, kOk, window.start, candidate.address, &bytes);\n}\n\nclass CandidateValueReader {\n''')
          replace_once(
              cpp,
              '''extern "C" JNIEXPORT jint JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_refineKnown(\n''',
              '''extern "C" JNIEXPORT jint JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_startNearby(\n        JNIEnv *env, jclass, jlong anchorCandidateId, jint radius, jint type,\n        jint predicate, jstring first, jstring second) {\n    return guardedOperation([&] {\n        if (anchorCandidateId <= 0) {\n            setMessage("Nearby Search anchor is invalid");\n            return kInvalidRequest;\n        }\n        OperationContext context;\n        if (!beginOperation(context)) {\n            return kNoSession;\n        }\n        return scanNearby(context, static_cast<uint64_t>(anchorCandidateId),\n                          radius, type, predicate, fromJString(env, first),\n                          fromJString(env, second));\n    });\n}\n\nextern "C" JNIEXPORT jint JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_refineKnown(\n''')
          replace_once(
              cpp,
              '''extern "C" JNIEXPORT jint JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_pin(JNIEnv *env,\n''',
              '''extern "C" JNIEXPORT jlongArray JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_inspect(\n        JNIEnv *env, jclass, jlong candidateId, jint radius) {\n    try {\n        OperationContext context;\n        if (!beginOperation(context)) {\n            return inspectionResult(env, kNoSession);\n        }\n        if (candidateId <= 0) {\n            setMessage("Inspector candidate is invalid");\n            return inspectionResult(env, kInvalidRequest);\n        }\n        return inspectCandidateSnapshot(\n                env, context, static_cast<uint64_t>(candidateId), radius);\n    } catch (const std::bad_alloc &) {\n        setMessage("Inspector memory budget could not be reserved");\n        return inspectionResult(env, kResourceLimit);\n    } catch (...) {\n        setMessage("Inspector rejected the request safely");\n        return inspectionResult(env, kInvalidRequest);\n    }\n}\n\nextern "C" JNIEXPORT jint JNICALL\nJava_ru_playsoftware_j2meloader_memory_NativeMemoryEngine_pin(JNIEnv *env,\n''')

          service = 'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java'
          replace_once(
              service,
              '''import java.util.concurrent.Executors;\nimport java.util.concurrent.RejectedExecutionException;\n''',
              '''import java.util.concurrent.ExecutionException;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.RejectedExecutionException;\n''')
          replace_once(
              service,
              '''\t\t@Override\n\t\tpublic long refineKnown(long token, int predicate, String first, String second) {\n''',
              '''\t\t@Override\n\t\tpublic long startNearbySearch(long token, long anchorCandidateId, int radius,\n\t\t                              int type, int predicate, String first, String second) {\n\t\t\treturn enqueue(token, false, 0, () -> {\n\t\t\t\tif (anchorCandidateId <= 0L || !MemoryEngineContract.isNearbyRadius(radius)) {\n\t\t\t\t\treturn MemoryEngineContract.RESULT_INVALID_REQUEST;\n\t\t\t\t}\n\t\t\t\tint ready = refreshWithRecovery(token, new long[]{anchorCandidateId});\n\t\t\t\treturn ready == MemoryEngineContract.RESULT_OK\n\t\t\t\t\t\t? NativeMemoryEngine.startNearby(anchorCandidateId, radius, type, predicate,\n\t\t\t\t\t\t\t\tfirst, second)\n\t\t\t\t\t\t: ready;\n\t\t\t});\n\t\t}\n\n\t\t@Override\n\t\tpublic long refineKnown(long token, int predicate, String first, String second) {\n''')
          replace_once(
              service,
              '''\t\t@Override\n\t\tpublic Bundle getWatchPage(long token) {\n''',
              '''\t\t@Override\n\t\tpublic Bundle inspectCandidate(long token, long candidateId, int radius) {\n\t\t\tif (candidateId <= 0L || !MemoryEngineContract.isInspectRadius(radius)) {\n\t\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_INVALID_REQUEST,\n\t\t\t\t\t\t"Inspector requires a valid CandidateId and bounded radius");\n\t\t\t}\n\t\t\ttry {\n\t\t\t\treturn worker.submit(() -> inspectCandidateOnWorker(token, candidateId, radius)).get();\n\t\t\t} catch (RejectedExecutionException exception) {\n\t\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_TARGET_LOST,\n\t\t\t\t\t\t"Memory engine is shutting down");\n\t\t\t} catch (InterruptedException exception) {\n\t\t\t\tThread.currentThread().interrupt();\n\t\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_CANCELLED,\n\t\t\t\t\t\t"Inspector request was interrupted");\n\t\t\t} catch (ExecutionException exception) {\n\t\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_INVALID_REQUEST,\n\t\t\t\t\t\t"Inspector request failed safely");\n\t\t\t}\n\t\t}\n\n\t\t@Override\n\t\tpublic Bundle getWatchPage(long token) {\n''')
          replace_once(
              service,
              '''\tprivate int setFreezeRecords(long token, long[] candidateIds, int mode,\n''',
              '''\tprivate Bundle inspectCandidateOnWorker(long token, long candidateId, int radius) {\n\t\tif (!isTargetToken(token)) {\n\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_TARGET_LOST,\n\t\t\t\t\t"MIDlet runtime changed or ended");\n\t\t}\n\t\tint ready = refreshWithRecovery(token, new long[]{candidateId});\n\t\tif (ready != MemoryEngineContract.RESULT_OK) {\n\t\t\treturn inspectionFailure(ready, NativeMemoryEngine.lastMessage());\n\t\t}\n\t\tlong[] raw = NativeMemoryEngine.inspect(candidateId, radius);\n\t\tif (raw == null || raw.length < 4) {\n\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_INVALID_REQUEST,\n\t\t\t\t\t"Inspector returned an invalid native response");\n\t\t}\n\t\tint result = (int) raw[0];\n\t\tif (result != MemoryEngineContract.RESULT_OK) {\n\t\t\treturn inspectionFailure(result, NativeMemoryEngine.lastMessage());\n\t\t}\n\t\tlong byteCountLong = raw[3];\n\t\tif (raw[1] <= 0L || raw[2] <= 0L || byteCountLong < 0L ||\n\t\t\t\tbyteCountLong > MemoryEngineContract.MAX_INSPECT_BYTES ||\n\t\t\t\traw.length != 4L + byteCountLong) {\n\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_INVALID_REQUEST,\n\t\t\t\t\t"Inspector returned malformed bounded data");\n\t\t}\n\t\tif (!isCurrentToken(token)) {\n\t\t\treturn inspectionFailure(MemoryEngineContract.RESULT_TARGET_LOST,\n\t\t\t\t\t"MIDlet runtime changed during Inspector read");\n\t\t}\n\t\tint byteCount = (int) byteCountLong;\n\t\tbyte[] bytes = new byte[byteCount];\n\t\tfor (int index = 0; index < byteCount; index++) {\n\t\t\tbytes[index] = (byte) (raw[4 + index] & 0xffL);\n\t\t}\n\t\tBundle bundle = new Bundle();\n\t\tbundle.putInt(MemoryEngineContract.KEY_INSPECT_RESULT, MemoryEngineContract.RESULT_OK);\n\t\tbundle.putLong(MemoryEngineContract.KEY_INSPECT_START, raw[1]);\n\t\tbundle.putLong(MemoryEngineContract.KEY_INSPECT_ANCHOR, raw[2]);\n\t\tbundle.putByteArray(MemoryEngineContract.KEY_INSPECT_BYTES, bytes);\n\t\treturn bundle;\n\t}\n\n\tprivate static Bundle inspectionFailure(int result, @Nullable String message) {\n\t\tBundle bundle = new Bundle();\n\t\tbundle.putInt(MemoryEngineContract.KEY_INSPECT_RESULT, result);\n\t\tif (message != null && !message.isBlank()) {\n\t\t\tbundle.putString(MemoryEngineContract.KEY_MESSAGE, message);\n\t\t}\n\t\treturn bundle;\n\t}\n\n\tprivate int setFreezeRecords(long token, long[] candidateIds, int mode,\n''')

          test = 'app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEngineContractTest.java'
          replace_once(
              test,
              '''\t\tassertEquals(8, MemoryEngineContract.MAX_GROUP_VALUES);\n\t}\n}\n''',
              '''\t\tassertEquals(8, MemoryEngineContract.MAX_GROUP_VALUES);\n\t\tassertEquals(128, MemoryEngineContract.DEFAULT_INSPECT_RADIUS);\n\t\tassertEquals(256, MemoryEngineContract.MAX_INSPECT_RADIUS);\n\t\tassertEquals(256, MemoryEngineContract.DEFAULT_NEARBY_RADIUS);\n\t\tassertEquals(4096, MemoryEngineContract.MAX_NEARBY_RADIUS);\n\t\tassertEquals(520, MemoryEngineContract.MAX_INSPECT_BYTES);\n\t\tassertTrue(MemoryEngineContract.isInspectRadius(128));\n\t\tassertFalse(MemoryEngineContract.isInspectRadius(0));\n\t\tassertFalse(MemoryEngineContract.isInspectRadius(257));\n\t\tassertTrue(MemoryEngineContract.isNearbyRadius(256));\n\t\tassertFalse(MemoryEngineContract.isNearbyRadius(0));\n\t\tassertFalse(MemoryEngineContract.isNearbyRadius(4097));\n\t}\n}\n''')
          PY

      - name: Compile and run focused tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testEmulatorDebugUnitTest \
            :app:assembleEmulatorDebug \
            :app:assembleEmulatorDebugAndroidTest

      - name: Verify diff and commit Stage 2 engine API
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            '.github/workflows/stage2-memory-engine.yml'
            'app/src/main/aidl/ru/playsoftware/j2meloader/memory/IMemoryEngineService.aidl'
            'app/src/main/cpp/memory/memory_engine.cpp'
            'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineContract.java'
            'app/src/main/java/ru/playsoftware/j2meloader/memory/MemoryEngineService.java'
            'app/src/main/java/ru/playsoftware/j2meloader/memory/NativeMemoryEngine.java'
            'app/src/test/java/ru/playsoftware/j2meloader/memory/MemoryEngineContractTest.java'
          )
          git rm .github/workflows/stage2-memory-engine.yml
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/^"(.*)"$/\1/' | sort)
          mapfile -t allowed < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${allowed[@]}")" ]]; then
            echo 'Unexpected Stage 2 diff:' >&2
            git status --short >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Add bounded Memory Inspector and Nearby Search engine API'
          git push origin "HEAD:${GITHUB_REF_NAME}"
