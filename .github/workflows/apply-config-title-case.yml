name: Apply Config label capitalization

on:
  push:
    branches:
      - ui/redesign-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ui/redesign-config
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v5.0.0
        with:
          cache-read-only: true
      - name: Apply title-case labels and refresh screenshot references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_paths = [
              Path('app/src/main/java/ru/playsoftware/j2meloader/config/ConfigComposeBridge.kt'),
          ]
          label_keys = set()
          title_pattern = re.compile(r'title\s*=\s*stringResource\(R\.string\.([A-Za-z0-9_]+)\)')
          for path in source_paths:
              label_keys.update(title_pattern.findall(path.read_text()))

          # Titles rendered through TopAppBar/overlay Text rather than a `title = stringResource(...)` argument.
          label_keys.update({
              'PREF_SYS_PROPS',
              'pref_map_keys',
              'mapping_dialog_title',
          })

          entity_pattern = re.compile(r'(&(?:[A-Za-z][A-Za-z0-9]+|#\d+|#x[0-9A-Fa-f]+);)')

          def capitalize_words(text: str) -> str:
              pieces = entity_pattern.split(text)
              result = []
              for piece in pieces:
                  if entity_pattern.fullmatch(piece):
                      result.append(piece)
                      continue
                  chars = list(piece)
                  word_start = True
                  for i, ch in enumerate(chars):
                      if ch.isalpha():
                          if word_start:
                              chars[i] = ch.upper()
                          word_start = False
                      elif ch.isdigit():
                          word_start = False
                      elif ch in "'’":
                          # Apostrophes stay inside a word; do not turn don't into Don'T.
                          pass
                      else:
                          word_start = True
                  result.append(''.join(chars))
              return ''.join(result)

          changed = []
          resource_paths = [
              Path('app/src/main/res/values/strings.xml'),
              Path('app/src/main/res/values/strings_config_redesign.xml'),
              Path('app/src/main/res/values-in/strings.xml'),
              Path('app/src/main/res/values-in/strings_config_redesign.xml'),
          ]
          for path in resource_paths:
              text = path.read_text()
              for key in sorted(label_keys):
                  pattern = re.compile(r'(<string\s+name="' + re.escape(key) + r'"(?:\s+[^>]*)?>)(.*?)(</string>)')
                  match = pattern.search(text)
                  if not match:
                      continue
                  old = match.group(2)
                  new = capitalize_words(old)
                  if new != old:
                      text = text[:match.start(2)] + new + text[match.end(2):]
                      changed.append(f'{path}: {key}: {old} -> {new}')
              path.write_text(text)

          print('Detected label keys:', ', '.join(sorted(label_keys)))
          print('Changed labels:')
          for item in changed:
              print('  ' + item)
          if not changed:
              raise SystemExit('No label capitalization changes were produced')
          PY

          bash ./gradlew --no-daemon :app:updateEmulatorDebugScreenshotTest
          rm .github/workflows/apply-config-title-case.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use title case for Config labels"
          git push origin HEAD:ui/redesign-config
