# Copyright 2026 H3NB

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Midlet ID, and emulator debug lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Add development version suffix
        shell: bash
        run: echo "VERSION_SUFFIX=-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Build-script edge cases and lint are blocking quality gates. Warnings remain
      # visible in the uploaded report and must be triaged without broad suppression.
      - name: Test Midlet ID and run emulator debug lint
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain --non-interactive
          --warning-mode=all
          --configuration-cache --configuration-cache-problems=fail
          :app:testMidletApplicationIdSegment
          :app:lintEmulatorDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-lint-${{ github.run_number }}
          # Keep human-readable reports until Code Scanning permissions and
          # fork-PR behavior are reviewed; do not publish SARIF yet.
          path: |
            app/build/reports/lint-results-emulatorDebug.html
            app/build/reports/lint-results-emulatorDebug.xml
            app/build/reports/lint-results-emulatorDebug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle diagnostic reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-quality-diagnostics-${{ github.run_number }}
          path: |
            build/reports/problems/**
            build/reports/dependency-verification/**
            build/reports/configuration-cache/**
            app/build/reports/problems/**
            app/build/reports/configuration-cache/**
          if-no-files-found: warn
          retention-days: 7

  unit-assemble:
    name: Emulator debug tests and ARM64 assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Keep installable emulatorDebug artifacts on the same signing identity
      # as local debug builds. The keystore is supplied through GitHub Secrets;
      # never commit or print the private key. Fork PRs may not receive secrets,
      # so those validation builds safely fall back to the runner's throwaway
      # debug key and are not expected to update a local installation.
      - name: Restore shared debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is unavailable; using the runner debug keystore."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Add development version suffix
        shell: bash
        run: echo "VERSION_SUFFIX=-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Instrumentation tests require an ARM64 Android runtime because the app
      # intentionally packages only arm64-v8a. CI still compiles their APK here
      # so DirectGraphics regression tests cannot silently rot between device runs.
      - name: Test and assemble emulator debug
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain --non-interactive
          --warning-mode=all
          --build-cache
          --configuration-cache --configuration-cache-problems=fail
          :app:testEmulatorDebugUnitTest
          :app:assembleEmulatorDebugAndroidTest
          :app:assembleEmulatorDebug

      - name: Verify packaged ABI
        shell: bash
        run: |
          apk="$(find app/build/outputs/renamed_apks/emulatorDebug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          test "$abis" = "arm64-v8a"
          printf 'Verified APK: %s\nABI: %s\n' "$apk" "$abis"

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-unit-tests-${{ github.run_number }}
          path: |
            app/build/test-results/testEmulatorDebugUnitTest/**
            app/build/reports/tests/testEmulatorDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle diagnostic reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-gradle-diagnostics-${{ github.run_number }}
          path: |
            build/reports/problems/**
            build/reports/dependency-verification/**
            build/reports/configuration-cache/**
            app/build/reports/problems/**
            app/build/reports/configuration-cache/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-${{ github.run_number }}-arm64-v8a-debug
          path: app/build/outputs/renamed_apks/emulatorDebug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
