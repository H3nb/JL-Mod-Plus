name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate emulator ARM64 debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Add development version suffix
        shell: bash
        run: echo "VERSION_SUFFIX=-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Lint is a blocking quality gate for the emulator variant. Warnings remain
      # visible in the uploaded report and must be triaged without broad suppression.
      - name: Run emulator debug lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintEmulatorDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-emulatorDebug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Test and assemble emulator debug
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testEmulatorDebugUnitTest
          :app:assembleEmulatorDebug

      - name: Verify packaged ABI
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/emulator/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          test "$abis" = "arm64-v8a"
          printf 'Verified APK: %s\nABI: %s\n' "$apk" "$abis"

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jl-mod-plus-${{ github.run_number }}-arm64-v8a-debug
          path: app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
