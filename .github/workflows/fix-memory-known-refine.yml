name: Fix Memory Editor Known refine predicates

on:
  push:
    branches:
      - fix/memory-editor-correctness-20260912
    paths:
      - .github/workflows/fix-memory-known-refine.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/memory-editor-correctness-20260912
      - name: Apply focused predicate-family fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorRuntimeCompose.kt')
          runtime = runtime_path.read_text()

          old = '''    val relative = effectivePredicate >= MemoryEngineContract.PREDICATE_CHANGED
    val spec = if (relative) MemoryInputSpec.relativeMagnitudeForType(type)
    else MemoryInputSpec.forType(type)
'''
          new = '''    val spec = MemoryInputSpec.forType(type)
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)

          old = '''    val needsSecond = (effectivePredicate == MemoryEngineContract.PREDICATE_BETWEEN && !relative &&
        expression !is MemorySearchExpression.Group) ||
        effectivePredicate == MemoryEngineContract.PREDICATE_INCREASED_BY_RANGE ||
        effectivePredicate == MemoryEngineContract.PREDICATE_DECREASED_BY_RANGE
    val firstValid = if (relative && !memoryRelativePredicateNeedsValue(effectivePredicate)) {
        true
    } else {
        spec.isComplete(query.text)
    }
'''
          new = '''    val needsSecond = effectivePredicate == MemoryEngineContract.PREDICATE_BETWEEN &&
        expression !is MemorySearchExpression.Group
    val firstValid = spec.isComplete(query.text)
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)

          old = '''    val newSearchValid = !relative && (singleValid || managedGroupValid) && secondValid &&
        MemoryEngineContract.isValueType(type) &&
        effectivePredicate in MemoryEngineContract.PREDICATE_EQUAL..MemoryEngineContract.PREDICATE_BETWEEN
    val relativeWithoutValue = relative && !memoryRelativePredicateNeedsValue(effectivePredicate)
    val nextScanValid = state.sessionStage != MemorySessionStage.EMPTY &&
        type in (MemoryEngineContract.TYPE_AUTO..MemoryEngineContract.TYPE_DOUBLE) &&
        (relativeWithoutValue || (expression is MemorySearchExpression.Single && firstValid)) &&
        secondValid
'''
          new = '''    val newSearchValid = (singleValid || managedGroupValid) && secondValid &&
        MemoryEngineContract.isValueType(type) &&
        effectivePredicate in MemoryEngineContract.PREDICATE_EQUAL..MemoryEngineContract.PREDICATE_BETWEEN
    val nextScanValid = state.sessionStage != MemorySessionStage.EMPTY &&
        type in (MemoryEngineContract.TYPE_AUTO..MemoryEngineContract.TYPE_DOUBLE) &&
        expression is MemorySearchExpression.Single && firstValid && secondValid
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)

          old = '''                        RuntimePredicateMenu(
                            predicate = effectivePredicate,
                            onPredicate = { predicate = it },
                            includeRelative = state.sessionStage != MemorySessionStage.EMPTY,
                            enabled = !groupExpression,
                            modifier = Modifier.widthIn(min = 72.dp, max = 112.dp),
                        )
'''
          new = '''                        RuntimePredicateMenu(
                            predicate = effectivePredicate,
                            onPredicate = { predicate = it },
                            enabled = !groupExpression,
                            modifier = Modifier.widthIn(min = 72.dp, max = 112.dp),
                        )
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)

          old = '''                            val nextValue = if (relativeWithoutValue) {
                                ""
                            } else {
                                (expression as? MemorySearchExpression.Single)?.value
                                    ?: return@Button
                            }
'''
          new = '''                            val nextValue = (expression as? MemorySearchExpression.Single)?.value
                                ?: return@Button
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)

          old = '''private fun RuntimePredicateMenu(
    predicate: Int,
    onPredicate: (Int) -> Unit,
    includeRelative: Boolean = false,
    enabled: Boolean = true,
    modifier: Modifier = Modifier,
) {
    RuntimeChoiceMenu(
        value = predicate,
        values = (if (includeRelative) intArrayOf(
            MemoryEngineContract.PREDICATE_EQUAL,
            MemoryEngineContract.PREDICATE_NOT_EQUAL,
            MemoryEngineContract.PREDICATE_GREATER,
            MemoryEngineContract.PREDICATE_LESS,
            MemoryEngineContract.PREDICATE_GREATER_OR_EQUAL,
            MemoryEngineContract.PREDICATE_LESS_OR_EQUAL,
            MemoryEngineContract.PREDICATE_BETWEEN,
            MemoryEngineContract.PREDICATE_CHANGED,
            MemoryEngineContract.PREDICATE_UNCHANGED,
            MemoryEngineContract.PREDICATE_INCREASED,
            MemoryEngineContract.PREDICATE_DECREASED,
            MemoryEngineContract.PREDICATE_INCREASED_BY,
            MemoryEngineContract.PREDICATE_DECREASED_BY,
            MemoryEngineContract.PREDICATE_CHANGED_BY,
            MemoryEngineContract.PREDICATE_INCREASED_BY_RANGE,
            MemoryEngineContract.PREDICATE_DECREASED_BY_RANGE,
        ) else intArrayOf(
            MemoryEngineContract.PREDICATE_EQUAL,
            MemoryEngineContract.PREDICATE_NOT_EQUAL,
            MemoryEngineContract.PREDICATE_GREATER,
            MemoryEngineContract.PREDICATE_LESS,
            MemoryEngineContract.PREDICATE_GREATER_OR_EQUAL,
            MemoryEngineContract.PREDICATE_LESS_OR_EQUAL,
            MemoryEngineContract.PREDICATE_BETWEEN,
        )),
'''
          new = '''private fun RuntimePredicateMenu(
    predicate: Int,
    onPredicate: (Int) -> Unit,
    enabled: Boolean = true,
    modifier: Modifier = Modifier,
) {
    RuntimeChoiceMenu(
        value = predicate,
        values = memoryKnownSearchPredicates(),
'''
          assert old in runtime
          runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          models_path = Path('app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorModels.kt')
          models = models_path.read_text()
          marker = '''/** Predicates that describe a change from the captured Unknown-search baseline. */
internal fun memoryUnknownSearchPredicates(): IntArray = intArrayOf(
'''
          insert = '''/** Predicates that compare candidates against an explicit Known value. */
internal fun memoryKnownSearchPredicates(): IntArray = intArrayOf(
    MemoryEngineContract.PREDICATE_EQUAL,
    MemoryEngineContract.PREDICATE_NOT_EQUAL,
    MemoryEngineContract.PREDICATE_GREATER,
    MemoryEngineContract.PREDICATE_LESS,
    MemoryEngineContract.PREDICATE_GREATER_OR_EQUAL,
    MemoryEngineContract.PREDICATE_LESS_OR_EQUAL,
    MemoryEngineContract.PREDICATE_BETWEEN,
)

/** Predicates that describe a change from the captured Unknown-search baseline. */
internal fun memoryUnknownSearchPredicates(): IntArray = intArrayOf(
'''
          assert marker in models
          models = models.replace(marker, insert, 1)
          models_path.write_text(models)

          test_path = Path('app/src/test/java/io/github/h3nb/jlmodplus/memory/MemoryEditorModelsTest.kt')
          test = test_path.read_text()
          marker = '''    @Test fun unknownSearchOnlyOffersRelativePredicates() {
'''
          insert = '''    @Test fun knownAndUnknownSearchKeepPredicateFamiliesSeparate() {
        assertArrayEquals(
            intArrayOf(
                MemoryEngineContract.PREDICATE_EQUAL,
                MemoryEngineContract.PREDICATE_NOT_EQUAL,
                MemoryEngineContract.PREDICATE_GREATER,
                MemoryEngineContract.PREDICATE_LESS,
                MemoryEngineContract.PREDICATE_GREATER_OR_EQUAL,
                MemoryEngineContract.PREDICATE_LESS_OR_EQUAL,
                MemoryEngineContract.PREDICATE_BETWEEN,
            ),
            memoryKnownSearchPredicates(),
        )
        assertTrue(
            memoryKnownSearchPredicates().toSet()
                .intersect(memoryUnknownSearchPredicates().toSet())
                .isEmpty(),
        )
    }

    @Test fun unknownSearchOnlyOffersRelativePredicates() {
'''
          assert marker in test
          test = test.replace(marker, insert, 1)
          test_path.write_text(test)
          PY
      - name: Verify and commit only expected files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          expected=(
            app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorRuntimeCompose.kt
            app/src/main/java/io/github/h3nb/jlmodplus/memory/MemoryEditorModels.kt
            app/src/test/java/io/github/h3nb/jlmodplus/memory/MemoryEditorModelsTest.kt
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'Separate Known and Unknown refine predicates'
          git push origin HEAD:fix/memory-editor-correctness-20260912
