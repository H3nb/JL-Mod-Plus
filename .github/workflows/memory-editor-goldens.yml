name: Memory Editor audited goldens

on:
  push:
    branches:
      - ci/memory-editor-stack-f914594
    paths:
      - .github/workflows/memory-editor-goldens.yml

permissions:
  contents: write
  actions: read

jobs:
  update-goldens:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/memory-editor-stack-f914594
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: temurin
      - name: Download audited CI 931 render
        run: |
          set -euo pipefail
          rm -rf ci931
          mkdir ci931
          gh run download 33321975428 -n JL-Mod-Plus-ci-diagnostics -D ci931
      - name: Extract exact rendered PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import base64

          report = Path('ci931/app/build/reports/screenshotTest/preview/debug/emulator/ru.playsoftware.j2meloader.memory.MemoryEditorScreenshotTestKt.html')
          if not report.is_file():
              raise SystemExit(f'missing screenshot report: {report}')

          wanted = {
              'MemoryEditorLandscapeResultsScreenshot_Memory Editor landscape results_a643207b_0.png',
              'MemoryEditorLandscapeWatchScreenshot_Memory Editor landscape watch_5a0fa3e9_0.png',
              'MemoryEditorPortraitScreenshot_Memory Editor portrait_f8429708_0.png',
          }
          output = Path('app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt')
          output.mkdir(parents=True, exist_ok=True)
          found = set()

          class Images(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag != 'img':
                      return
                  data = dict(attrs)
                  alt = data.get('alt', '')
                  src = data.get('src', '')
                  marker = '/rendered/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/'
                  if marker not in alt or not src.startswith('data:image/png;base64,'):
                      return
                  name = alt.rsplit('/', 1)[-1]
                  if name not in wanted or name in found:
                      return
                  encoded = src.split(',', 1)[1].strip()
                  raw = base64.b64decode(encoded, validate=True)
                  if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit(f'not a PNG: {name}')
                  (output / name).write_bytes(raw)
                  found.add(name)

          parser = Images()
          parser.feed(report.read_text(errors='strict'))
          missing = wanted - found
          if missing:
              raise SystemExit(f'missing rendered screenshots: {sorted(missing)}')
          print('Extracted exact CI #931 renders:')
          for name in sorted(found):
              print(f'  {name}: {(output / name).stat().st_size} bytes')
          PY
      - name: Validate screenshot goldens
        run: ./gradlew --no-daemon --stacktrace :app:validateEmulatorDebugScreenshotTest
      - name: Commit audited goldens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/memory-editor-goldens.yml
          git add app/src/screenshotTestEmulatorDebug/reference/ru/playsoftware/j2meloader/memory/MemoryEditorScreenshotTestKt/
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Update audited Memory Editor screenshot goldens'
          git push origin HEAD:ci/memory-editor-stack-f914594
      - name: Clean temporary refs
        if: always()
        shell: bash
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp-should-not-use" || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp-should-not-use-2" || true
