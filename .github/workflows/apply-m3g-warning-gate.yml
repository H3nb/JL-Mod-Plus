name: Apply M3G warning regression gate

on:
  push:
    branches:
      - agent/m3g-arm64-warning-zero-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/m3g-arm64-warning-zero-v2
          fetch-depth: 0
      - name: Add M3G warning-zero gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one workflow match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '          native_warnings="build/ci-reports/native-warnings.txt"\n          : > "$native_warnings"',
              '          native_warnings="build/ci-reports/native-warnings.txt"\n'
              '          m3g_native_warnings="build/ci-reports/m3g-native-warnings.txt"\n'
              '          : > "$native_warnings"\n'
              '          : > "$m3g_native_warnings"',
          )
          replace_once(
              "            grep -nE 'app/src/main/cpp/.*warning:' \"$assemble_log\" > \"$native_warnings\" || true",
              "            grep -nE 'app/src/main/cpp/.*warning:' \"$assemble_log\" > \"$native_warnings\" || true\n"
              "            grep -nE 'app/src/main/cpp/m3g/.*warning:' \"$assemble_log\" > \"$m3g_native_warnings\" || true",
          )
          replace_once(
              '          native_warning_count="$(wc -l < "$native_warnings" | tr -d \' \')"',
              '          native_warning_count="$(wc -l < "$native_warnings" | tr -d \' \')"\n'
              '          m3g_native_warning_count="$(wc -l < "$m3g_native_warnings" | tr -d \' \')"',
          )
          for variable in (
              'pointer_to_integer_count',
              'integer_to_pointer_count',
              'pointer_integer_compare_count',
              'pointer_type_count',
              'shift_count',
          ):
              prefix = f'          {variable}="'
              lines = [line for line in text.splitlines() if line.startswith(prefix)]
              if len(lines) != 1:
                  raise SystemExit(f'Expected one {variable} line, found {len(lines)}')
              old = lines[0]
              if '$native_warnings' not in old:
                  raise SystemExit(f'{variable} no longer uses native_warnings')
              replace_once(old, old.replace('$native_warnings', '$m3g_native_warnings'))

          replace_once(
              '          - Native compiler warnings captured from app/src/main/cpp: ${native_warning_count}\n'
              '          - Selected native warning categories by Clang diagnostic flag:',
              '          - Native compiler warnings captured from app/src/main/cpp: ${native_warning_count}\n'
              '          - M3G native compiler warnings captured from app/src/main/cpp/m3g: ${m3g_native_warning_count}\n'
              '          - Selected M3G warning categories by Clang diagnostic flag:',
          )

          condition = '$' + "{{ steps.assemble.outcome == 'success' }}"
          gate = (
              '          retention-days: 7\n\n'
              '      - name: Enforce M3G native warning gate\n'
              f'        if: {condition}\n'
              '        shell: bash\n'
              '        run: |\n'
              '          warnings="build/ci-reports/m3g-native-warnings.txt"\n'
              '          if [[ ! -f "$warnings" ]]; then\n'
              '            echo "M3G native warning evidence was not produced."\n'
              '            exit 1\n'
              '          fi\n'
              '          warning_count="$(wc -l < "$warnings" | tr -d \' \')"\n'
              '          if (( warning_count != 0 )); then\n'
              '            echo "M3G native compiler warnings must remain at zero; found $warning_count."\n'
              '            cat "$warnings"\n'
              '            exit 1\n'
              '          fi\n'
              '          echo "M3G native compiler warning gate: 0 warnings"\n\n'
              '      - name: Enforce emulator lint gate'
          )
          replace_once(
              '          retention-days: 7\n\n      - name: Enforce emulator lint gate',
              gate,
          )

          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android.yml
          git commit -m "Enforce zero M3G native compiler warnings"
          git push origin HEAD:agent/m3g-arm64-warning-zero-v2
