name: Apply M3G warning regression gate

on:
  push:
    branches:
      - agent/m3g-arm64-warning-zero-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/m3g-arm64-warning-zero-v2
          fetch-depth: 0
      - name: Add M3G warning-zero gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one workflow match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '          native_warnings="build/ci-reports/native-warnings.txt"\n          : > "$native_warnings"',
              '          native_warnings="build/ci-reports/native-warnings.txt"\n          m3g_native_warnings="build/ci-reports/m3g-native-warnings.txt"\n          : > "$native_warnings"\n          : > "$m3g_native_warnings"',
          )
          replace_once(
              "          if [[ -f \"$assemble_log\" ]]; then\n            grep -nE 'app/src/main/cpp/.*warning:' \"$assemble_log\" > \"$native_warnings\" || true\n          fi\n          native_warning_count=\"$(wc -l < \"$native_warnings\" | tr -d ' ')\"\n          pointer_to_integer_count=\"$(grep -Ec '\\\[-W(pointer-to-int-cast|void-pointer-to-int-cast)\\\]' \"$native_warnings\" || true)\"\n          integer_to_pointer_count=\"$(grep -Ec '\\\[-W(int-to-pointer-cast|int-to-void-pointer-cast)\\\]' \"$native_warnings\" || true)\"\n          pointer_integer_compare_count=\"$(grep -Ec '\\\[-Wpointer-integer-compare\\\]' \"$native_warnings\" || true)\"\n          pointer_type_count=\"$(grep -Ec '\\\[-Wincompatible-pointer-types\\\]' \"$native_warnings\" || true)\"\n          shift_count=\"$(grep -Ec '\\\[-Wshift-negative-value\\\]' \"$native_warnings\" || true)\"",
              "          if [[ -f \"$assemble_log\" ]]; then\n            grep -nE 'app/src/main/cpp/.*warning:' \"$assemble_log\" > \"$native_warnings\" || true\n            grep -nE 'app/src/main/cpp/m3g/.*warning:' \"$assemble_log\" > \"$m3g_native_warnings\" || true\n          fi\n          native_warning_count=\"$(wc -l < \"$native_warnings\" | tr -d ' ')\"\n          m3g_native_warning_count=\"$(wc -l < \"$m3g_native_warnings\" | tr -d ' ')\"\n          pointer_to_integer_count=\"$(grep -Ec '\\\[-W(pointer-to-int-cast|void-pointer-to-int-cast)\\\]' \"$m3g_native_warnings\" || true)\"\n          integer_to_pointer_count=\"$(grep -Ec '\\\[-W(int-to-pointer-cast|int-to-void-pointer-cast)\\\]' \"$m3g_native_warnings\" || true)\"\n          pointer_integer_compare_count=\"$(grep -Ec '\\\[-Wpointer-integer-compare\\\]' \"$m3g_native_warnings\" || true)\"\n          pointer_type_count=\"$(grep -Ec '\\\[-Wincompatible-pointer-types\\\]' \"$m3g_native_warnings\" || true)\"\n          shift_count=\"$(grep -Ec '\\\[-Wshift-negative-value\\\]' \"$m3g_native_warnings\" || true)\"",
          )
          replace_once(
              '          - Native compiler warnings captured from app/src/main/cpp: ${native_warning_count}\n          - Selected native warning categories by Clang diagnostic flag:',
              '          - Native compiler warnings captured from app/src/main/cpp: ${native_warning_count}\n          - M3G native compiler warnings captured from app/src/main/cpp/m3g: ${m3g_native_warning_count}\n          - Selected M3G warning categories by Clang diagnostic flag:',
          )
          replace_once(
              '          retention-days: 7\n\n      - name: Enforce emulator lint gate',
              '''          retention-days: 7

      - name: Enforce M3G native warning gate
        if: ${{ steps.assemble.outcome == 'success' }}
        shell: bash
        run: |
          warnings="build/ci-reports/m3g-native-warnings.txt"
          if [[ ! -f "$warnings" ]]; then
            echo "M3G native warning evidence was not produced."
            exit 1
          fi
          warning_count="$(wc -l < "$warnings" | tr -d ' ')"
          if (( warning_count != 0 )); then
            echo "M3G native compiler warnings must remain at zero; found $warning_count."
            cat "$warnings"
            exit 1
          fi
          echo "M3G native compiler warning gate: 0 warnings"

      - name: Enforce emulator lint gate''',
          )

          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android.yml
          git commit -m "Enforce zero M3G native compiler warnings"
          git push origin HEAD:agent/m3g-arm64-warning-zero-v2
