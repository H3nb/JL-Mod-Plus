name: Performance overlay interaction contracts

on:
  pull_request:
    branches: [alpha, main]
    paths:
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/ConfigComposeBridge.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/config/PerformanceOverlayOptions.java'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/ui/AdaptiveDialog.kt'
      - 'app/src/main/java/io/github/h3nb/jlmodplus/ui/ScrollableContentHint.kt'
      - 'app/src/androidTest/java/io/github/h3nb/jlmodplus/config/PerformanceOverlayOptionsComposeTest.kt'
      - 'app/src/androidTest/java/javax/microedition/lcdui/overlay/PerformanceOverlayRenderingTest.java'
      - '.github/workflows/performance-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-overlay-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Overlay interaction and rendering (API 35)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew

      - name: Run overlay interaction and native rendering contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --daemon --stacktrace -PjlmodNativeBuild=false -PjlmodRuntimeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.h3nb.jlmodplus.config.PerformanceOverlayOptionsComposeTest,javax.microedition.lcdui.overlay.PerformanceOverlayRenderingTest :app:connectedEmulatorDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-overlay-api35
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
